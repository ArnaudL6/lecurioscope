{ id: 'observation', label: 'Observation', icon: '🕵️', tag: "Repère l'intrus, le détail…", color: '#fbbf24' }];


function ScreenCrack({ profile }) {
  const [phase, setPhase] = useState('loading');
  const [enigma, setEnigma] = useState(null);
  const [sel, setSel] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);
  const [answer, setAnswer] = useState('');
  const [attempts, setAttempts] = useState(0);
  const [result, setResult] = useState(null); // 'correct'|'wrong'|'revealed'
  const [revealed, setRevealed] = useState(false);
  const [revealedAnswer, setRevealedAnswer] = useState('');
  const cd = useCountdown();
  const today = () => {const d = new Date();return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');};
  const MAX_ATTEMPTS = 3;
  const HINT_COST = 50;
  const [hintVisible, setHintVisible] = useState(false);
  const [hintUsed, setHintUsed] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(EDGE_CRACK, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON } });
        if (res.ok) {const { enigma: e, choice } = await res.json();if (e) {setEnigma(e);setPhase('enigma');return;}}
      } catch (e) {}
      setPhase('pick');
    })();
  }, []);

  async function generate() {
    if (!sel || generating) return;
    setGenerating(true);setError(null);
    try {
      const cat = CRACK_CATS.find((c) => c.id === sel);
      const res = await fetch(EDGE_CRACK, { method: 'POST', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ categoryId: sel, chooser: (profile?.username || 'Visiteur') }) });
      if (!res.ok) {const errBody = await res.json().catch(() => ({}));throw new Error((errBody.error || 'Erreur') + ' (' + res.status + ')');}
      const { enigma: e } = await res.json();
      if (!e) throw new Error('Génération échouée');
      setEnigma(e);setPhase('enigma');
    } catch (e) {setError(e.message);}
    setGenerating(false);
  }

  async function submitAnswer() {
    if (!answer.trim() || attempts >= MAX_ATTEMPTS || revealed) return;
    try {
      const res = await fetch(EDGE_CRACK, { method: 'POST', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'check_answer', enigmaId: enigma.id, userAnswer: answer.trim() }) });
      if (res.ok) {
        const d = await res.json();
        if (d.correct) {setResult('correct');setRevealedAnswer(d.answer || answer);setRevealed(true);} else
        {
          const na = attempts + 1;setAttempts(na);
          if (na >= MAX_ATTEMPTS) {setRevealedAnswer(d.answer || '');setResult('revealed');setRevealed(true);} else
          {setResult('wrong');setAnswer('');}
        }
      }
    } catch (e) {setResult('wrong');setAnswer('');}
  }

  async function revealWithoutAnswer() {
    try {
      const res = await fetch(EDGE_CRACK, { method: 'POST', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'check_answer', enigmaId: enigma.id, userAnswer: '' }) });
      if (res.ok) {const d = await res.json();setRevealedAnswer(d.answer || '');}
    } catch (e) {}
    setResult('revealed');setRevealed(true);
  }

  const cat = CRACK_CATS.find((c) => c.id === enigma?.category) || CRACK_CATS[0];

  if (phase === 'loading') return (
    <div style={{ width: '100%', paddingTop: '2rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
      {[60, 160, 80].map((h, i) => <div key={i} style={{ height: h, background: 'var(--s1)', borderRadius: '1rem', animation: 'psk 1.5s ease-in-out infinite', animationDelay: i * .15 + 's' }} />)}
    </div>);


  if (generating) {const c = CRACK_CATS.find((x) => x.id === sel) || { label: 'Enigme', icon: '🔐', color: CRACK_COLOR };return <ScreenGenerating theme={c} />;}

  // ── ÉNIGME ──
  if (phase === 'enigma' && enigma) {
    return (
      <div style={{ width: '100%' }}>
        {/* Topbar */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.55rem', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '.65rem', fontWeight: 700, letterSpacing: '.1em', color: cat.color, background: `color-mix(in srgb,${cat.color} 14%,transparent)`, border: `1px solid color-mix(in srgb,${cat.color} 32%,transparent)`, borderRadius: '999px', padding: '.25rem .75rem', textTransform: 'uppercase' }}>{cat.icon} {cat.label}</span>
            {enigma.difficulty && <span style={{ fontSize: '.6rem', color: 'var(--ink3)', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '999px', padding: '.22rem .65rem' }}>{{ easy: '⚡ Facile', medium: '🔥 Intermédiaire', hard: '💀 Difficile' }[enigma.difficulty] || 'Intermédiaire'}</span>}
          </div>
          {enigma.chooser && <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: '.52rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: '.1rem' }}>Choisi par</div>
            <div style={{ fontSize: '.75rem', fontWeight: 700, color: cat.color }}>{enigma.chooser}</div>
          </div>}
        </div>

        {/* Question card */}
        <div style={{ background: `color-mix(in srgb,${cat.color} 7%,var(--hero-base))`, border: `1px solid color-mix(in srgb,${cat.color} 28%,transparent)`, borderRadius: '1.25rem', padding: '1.5rem 1.4rem', marginBottom: '1rem', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: '-60px', right: '-60px', width: '200px', height: '200px', background: `radial-gradient(circle,color-mix(in srgb,${cat.color} 12%,transparent),transparent 70%)`, pointerEvents: 'none' }} />
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.18em', color: cat.color, textTransform: 'uppercase', marginBottom: '.75rem', position: 'relative' }}>🔐 L'énigme du jour</div>
          <div style={{ fontSize: '1rem', color: 'var(--ink)', lineHeight: 1.75, fontWeight: 500, position: 'relative' }}>{enigma.question}</div>
          {enigma.hint && !revealed &&
          <div style={{ marginTop: '1rem' }}>
              {!hintVisible ?
            <button onClick={() => {setHintVisible(true);setHintUsed(true);}} style={{ display: 'flex', alignItems: 'center', gap: '.5rem', background: `color-mix(in srgb,${cat.color} 8%,transparent)`, border: `1px solid color-mix(in srgb,${cat.color} 22%,transparent)`, borderRadius: '.75rem', padding: '.5rem .9rem', cursor: 'pointer', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', color: cat.color, fontWeight: 600 }}>
                  🔍 Type de code <span style={{ fontSize: '.62rem', color: 'var(--ink3)', fontWeight: 400 }}>(-{HINT_COST} XP)</span>
                </button> :

            <div style={{ padding: '.65rem .9rem', background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.08)', borderRadius: '.75rem', fontSize: '.75rem', color: 'var(--ink2)', lineHeight: 1.6 }}>
                  💡 {enigma.hint} <span style={{ color: 'var(--ink3)', fontSize: '.65rem', marginLeft: '.3rem' }}>(-{HINT_COST} XP utilisé)</span>
                </div>
            }
            </div>
          }
        </div>

        {/* Answer area */}
        {!revealed ?
        <div style={{ marginBottom: '1rem' }}>
            <div style={{ display: 'flex', gap: '.5rem', marginBottom: '.5rem' }}>
              <input value={answer} onChange={(e) => setAnswer(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submitAnswer()}
            placeholder="Ta réponse…" disabled={attempts >= MAX_ATTEMPTS}
            style={{ flex: 1, background: 'rgba(0,0,0,.3)', border: `1px solid color-mix(in srgb,${cat.color} 30%,transparent)`, borderRadius: '.75rem', color: 'var(--ink)', fontSize: '.88rem', padding: '.65rem 1rem', outline: 'none', fontFamily: 'Space Grotesk,sans-serif', transition: 'border-color .2s' }}
            onFocus={(e) => e.target.style.borderColor = cat.color}
            onBlur={(e) => e.target.style.borderColor = `color-mix(in srgb,${cat.color} 30%,transparent)`} />
              <button onClick={submitAnswer} disabled={!answer.trim() || attempts >= MAX_ATTEMPTS}
            style={{ padding: '.65rem 1.1rem', background: `color-mix(in srgb,${cat.color} 80%,#000)`, border: 'none', borderRadius: '.75rem', color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, fontSize: '.78rem', cursor: 'pointer', flexShrink: 0 }}>
                Valider
              </button>
            </div>
            {/* Attempts */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ display: 'flex', gap: '.3rem' }}>
                {[0, 1, 2].map((i) => <div key={i} style={{ width: '8px', height: '8px', borderRadius: '50%', background: i < attempts ? '#f87171' : 'rgba(255,255,255,.12)' }} />)}
                <span style={{ fontSize: '.6rem', color: 'var(--ink3)', marginLeft: '.35rem' }}>{MAX_ATTEMPTS - attempts} tentative{MAX_ATTEMPTS - attempts > 1 ? 's' : ''} restante{MAX_ATTEMPTS - attempts > 1 ? 's' : ''}</span>
              </div>
              <button onClick={revealWithoutAnswer} style={{ fontSize: '.6rem', color: 'var(--ink3)', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline', fontFamily: 'Space Grotesk,sans-serif' }}>Révéler</button>
            </div>
            {result === 'wrong' && <div style={{ marginTop: '.5rem', padding: '.55rem .8rem', background: 'rgba(248,113,113,.1)', border: '1px solid rgba(248,113,113,.25)', borderRadius: '.65rem', fontSize: '.75rem', color: '#f87171' }}>❌ Mauvaise réponse, réessaie !</div>}
          </div> : (

        /* Result */
        <div style={{ marginBottom: '1rem' }}>
            {result === 'correct' && <div style={{ padding: '.85rem 1rem', background: 'rgba(52,211,153,.12)', border: '1px solid rgba(52,211,153,.3)', borderRadius: '1rem', fontSize: '.85rem', color: '#34d399', fontWeight: 600, textAlign: 'center', marginBottom: '1rem' }}>✅ Bravo ! <em style={{ color: 'var(--ink)', fontStyle: 'normal' }}>"{revealedAnswer}"</em> est la bonne réponse !</div>}
            {(result === 'revealed' || result === 'wrong') && revealedAnswer && <div style={{ padding: '.85rem 1rem', background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.1)', borderRadius: '1rem', fontSize: '.82rem', color: 'var(--ink2)', marginBottom: '1rem', textAlign: 'center' }}>La réponse était : <strong style={{ color: 'var(--ink)' }}>{revealedAnswer}</strong></div>}
          </div>)
        }

        {/* Carte du savoir (post-révélation) */}
        {revealed && enigma.explanation &&
        <div style={{ background: `color-mix(in srgb,${cat.color} 5%,transparent)`, border: `1px solid color-mix(in srgb,${cat.color} 18%,transparent)`, borderRadius: '1rem', padding: '1rem 1.1rem', marginBottom: '1rem' }}>
            <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: cat.color, textTransform: 'uppercase', marginBottom: '.5rem' }}>📖 Comment ça marche ?</div>
            <div style={{ fontSize: '.82rem', color: 'var(--ink2)', lineHeight: 1.75 }}>{enigma.explanation}</div>
            {enigma.fun_fact && <div style={{ marginTop: '.75rem', paddingTop: '.75rem', borderTop: `1px solid color-mix(in srgb,${cat.color} 12%,transparent)`, fontSize: '.78rem', color: 'var(--ink3)', lineHeight: 1.7 }}>💡 {enigma.fun_fact}</div>}
          </div>
        }

        <CommentsSection contentType="enigme" contentId={todayStr()} color={cat.color} />
        {/* Footer */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '.85rem 1rem', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem' }}>
          <div style={{ fontSize: '.58rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em' }}>Prochaine énigme</div>
          <div style={{ fontFamily: 'monospace', fontSize: '.9rem', fontWeight: 700, color: cat.color, letterSpacing: '.05em' }}>{cd}</div>
        </div>
      </div>);

  }

  // ── PICK ──
  return (
    <div style={{ width: '100%' }}>
      <div style={{ marginBottom: '2rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.2em', color: CRACK_COLOR, textTransform: 'uppercase', display: 'flex', alignItems: 'center', gap: '.45rem' }}>
            <span style={{ width: '20px', height: '1px', background: CRACK_COLOR, display: 'inline-block' }} />Premier visiteur du jour
          </div>
        </div>
        <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: 'clamp(1.6rem,3.5vw,2.2rem)', fontWeight: 800, letterSpacing: '-.02em', color: 'var(--ink)', textTransform: 'uppercase', lineHeight: 1.1, marginBottom: '.85rem' }}>
          Crack<br /><span style={{ color: CRACK_COLOR }}>le code !</span>
        </div>
        <p style={{ fontSize: '.78rem', color: 'var(--ink3)', lineHeight: 1.75, maxWidth: 420 }}>Choisis un type d'énigme : tout le monde a <em style={{ color: 'var(--ink2)', fontStyle: 'normal', fontWeight: 600 }}>3 tentatives</em> pour la résoudre.</p>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,minmax(0,1fr))', gap: '.6rem', marginBottom: '2rem' }}>
        {CRACK_CATS.map((c) =>
        <div key={c.id} onClick={() => setSel(c.id)}
        style={{ background: sel === c.id ? `color-mix(in srgb,${c.color} 14%,var(--bg))` : `color-mix(in srgb,${c.color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${c.color} ${sel === c.id ? 60 : 28}%,transparent)`, borderRadius: '1rem', padding: '1rem 1.1rem', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '.85rem', transition: 'all .18s', boxShadow: sel === c.id ? `0 6px 20px color-mix(in srgb,${c.color} 22%,transparent)` : 'none' }}
        onMouseEnter={(e) => {if (sel !== c.id) {e.currentTarget.style.borderColor = `color-mix(in srgb,${c.color} 48%,transparent)`;e.currentTarget.style.background = `color-mix(in srgb,${c.color} 10%,var(--bg))`;}}}
        onMouseLeave={(e) => {if (sel !== c.id) {e.currentTarget.style.borderColor = `color-mix(in srgb,${c.color} 28%,transparent)`;e.currentTarget.style.background = `color-mix(in srgb,${c.color} 6%,var(--bg))`;}}}>
            <span style={{ fontSize: '1.4rem', flexShrink: 0, lineHeight: 1 }}>{c.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '.85rem', fontWeight: 700, color: sel === c.id ? 'var(--ink)' : 'var(--ink2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.label}</div>
              <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{c.tag}</div>
            </div>
            {sel === c.id && <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: c.color, flexShrink: 0, boxShadow: `0 0 10px ${c.color}` }} />}
          </div>
        )}
      </div>
      <button disabled={!sel} onClick={generate}
      style={{ width: '100%', padding: '.88rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.76rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: sel ? CRACK_COLOR : 'rgba(239,68,68,.06)', color: sel ? '#fff' : 'rgba(239,68,68,.4)', border: sel ? 'none' : '1px solid rgba(239,68,68,.2)', borderRadius: '.75rem', cursor: sel ? 'pointer' : 'default', transition: 'all .22s', boxShadow: sel ? '0 4px 20px rgba(239,68,68,.3),0 2px 0 #991b1b' : 'none' }}>
        Générer l'énigme →
      </button>
      {error && <div style={{ marginTop: '.75rem', padding: '.65rem .9rem', background: 'rgba(248,113,113,.1)', border: '1px solid rgba(248,113,113,.3)', borderRadius: '.65rem', fontSize: '.75rem', color: '#f87171', textAlign: 'center' }}>⚠️ {error}</div>}
    </div>);

}

// ── MAIS DIS MOI ? ──
const MDM_COLOR = '#818cf8';
const MDM_CATS = [
{ id: 'tech', label: 'Tech & Écrans', icon: '📺', tag: 'Télé, WiFi, 4G, streaming…', color: '#818cf8' },
{ id: 'internet', label: 'Internet & GPS', icon: '🌐', tag: 'Comment ça route vraiment ?', color: '#00c8ff' },
{ id: 'maison', label: 'Maison & Appareils', icon: '🏠', tag: 'Frigo, micro-ondes, lave-linge…', color: '#f97316' },
{ id: 'energie', label: 'Énergie', icon: '🔋', tag: 'Électricité, batterie, solaire…', color: '#fbbf24' },
{ id: 'transport', label: 'Transport', icon: '🚗', tag: 'Moteur, avion, vélo élec…', color: '#22c55e' },
{ id: 'corps', label: 'Corps humain', icon: '🧬', tag: 'Digestion, sommeil, mémoire…', color: '#ec4899' },
{ id: 'aliment', label: 'Alimentation', icon: '🍕', tag: 'Levure, café, chocolat, pain…', color: '#d97706' },
{ id: 'son', label: 'Son & Musique', icon: '🎵', tag: 'Bluetooth, vinyle, micro, enceinte…', color: '#a855f7' },
{ id: 'meteo', label: 'Météo & Nature', icon: '🌤', tag: 'Nuages, tonnerre, arc-en-ciel…', color: '#14b8a6' },
{ id: 'argent', label: 'Argent & Finance', icon: '💰', tag: 'Carte bleue, ATM, Bitcoin…', color: '#10b981' }];

const EDGE_MDM = SB_URL + '/functions/v1/mais-dis-moi';

function ScreenMDM({ profile, onNav }) {
  const [phase, setPhase] = useState('loading');
  const [content, setContent] = useState(null);
  const [sel, setSel] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);
  const [fav, setFav] = useState(false);
  const today = () => {const d = new Date();return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');};
  const dayOfYear = () => {const n = new Date(),s = new Date(n.getFullYear(), 0, 0);return Math.floor((n - s) / 86400000);};
  const daysInYear = () => {const y = new Date().getFullYear();return y % 4 === 0 && y % 100 !== 0 || y % 400 === 0 ? 366 : 365;};
  const cd = useCountdown();

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(EDGE_MDM + '?date=' + today() + '&_t=' + Date.now(), { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON } });
        if (res.ok) {const json = await res.json();if (json.content || json.explanation) {setContent(json);setPhase('content');return;}}
      } catch (e) {}
      setPhase('pick');
    })();
  }, []);

  async function generate() {
    if (!sel || generating) return;
    setGenerating(true);setError(null);
    try {
      const cat = MDM_CATS.find((c) => c.id === sel);
      const res = await fetch(EDGE_MDM, { method: 'POST', headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ categoryId: sel, category: cat?.label, date: today(), chooser: (profile?.username || 'Visiteur') }) });
      if (!res.ok) throw new Error('Erreur serveur ' + res.status);
      const json = await res.json();
      if (!json.content && !json.explanation) throw new Error('Génération échouée');
      setContent(json);setPhase('content');
    } catch (e) {setError(e.message);}
    setGenerating(false);
  }

  if (phase === 'loading') return (
    <div style={{ width: '100%', paddingTop: '2rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
      {[160, 48, 48].map((h, i) => <div key={i} style={{ height: h, background: 'var(--s1)', borderRadius: '1rem', animation: 'psk 1.5s ease-in-out infinite', animationDelay: i * .15 + 's' }} />)}
    </div>);


  if (generating) {const cat = MDM_CATS.find((c) => c.id === sel) || { label: 'Concept', icon: '🔍', color: MDM_COLOR };return <ScreenGenerating theme={cat} />;}

  if (phase === 'content' && content) {
    const catColor = MDM_CATS.find((c) => c.id === (content.categoryId || content.category_id))?.color || MDM_COLOR;
    const title = content.title || content.concept || 'Mais dis moi…';
    const explanation = content.explanation || content.content || '';
    const analogy = content.analogy || '';
    const funFact = content.fun_fact || content.funFact || '';
    return (
      <div style={{ width: '100%' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '.5rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.55rem', flexWrap: 'wrap' }}>
            <span style={{ fontSize: '.65rem', fontWeight: 700, letterSpacing: '.1em', color: catColor, background: `color-mix(in srgb,${catColor} 14%,transparent)`, border: `1px solid color-mix(in srgb,${catColor} 32%,transparent)`, borderRadius: '999px', padding: '.25rem .75rem', textTransform: 'uppercase' }}>🔍 Mais dis moi ?</span>
            <span style={{ fontSize: '.62rem', color: 'var(--ink3)', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '999px', padding: '.22rem .65rem' }}>Jour {dayOfYear()}/{daysInYear()}</span>
          </div>
          {content.chooser && <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: '.52rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: '.1rem' }}>Choisi par</div>
            <div style={{ fontSize: '.75rem', fontWeight: 700, color: catColor }}>{content.chooser}</div>
          </div>}
        </div>
        <div style={{ background: `color-mix(in srgb,${catColor} 7%,var(--hero-base))`, border: `1px solid color-mix(in srgb,${catColor} 28%,transparent)`, borderRadius: '1.25rem', padding: '1.5rem 1.4rem', marginBottom: '1rem', position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: '-60px', right: '-60px', width: '200px', height: '200px', background: `radial-gradient(circle,color-mix(in srgb,${catColor} 14%,transparent),transparent 70%)`, pointerEvents: 'none' }} />
          <div style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.18em', color: catColor, textTransform: 'uppercase', marginBottom: '.6rem', position: 'relative' }}>Mais dis moi…</div>
          <div style={{ fontSize: 'clamp(1.1rem,3vw,1.4rem)', fontWeight: 800, color: 'var(--ink)', lineHeight: 1.25, marginBottom: '1rem', position: 'relative', fontFamily: "\"Space Grotesk\"" }}>{title}</div>
          <div style={{ fontSize: '.95rem', lineHeight: 1.85, color: 'var(--ink)', position: 'relative' }}>{explanation}</div>
        </div>
        {analogy && <div style={{ background: 'rgba(255,255,255,.02)', border: `1px solid color-mix(in srgb,${catColor} 15%,transparent)`, borderRadius: '1rem', padding: '1rem 1.1rem', marginBottom: '1rem' }}>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: catColor, textTransform: 'uppercase', marginBottom: '.5rem' }}>🎯 Pour mieux comprendre</div>
          <div style={{ fontSize: '.82rem', color: 'var(--ink2)', lineHeight: 1.75, fontStyle: 'italic' }}>{analogy}</div>
        </div>}
        {funFact && <div style={{ background: `color-mix(in srgb,${catColor} 5%,transparent)`, border: `1px solid color-mix(in srgb,${catColor} 18%,transparent)`, borderRadius: '1rem', padding: '1rem 1.1rem', marginBottom: '1rem' }}>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: catColor, textTransform: 'uppercase', marginBottom: '.5rem' }}>💡 Le saviez-vous ?</div>
          <div style={{ fontSize: '.82rem', color: 'var(--ink2)', lineHeight: 1.75 }}>{funFact}</div>
        </div>}
        <div style={{ display: 'flex', gap: '.5rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
          <button className={`btn-share${fav ? ' on' : ''}`} onClick={() => setFav((f) => !f)}>{fav ? '🧡 Favori' : '🤍 Favori'}</button>
          <button className="btn-share">↗ Partager</button>
        </div>
        <CommentsSection contentType="mdm" contentId={todayStr()} color={catColor} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '.85rem 1rem', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem' }}>
          <div style={{ fontSize: '.58rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em' }}>Prochain concept</div>
          <div style={{ fontFamily: 'monospace', fontSize: '.9rem', fontWeight: 700, color: catColor, letterSpacing: '.05em' }}>{cd}</div>
        </div>
      </div>);

  }

  // Pick screen
  return (
    <div style={{ width: '100%' }}>
      <div style={{ marginBottom: '2rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.2em', color: MDM_COLOR, textTransform: 'uppercase', display: 'flex', alignItems: 'center', gap: '.45rem' }}>
            <span style={{ width: '20px', height: '1px', background: MDM_COLOR, display: 'inline-block' }} />Premier visiteur du jour
          </div>
          <span style={{ fontSize: '.58rem', color: 'var(--ink3)', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '2rem', padding: '.22rem .65rem' }}>Jour {dayOfYear()}/{daysInYear()}</span>
        </div>
        <div style={{ fontSize: 'clamp(1.6rem,3.5vw,2.2rem)', fontWeight: 800, letterSpacing: '-.02em', color: 'var(--ink)', textTransform: 'uppercase', lineHeight: 1.1, marginBottom: '.85rem', fontFamily: "\"Space Grotesk\"" }}>
          Mais dis moi,<br /><span style={{ color: MDM_COLOR }}>c'est quoi ça ?</span>
        </div>
        <p style={{ fontSize: '.78rem', color: 'var(--ink3)', lineHeight: 1.75, maxWidth: 420 }}>Ton choix définit le concept expliqué pour <em style={{ color: 'var(--ink2)', fontStyle: 'normal', fontWeight: 600 }}>tous</em> les visiteurs d'aujourd'hui.</p>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,minmax(0,1fr))', gap: '.6rem', marginBottom: '2rem' }}>
        {MDM_CATS.map((c) =>
        <div key={c.id} onClick={() => setSel(c.id)}
        style={{ background: sel === c.id ? `color-mix(in srgb,${c.color} 14%,var(--bg))` : `color-mix(in srgb,${c.color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${c.color} ${sel === c.id ? 60 : 28}%,transparent)`, borderRadius: '1rem', padding: '1rem 1.1rem', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '.85rem', transition: 'all .18s', boxShadow: sel === c.id ? `0 6px 20px color-mix(in srgb,${c.color} 22%,transparent)` : 'none' }}
        onMouseEnter={(e) => {if (sel !== c.id) {e.currentTarget.style.borderColor = `color-mix(in srgb,${c.color} 48%,transparent)`;e.currentTarget.style.background = `color-mix(in srgb,${c.color} 10%,var(--bg))`;}}}
        onMouseLeave={(e) => {if (sel !== c.id) {e.currentTarget.style.borderColor = `color-mix(in srgb,${c.color} 28%,transparent)`;e.currentTarget.style.background = `color-mix(in srgb,${c.color} 6%,var(--bg))`;}}}>
            <span style={{ fontSize: '1.4rem', flexShrink: 0, lineHeight: 1 }}>{c.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: '.85rem', fontWeight: 700, color: sel === c.id ? 'var(--ink)' : 'var(--ink2)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.label}</div>
              <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{c.tag}</div>
            </div>
            {sel === c.id && <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: c.color, flexShrink: 0, boxShadow: `0 0 10px ${c.color}` }} />}
          </div>
        )}
      </div>
      <button disabled={!sel} onClick={generate}
      style={{ width: '100%', padding: '.88rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.76rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: sel ? MDM_COLOR : 'rgba(129,140,248,.06)', color: sel ? '#fff' : 'rgba(129,140,248,.45)', border: sel ? 'none' : '1px solid rgba(129,140,248,.2)', borderRadius: '.75rem', cursor: sel ? 'pointer' : 'default', transition: 'all .22s', boxShadow: sel ? '0 4px 20px rgba(129,140,248,.3),0 2px 0 #4338ca' : 'inset 0 0 12px rgba(129,140,248,.04)' }}>
        Générer le concept →
      </button>
      {error && <div style={{ marginTop: '.75rem', padding: '.65rem .9rem', background: 'rgba(248,113,113,.1)', border: '1px solid rgba(248,113,113,.3)', borderRadius: '.65rem', fontSize: '.75rem', color: '#f87171', textAlign: 'center' }}>⚠️ {error}</div>}
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
