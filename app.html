function ScreenPartiePrivee({ onBack }) {
  const PP = '#00c8ff';
  const RC2 = { E: '#9ca3af', D: '#22c55e', C: '#00c8ff', B: '#a855f7', A: '#fbbf24', S: '#ef4444' };
  const PP_BOTS = [
  { name: 'Shadowbane', rank: 'B', sr: 0.78 },
  { name: 'Foxglove', rank: 'C', sr: 0.55 },
  { name: 'Ironveil', rank: 'A', sr: 0.84 },
  { name: 'Mistral', rank: 'E', sr: 0.38 },
  { name: 'Vexclaw', rank: 'D', sr: 0.62 }];

  const [phase, setPhase] = useState('lobby');
  const [isHost, setIsHost] = useState(false);
  const [roomCode] = useState(() => String(Math.floor(1000 + Math.random() * 9000)));
  const [joinCode, setJoinCode] = useState('');
  const [players, setPlayers] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [timeLeft, setTimeLeft] = useState(20);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [botAnswers, setBotAnswers] = useState({});
  const [answeredCount, setAnsweredCount] = useState(0);
  const [scores, setScores] = useState({});
  const [readMap, setReadMap] = useState({});
  const [revealData, setRevealData] = useState(null);
  const timerRef = useRef(null);
  const botTimersRef = useRef([]);
  const scRef = useRef({});

  function makeBots(n) {
    return PP_BOTS.slice(0, n).map((b, i) => ({ id: 'bot_' + i, name: b.name, rank: b.rank, color: RC2[b.rank], successRate: b.sr, isBot: true }));
  }

  function createRoom() {
    setIsHost(true);setPlayers([]);setPhase('waiting');
    const bots = makeBots(2 + Math.floor(Math.random() * 3));
    bots.forEach((b, i) => setTimeout(() => setPlayers((p) => [...p, b]), 1200 + i * 900));
  }

  function joinRoom() {
    if (joinCode.length !== 4) return;
    setIsHost(false);
    setPlayers(makeBots(2 + Math.floor(Math.random() * 3)));
    setPhase('waiting');
  }

  async function loadAndStart(ps) {
    setPhase('loading');
    let qs = [];
    let myReadSet = new Set();
    try {
      const user = (await sb.auth.getUser()).data?.user;
      if (user) {
        const { data: reads } = await sb.from('reads').select('anecdote_id').eq('user_id', user.id);
        const ids = (reads || []).map((r) => r.anecdote_id);
        myReadSet = new Set(ids.map(String));
        if (ids.length) {
          const { data: rqs } = await sb.from('questions').select('*').in('anecdote_id', ids);
          if (rqs && rqs.length >= 4)
          qs = [...rqs].sort(() => Math.random() - .5).slice(0, 10).
          map((q) => ({ question: q.question, answers: q.options, correctIdx: q.answer, explanation: q.explanation || '', anecdote_id: q.anecdote_id }));
        }
      }
    } catch (e) {}
    if (!qs.length) qs = [...FALLBACK_VS100].sort(() => Math.random() - .5).slice(0, 10).map((q) => ({ ...q, anecdote_id: null }));
    const rm = {};
    qs.forEach((q, i) => {
      const s = new Set();
      if (myReadSet.has(String(q.anecdote_id))) s.add('me');
      ps.forEach((p) => {if (Math.random() > 0.45) s.add(p.id);});
      rm[i] = s;
    });
    const sc = { me: 0 };
    ps.forEach((p) => {sc[p.id] = 0;});
    scRef.current = { ...sc };
    setReadMap(rm);setScores(sc);setQuestions(qs);
    beginQ(qs, 0, ps, rm, { ...sc });
  }

  function beginQ(qs, qi, ps, rm, sc) {
    clearInterval(timerRef.current);
    botTimersRef.current.forEach(clearTimeout);
    setSelected(null);setAnswered(false);setBotAnswers({});setAnsweredCount(0);
    setQIdx(qi);setPhase('question');
    let t = 20;setTimeLeft(t);
    const ba = {};
    botTimersRef.current = ps.map((p) => {
      const delay = 2500 + Math.random() * 13000;
      return setTimeout(() => {
        const q = qs[qi];
        const ok = Math.random() < p.successRate;
        ba[p.id] = ok ? q.correctIdx : (q.correctIdx + 1 + Math.floor(Math.random() * 3)) % q.answers.length;
        setBotAnswers((prev) => ({ ...prev, [p.id]: ba[p.id] }));
        setAnsweredCount((prev) => prev + 1);
      }, delay);
    });
    timerRef.current = setInterval(() => {
      t--;setTimeLeft(t);
      if (t <= 0) {
        clearInterval(timerRef.current);
        ps.forEach((p) => {if (!(p.id in ba)) ba[p.id] = null;});
        setBotAnswers({ ...ba });
        doReveal(qs, qi, ps, null, { ...ba }, rm, sc);
      }
    }, 1000);
  }

  function handleAnswer(chosen) {
    if (answered) return;
    clearInterval(timerRef.current);
    botTimersRef.current.forEach(clearTimeout);
    setSelected(chosen);setAnswered(true);
    const q = questions[qIdx];
    const ba = { ...botAnswers };
    players.forEach((p) => {
      if (!(p.id in ba)) {
        const ok = Math.random() < p.successRate;
        ba[p.id] = ok ? q.correctIdx : (q.correctIdx + 1 + Math.floor(Math.random() * 3)) % q.answers.length;
      }
    });
    setBotAnswers(ba);setAnsweredCount(players.length);
    setTimeout(() => doReveal(questions, qIdx, players, chosen, ba, readMap, scRef.current), 700);
  }

  function doReveal(qs, qi, ps, myAns, ba, rm, sc) {
    const q = qs[qi];
    const myOk = myAns === q.correctIdx;
    const myRead = rm[qi]?.has('me') || false;
    const myBonus = myOk && !myRead ? 50 : 0;
    const myPts = myOk ? 100 + myBonus : 0;
    const playerResults = ps.map((p) => {
      const ans = ba[p.id];
      const ok = ans === q.correctIdx;
      const hadRead = rm[qi]?.has(p.id) || false;
      const bonus = ok && !hadRead ? 50 : 0;
      return { ...p, answer: ans, ok, hadRead, pts: ok ? 100 + bonus : 0, bonus };
    });
    const newSc = { ...sc, me: (sc.me || 0) + myPts };
    playerResults.forEach((p) => {newSc[p.id] = (newSc[p.id] || 0) + p.pts;});
    scRef.current = newSc;
    setScores(newSc);
    setRevealData({ q, myAns, myOk, myRead, myBonus, myPts, playerResults, qi, total: qs.length });
    setPhase('reveal');
  }

  function goNext() {
    const next = qIdx + 1;
    if (next >= questions.length) {setPhase('end');return;}
    setPhase('interlude');
    setTimeout(() => beginQ(questions, next, players, readMap, scRef.current), 2500);
  }

  const bkBtn = { background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '.72rem', fontFamily: 'Space Grotesk,sans-serif', marginBottom: '1.5rem', padding: 0, display: 'block' };
  const allPl = [{ id: 'me', name: 'Vous', rank: 'C', color: PP }, ...players];
  const q = questions[qIdx];

  if (phase === 'lobby') return (
    <div style={{ width: '100%' }}>
      <button onClick={onBack} style={bkBtn}>← Retour</button>
      <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: PP, textTransform: 'uppercase', marginBottom: '.4rem' }}>🎮 C-RANG · PARTIE PRIVÉE</div>
        <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '2rem', fontWeight: 800, textTransform: 'uppercase', color: 'var(--ink)' }}>Partie Privée</div>
        <div style={{ fontSize: '.75rem', color: 'var(--ink3)', marginTop: '.3rem' }}>Temps réel · illimité · questions de tes anecdotes</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '.75rem' }}>
        <div onClick={createRoom} style={{ background: `color-mix(in srgb,${PP} 8%,var(--s1))`, border: `1px solid color-mix(in srgb,${PP} 25%,transparent)`, borderRadius: '1rem', padding: '1.2rem', cursor: 'pointer' }}>
          <div style={{ fontSize: '1.3rem', marginBottom: '.35rem' }}>🏠</div>
          <div style={{ fontWeight: 700, fontSize: '.88rem', color: 'var(--ink)', marginBottom: '.2rem' }}>Créer une salle</div>
          <div style={{ fontSize: '.72rem', color: 'var(--ink3)' }}>Génère un code à 4 chiffres et invite tes amis</div>
        </div>
        <div style={{ background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem', padding: '1.2rem' }}>
          <div style={{ fontSize: '1.3rem', marginBottom: '.35rem' }}>🔗</div>
          <div style={{ fontWeight: 700, fontSize: '.88rem', color: 'var(--ink)', marginBottom: '.65rem' }}>Rejoindre une salle</div>
          <div style={{ display: 'flex', gap: '.5rem' }}>
            <input value={joinCode} onChange={(e) => setJoinCode(e.target.value.replace(/\D/g, '').slice(0, 4))}
            placeholder="Code à 4 chiffres" maxLength="4"
            style={{ flex: 1, background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.5rem', padding: '.5rem .75rem', color: 'var(--ink)', fontFamily: 'monospace', fontSize: '1rem', textAlign: 'center', letterSpacing: '.15em' }} />
            <button onClick={joinRoom} disabled={joinCode.length !== 4}
            style={{ padding: '.5rem 1rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.78rem', fontWeight: 700, background: PP, color: '#07090f', border: 'none', borderRadius: '.5rem', cursor: joinCode.length !== 4 ? 'default' : 'pointer', opacity: joinCode.length !== 4 ? 0.4 : 1 }}>OK</button>
          </div>
        </div>
      </div>
    </div>);


  if (phase === 'waiting') return (
    <div style={{ width: '100%' }}>
      <button onClick={() => setPhase('lobby')} style={bkBtn}>← Quitter</button>
      <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: PP, textTransform: 'uppercase', marginBottom: '.3rem' }}>Salle de jeu</div>
        <div style={{ fontFamily: 'monospace', fontSize: '3rem', fontWeight: 900, letterSpacing: '.3em', color: PP, textShadow: `0 0 24px ${PP}55` }}>{roomCode}</div>
        <div style={{ fontSize: '.65rem', color: 'var(--ink3)', marginTop: '.2rem' }}>Partage ce code avec tes amis</div>
      </div>
      <div style={{ background: 'var(--s1)', border: `1px solid ${PP}25`, borderRadius: '1rem', padding: '1rem', marginBottom: '1rem' }}>
        <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.75rem' }}>Joueurs ({players.length + 1}/∞)</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '.6rem', padding: '.4rem 0', borderBottom: '1px solid var(--b1)', marginBottom: '.5rem' }}>
          <div style={{ width: 28, height: 28, borderRadius: '50%', background: PP + '20', border: `1px solid ${PP}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.55rem', fontWeight: 800, color: PP }}>C</div>
          <span style={{ flex: 1, fontSize: '.82rem', fontWeight: 600, color: 'var(--ink)' }}>Vous</span>
          <span style={{ fontSize: '.58rem', color: PP, fontWeight: 700 }}>👑 Hôte</span>
        </div>
        {players.map((p) =>
        <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: '.6rem', padding: '.4rem 0', animation: 'sl-fadein .4s' }}>
            <div style={{ width: 28, height: 28, borderRadius: '50%', background: p.color + '20', border: `1px solid ${p.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.55rem', fontWeight: 800, color: p.color }}>{p.rank}</div>
            <span style={{ flex: 1, fontSize: '.82rem', fontWeight: 600, color: 'var(--ink)' }}>{p.name}</span>
          </div>
        )}
        {players.length === 0 && <div style={{ fontSize: '.72rem', color: 'var(--ink3)', textAlign: 'center', padding: '.5rem 0' }}>En attente des joueurs…</div>}
      </div>
      {isHost ?
      <button onClick={() => loadAndStart(players)} style={{ width: '100%', padding: '1rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.8rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: PP, color: '#07090f', border: 'none', borderRadius: '.85rem', cursor: 'pointer' }}>⚡ Lancer la partie ({players.length + 1} joueur{players.length ? 's' : ''})</button> :
      <div style={{ textAlign: 'center', padding: '1rem', fontSize: '.72rem', color: 'var(--ink3)' }}>⏳ En attente que l'hôte lance…</div>
      }
    </div>);


  if (phase === 'loading') return (
    <div style={{ width: '100%', minHeight: '50vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1rem' }}>
      <div style={{ fontSize: '1.5rem', fontWeight: 800, color: PP, fontFamily: 'Syne,sans-serif', letterSpacing: '.12em', animation: 'sl-pulse 1.2s ease-in-out infinite' }}>CHARGEMENT</div>
      <div style={{ fontSize: '.72rem', color: 'var(--ink3)' }}>Préparation des questions…</div>
    </div>);


  if (phase === 'question' && q) {
    const answeredNow = (answered ? 1 : 0) + Object.keys(botAnswers).length;
    return (
      <div style={{ width: '100%' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
          <div style={{ fontSize: '.6rem', fontWeight: 700, color: PP, letterSpacing: '.12em', textTransform: 'uppercase' }}>Q {qIdx + 1} / {questions.length}</div>
          <div style={{ fontFamily: 'monospace', fontSize: '1.5rem', fontWeight: 900, color: timeLeft <= 5 ? '#f87171' : timeLeft <= 10 ? '#fbbf24' : PP, transition: 'color .3s' }}>{String(timeLeft).padStart(2, '0')}</div>
        </div>
        <div style={{ height: 3, background: 'var(--b1)', borderRadius: 2, marginBottom: '1.25rem', overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${timeLeft / 20 * 100}%`, background: timeLeft <= 5 ? '#f87171' : PP, transition: 'width 1s linear', borderRadius: 2 }} />
        </div>
        <div style={{ fontSize: '1rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.55, marginBottom: '1.25rem', padding: '.85rem 1rem', background: 'var(--s1)', borderRadius: '1rem', border: '1px solid var(--b1)' }}>{q.question}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.6rem', marginBottom: '.85rem' }}>
          {(q.answers || []).map((ans, i) => {
            const isSel = selected === i;
            return (
              <button key={i} onClick={() => handleAnswer(i)} disabled={answered}
              style={{ padding: '.75rem .6rem', background: isSel ? PP + '22' : 'var(--s1)', border: `1px solid ${isSel ? PP : 'var(--b1)'}`, borderRadius: '.75rem', color: isSel ? PP : 'var(--ink2)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.78rem', fontWeight: 600, cursor: answered ? 'default' : 'pointer', textAlign: 'left', transition: 'all .15s' }}>
                <span style={{ opacity: .5, marginRight: '.3rem', fontSize: '.62rem' }}>{String.fromCharCode(65 + i)}</span>{ans}
              </button>);

          })}
        </div>
        <div style={{ fontSize: '.62rem', color: 'var(--ink3)', textAlign: 'center' }}>{answeredNow}/{players.length + 1} ont répondu</div>
      </div>);

  }

  if (phase === 'reveal' && revealData) {
    const { q: rq, myAns, myOk, myRead, myBonus, myPts, playerResults, qi, total } = revealData;
    return (
      <div style={{ width: '100%' }}>
        <div style={{ textAlign: 'center', marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '2rem', marginBottom: '.2rem' }}>{myOk ? '✅' : '❌'}</div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '1.4rem', fontWeight: 800, color: myOk ? '#34d399' : '#f87171', textTransform: 'uppercase', letterSpacing: '.05em' }}>{myOk ? 'Bonne réponse !' : 'Mauvaise réponse'}</div>
          {!myOk && <div style={{ marginTop: '.3rem', fontSize: '.78rem', color: 'var(--ink2)' }}>✓ {rq.answers[rq.correctIdx]}</div>}
        </div>
        {myBonus > 0 &&
        <div style={{ background: 'rgba(0,200,255,.07)', border: '1px solid rgba(0,200,255,.22)', borderRadius: '.85rem', padding: '.7rem 1rem', marginBottom: '.85rem', display: 'flex', alignItems: 'center', gap: '.6rem' }}>
            <span style={{ fontSize: '1.2rem' }}>💪</span>
            <div>
              <div style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.1em', color: PP, textTransform: 'uppercase' }}>Bonus Débutant</div>
              <div style={{ fontSize: '.76rem', color: 'var(--ink2)', marginTop: '.1rem' }}>Tu n'avais pas lu l'anecdote : +{myBonus} pts bonus !</div>
            </div>
          </div>
        }
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '1rem' }}>
          <div style={{ background: myPts > 0 ? 'rgba(52,211,153,.08)' : 'rgba(248,113,113,.06)', border: `1px solid ${myPts > 0 ? 'rgba(52,211,153,.25)' : 'rgba(248,113,113,.18)'}`, borderRadius: '.75rem', padding: '.45rem 1.5rem', textAlign: 'center' }}>
            <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '1.6rem', fontWeight: 800, color: myPts > 0 ? '#34d399' : '#f87171' }}>{myPts > 0 ? '+' : ''}{myPts} pts</div>
            <div style={{ fontSize: '.56rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em' }}>Total : {scores['me']} pts</div>
          </div>
        </div>
        <div style={{ background: 'var(--s1)', borderRadius: '1rem', border: '1px solid var(--b1)', padding: '.85rem 1rem', marginBottom: '.85rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.6rem' }}>Résultats des joueurs</div>
          <PlayerRevealRow name="Vous" rank="C" color={PP} answer={myAns} answers={rq.answers} correctIdx={rq.correctIdx} hadRead={myRead} pts={myPts} bonus={myBonus} />
          {playerResults.map((p) => <PlayerRevealRow key={p.id} name={p.name} rank={p.rank} color={p.color} answer={p.answer} answers={rq.answers} correctIdx={rq.correctIdx} hadRead={p.hadRead} pts={p.pts} bonus={p.bonus} />)}
        </div>
        {rq.explanation && <div style={{ background: 'rgba(255,255,255,.02)', border: '1px solid var(--b1)', borderRadius: '.85rem', padding: '.7rem .9rem', marginBottom: '.85rem', fontSize: '.76rem', color: 'var(--ink2)', lineHeight: 1.65 }}>💡 {rq.explanation}</div>}
        <button onClick={goNext} style={{ width: '100%', padding: '.9rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: PP + '15', border: `1px solid ${PP}40`, borderRadius: '.75rem', color: PP, cursor: 'pointer' }}>
          {qi + 1 >= total ? '🏁 Voir les résultats' : '▶ Question suivante'}
        </button>
      </div>);

  }

  if (phase === 'interlude') {
    const sorted = [...allPl].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0));
    return (
      <div style={{ width: '100%', textAlign: 'center', padding: '1.5rem 0' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: PP, textTransform: 'uppercase', marginBottom: '.4rem' }}>Classement provisoire</div>
        <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '1.2rem', fontWeight: 800, color: 'var(--ink)', marginBottom: '1.25rem' }}>Question {qIdx + 2}/{questions.length} dans 3s…</div>
        {sorted.map((p, i) =>
        <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: '.65rem', padding: '.5rem .75rem', background: p.id === 'me' ? PP + '10' : 'var(--s1)', border: `1px solid ${p.id === 'me' ? PP + '30' : 'var(--b1)'}`, borderRadius: '.75rem', marginBottom: '.4rem', textAlign: 'left' }}>
            <span style={{ fontFamily: 'Syne,sans-serif', fontSize: '.95rem', fontWeight: 800, color: PP, width: 20, textAlign: 'center' }}>{i + 1}</span>
            <div style={{ width: 24, height: 24, borderRadius: '50%', background: p.color + '20', border: `1px solid ${p.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.52rem', fontWeight: 800, color: p.color }}>{p.rank}</div>
            <span style={{ flex: 1, fontSize: '.82rem', fontWeight: 600, color: p.id === 'me' ? PP : 'var(--ink)' }}>{p.name}</span>
            <span style={{ fontFamily: 'Syne,sans-serif', fontSize: '.9rem', fontWeight: 800, color: 'var(--ink)' }}>{scores[p.id] || 0} pts</span>
          </div>
        )}
      </div>);

  }

  if (phase === 'end') {
    const sorted = [...allPl].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0));
    const readAdv = {};
    allPl.forEach((p) => {readAdv[p.id] = Object.values(readMap).filter((s) => s.has(p.id)).length;});
    const unreadQs = questions.filter((_, i) => !readMap[i]?.has('me'));
    return (
      <div style={{ width: '100%' }}>
        <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
          <div style={{ fontSize: '2rem', marginBottom: '.3rem' }}>🏆</div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '1.8rem', fontWeight: 800, color: 'var(--ink)', textTransform: 'uppercase', letterSpacing: '.05em' }}>Partie terminée !</div>
          <div style={{ fontSize: '.7rem', color: 'var(--ink3)', marginTop: '.2rem' }}>{questions.length} questions · {allPl.length} joueurs</div>
        </div>
        <div style={{ background: 'var(--s1)', borderRadius: '1rem', border: '1px solid var(--b1)', padding: '1rem', marginBottom: '1rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.65rem' }}>🏅 Classement final</div>
          {sorted.map((p, i) =>
          <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: '.65rem', padding: '.5rem .5rem', background: p.id === 'me' ? PP + '10' : 'transparent', borderRadius: '.6rem', marginBottom: '.25rem' }}>
              <span style={{ fontSize: '1rem', width: 22, textAlign: 'center' }}>{['🥇', '🥈', '🥉'][i] || `#${i + 1}`}</span>
              <div style={{ width: 24, height: 24, borderRadius: '50%', background: p.color + '20', border: `1px solid ${p.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.52rem', fontWeight: 800, color: p.color }}>{p.rank}</div>
              <span style={{ flex: 1, fontSize: '.82rem', fontWeight: p.id === 'me' ? 700 : 500, color: p.id === 'me' ? PP : 'var(--ink)' }}>{p.name}</span>
              <span style={{ fontFamily: 'Syne,sans-serif', fontSize: '.92rem', fontWeight: 800, color: 'var(--ink)' }}>{scores[p.id] || 0} pts</span>
            </div>
          )}
        </div>
        <div style={{ background: 'var(--s1)', borderRadius: '1rem', border: '1px solid var(--b1)', padding: '1rem', marginBottom: '1rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.35rem' }}>📚 Avantage lecture</div>
          <div style={{ fontSize: '.68rem', color: 'var(--ink3)', marginBottom: '.65rem' }}>Questions où le joueur avait lu l'anecdote source</div>
          {[...allPl].sort((a, b) => (readAdv[b.id] || 0) - (readAdv[a.id] || 0)).map((p) =>
          <div key={p.id} style={{ display: 'flex', alignItems: 'center', gap: '.6rem', marginBottom: '.5rem' }}>
              <span style={{ fontSize: '.76rem', fontWeight: 600, color: p.id === 'me' ? PP : 'var(--ink)', flex: 1 }}>{p.name}</span>
              <div style={{ flex: 2, height: 6, background: 'var(--b1)', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.round((readAdv[p.id] || 0) / Math.max(questions.length, 1) * 100)}%`, background: p.color, borderRadius: 3 }} />
              </div>
              <span style={{ fontSize: '.7rem', fontWeight: 700, color: 'var(--ink2)', width: 32, textAlign: 'right' }}>{readAdv[p.id] || 0}/{questions.length}</span>
            </div>
          )}
        </div>
        {unreadQs.length > 0 &&
        <div style={{ background: 'var(--s1)', borderRadius: '1rem', border: `1px solid ${PP}25`, padding: '1rem', marginBottom: '1.25rem' }}>
            <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: PP, textTransform: 'uppercase', marginBottom: '.35rem' }}>✨ Anecdotes que tu n'avais pas lues</div>
            <div style={{ fontSize: '.68rem', color: 'var(--ink3)', marginBottom: '.65rem' }}>{unreadQs.length} sujet{unreadQs.length > 1 ? 's' : ''} à découvrir</div>
            {unreadQs.map((uq, i) =>
          <div key={i} style={{ background: 'var(--s2)', border: '1px solid var(--b1)', borderRadius: '.75rem', padding: '.6rem .8rem', marginBottom: '.4rem' }}>
                <div style={{ fontSize: '.58rem', fontWeight: 700, color: PP, marginBottom: '.2rem', letterSpacing: '.08em' }}>QUESTION {questions.indexOf(uq) + 1}</div>
                <div style={{ fontSize: '.78rem', color: 'var(--ink)', fontWeight: 500, lineHeight: 1.5 }}>{uq.question}</div>
                <div style={{ fontSize: '.7rem', color: '#34d399', marginTop: '.3rem' }}>✓ {uq.answers[uq.correctIdx]}</div>
              </div>
          )}
          </div>
        }
        <div style={{ display: 'flex', gap: '.6rem' }}>
          <button onClick={() => {setPhase('lobby');setPlayers([]);}} style={{ flex: 1, padding: '.75rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: PP + '14', border: `1px solid ${PP}40`, borderRadius: '.75rem', color: PP, cursor: 'pointer' }}>Rejouer</button>
          <button onClick={onBack} style={{ flex: 1, padding: '.75rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(255,255,255,.04)', border: '1px solid var(--b1)', borderRadius: '.75rem', color: 'var(--ink2)', cursor: 'pointer' }}>Menu</button>
        </div>
      </div>);

  }

  return null;
}

function MysteryHubCard({ mystery, dow, onNav }) {

  const actNums = ['I', 'II', 'III', 'IV', 'V'];

  const preview = todayAct.slice(0, 120) + '…';
  const actLabel = `Acte ${actNums[Math.min(dow, 4)]} · ${days[Math.min(dow, 4)]}`;
  return (
    <div className="wm-hub" onClick={() => onNav('mystery')}>
      <div className="wm-hd">
        <span className="wm-badge">🕵️ Mystère de la semaine</span>
        <div className="wm-mys-title">{mystery.title}</div>
        <div className="wm-dots">
          {[0, 1, 2, 3, 4].map((i) => <div key={i} className={`wm-dot${i < unlockedCount ? ' on' : ''}`} />)}
          <span className="wm-act-lbl">{actLabel}</span>
        </div>
      </div>
      {todayAct && <div className="wm-preview">{preview}</div>}

        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: '#00c8ff', textTransform: 'uppercase', marginBottom: '.6rem', position: 'relative' }}>📜 L'affaire</div>
        <div style={{ fontSize: '.85rem', color: 'var(--ink2)', lineHeight: 1.7, position: 'relative' }}>{introText}</div>
        <div style={{ marginTop: '.95rem', paddingTop: '.85rem', borderTop: '1px solid rgba(0,200,255,.16)', display: 'flex', gap: '.55rem', alignItems: 'flex-start', position: 'relative' }}>
          <span style={{ fontSize: '.95rem', lineHeight: 1.4 }}>🎯</span>

        </div>
      </div>

      {/* Comment jouer */}
      <div className="wm-rules-c">
        <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: '#00c8ff', textTransform: 'uppercase', marginBottom: '.1rem' }}>📖 Comment jouer</div>
        <div className="wm-rule-grid">
          {[['5 actes', 'Lun → Ven, un indice/jour'], ['1 tentative', 'Par jour pour accuser'], ['1 coupable', 'À découvrir ensemble']].map(([v, s], i) =>
          <div key={i} className="wm-rule-item">
              <div className="wm-rule-val">{v}</div>
              <div className="wm-rule-sub">{s}</div>
            </div>
          )}
        </div>
      </div>

      {/* Actes */}
      <div style={{ marginBottom: '1.25rem' }}>
        <div style={{ fontSize: '.57rem', fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: 'var(--ink3)', marginBottom: '.75rem' }}>Les indices</div>
        {actNums.map((n, i) => {
          const unlocked = i < unlockedCount && acts[i];
          return (
            <div key={i} className={`wm-act-c ${unlocked ? 'wm-act-open-c' : 'wm-act-locked-c'}`}>
              <div className="wm-act-head">
                <span style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', color: unlocked ? '#00c8ff' : 'rgba(255,255,255,.22)' }}>Acte {n}</span>
                <span style={{ fontSize: '.6rem', color: unlocked ? 'rgba(0,200,255,.6)' : 'rgba(255,255,255,.18)' }}>{days[i]}</span>

              {!unlocked && <div style={{ padding: '.3rem .85rem .6rem', fontSize: '.7rem', color: 'var(--ink3)', fontStyle: 'italic', borderTop: '1px solid rgba(255,255,255,.04)' }}>🔒 Disponible {days[i]}</div>}
            </div>);

        })}
      </div>

      {/* Formulaire déduction */}
      <div className="wm-form-c">
        <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: '#00c8ff', textTransform: 'uppercase', marginBottom: '.75rem' }}>🎯 Ton accusation du jour</div>
        {!submitted ?
        <>
            <input className="wm-inp" value={guess} onChange={(e) => setGuess(e.target.value)} placeholder="Qui est le coupable ?" />
            <button className="wm-submit" onClick={() => guess.trim() && setSubmitted(true)}>Soumettre →</button>
          </> :

        <div style={{ textAlign: 'center', padding: '.5rem 0' }}>
            <div style={{ fontSize: '1.5rem', marginBottom: '.4rem' }}>🔍</div>
            <div style={{ fontSize: '.82rem', color: 'var(--ink2)', lineHeight: 1.6 }}>Déduction envoyée !<br />Reviens demain pour un nouvel indice.</div>
          </div>
        }
      </div>
    </div>);

}

function genBots() {
  const TIERS = [{ id: 'S', min: 1, max: 4, rMin: .88, rMax: .93 }, { id: 'A', min: 2, max: 7, rMin: .82, rMax: .92 }, { id: 'B', min: 5, max: 12, rMin: .72, rMax: .85 }, { id: 'C', min: 12, max: 25, rMin: .60, rMax: .75 }, { id: 'D', min: 20, max: 35, rMin: .45, rMax: .65 }];
  const NAMES = ['Théo42', 'LucasQ', 'Emma_X', 'JujuPro', 'Naomie', 'Zak99', 'KilianK', 'Sofia3', 'MaxDev', 'Clément', 'InèsZ', 'ThibO', 'CharlyB', 'NoéM', 'AlinaS', 'Baptiste', 'Florent', 'ChloéX', 'AntoineR', 'MaevaQ', 'OlivierT', 'SarahV', 'RemiC', 'TomG', 'KarimL', 'VincentP', 'MarcV', 'SimonA', 'MarieB', 'RafaelC'];
  let rem = 100;const counts = {};
  TIERS.forEach((t, i) => {const max = rem - (TIERS.length - 1 - i);const c = Math.max(0, Math.min(max, Math.round(t.min + Math.random() * (t.max - t.min))));counts[t.id] = c;rem -= c;});
  counts['E'] = Math.max(0, rem);
  const bots = [];let ni = 0;
  [...TIERS, { id: 'E', rMin: .30, rMax: .50 }].forEach((t) => {
    const c = counts[t.id] || 0;
    for (let k = 0; k < c; k++) {bots.push({ id: bots.length, name: NAMES[ni % NAMES.length], rank: t.id, color: RC_VS[t.id], successRate: t.rMin + Math.random() * (t.rMax - t.rMin), eliminated: false });ni++;}
  });
  // 0.5% chance — rang Nation
  if (Math.random() < 0.005) {
    const ri = Math.floor(Math.random() * bots.length);
    bots[ri] = { ...bots[ri], rank: 'Nation', color: '#ec4899', successRate: .90 + Math.random() * .07 };
  }
  return bots;
}

function ScreenAmis() {
  const AMIS_COLOR = '#00c8ff';
  const [subTab, setSubTab] = useState('feed');
  // Feed state
  const [feed, setFeed] = useState([]);
  const [feedLoading, setFeedLoading] = useState(true);
  // Défi state
  const [defiPhase, setDefiPhase] = useState('idle');
  const [defiQ, setDefiQ] = useState(null);
  const [defiAnswer, setDefiAnswer] = useState(null);
  // Amis state
  const [friendSearch, setFriendSearch] = useState('');
  const [friendResults, setFriendResults] = useState([]);
  const [friendSearchLoading, setFriendSearchLoading] = useState(false);
  const [myFriends, setMyFriends] = useState([]);
  const [pendingIn, setPendingIn] = useState([]);
  const [pendingOut, setPendingOut] = useState([]);
  const [friendsLoading, setFriendsLoading] = useState(false);
  const [myUserId, setMyUserId] = useState(null);

  useEffect(() => {
    sb.auth.getUser().then(({ data: { user } }) => { if (user) setMyUserId(user.id); });
  }, []);

  useEffect(() => {
    if (subTab !== 'amis' || !myUserId) return;
    loadFriends();
  }, [subTab, myUserId]);

  async function loadFriends() {
    setFriendsLoading(true);
    try {
      const { data: rows } = await sb.from('friendships')
        .select('id, requester_id, receiver_id, status, profiles!friendships_requester_id_fkey(username,xp), profiles!friendships_receiver_id_fkey(username,xp)')
        .or(`requester_id.eq.${myUserId},receiver_id.eq.${myUserId}`);
      const friends = [], inReqs = [], outReqs = [];
      (rows || []).forEach(r => {
        const isMe = r.requester_id === myUserId;
        const other = isMe ? r.profiles_receiver : r.profiles_requester;
        const otherId = isMe ? r.receiver_id : r.requester_id;
        const item = { id: r.id, userId: otherId, username: other?.username || '?', xp: other?.xp || 0 };
        if (r.status === 'accepted') friends.push(item);
        else if (r.status === 'pending' && isMe) outReqs.push(item);
        else if (r.status === 'pending' && !isMe) inReqs.push(item);
      });
      setMyFriends(friends); setPendingIn(inReqs); setPendingOut(outReqs);
    } catch (e) { console.warn('loadFriends:', e); }
    setFriendsLoading(false);
  }

  async function searchFriends(q) {
    setFriendSearch(q);
    if (q.length < 2) { setFriendResults([]); return; }
    setFriendSearchLoading(true);
    try {
      const { data } = await sb.from('profiles').select('id, username, xp').ilike('username', `%${q}%`).neq('id', myUserId || '').limit(8);
      setFriendResults(data || []);
    } catch (e) {}
    setFriendSearchLoading(false);
  }

  async function sendRequest(toUserId) {
    if (!myUserId) return;
    try {
      await sb.from('friendships').insert({ requester_id: myUserId, receiver_id: toUserId, status: 'pending' });
      setFriendResults(prev => prev.filter(r => r.id !== toUserId));
      loadFriends();
    } catch (e) { console.warn('sendRequest:', e); }
  }

  async function respondRequest(friendshipId, accept) {
    try {
      if (accept) await sb.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
      else await sb.from('friendships').delete().eq('id', friendshipId);
      loadFriends();
    } catch (e) { console.warn('respondRequest:', e); }
  }

  const MOCK_DEFIS = [
    { from: 'TheoCool', rank: 'B', color: '#a855f7', question: 'Quelle est la capitale de l\'Australie ?', time: '30min', answered: false },
    { from: 'Sofia3', rank: 'C', color: '#00c8ff', question: 'Quel est le symbole chimique du Fer ?', time: '2h', answered: true, result: '✓' },
  ];

  useEffect(() => {
    if (subTab !== 'feed') return;
    (async () => {
      setFeedLoading(true);
      try {
        const { data: recentReads } = await sb.from('reads')
          .select('user_id, anecdote_id, created_at, anecdotes(theme, icon)')
          .order('created_at', { ascending: false }).limit(20);
        const { data: recentQuiz } = await sb.from('quiz_history')
          .select('user_id, pct, created_at').order('created_at', { ascending: false }).limit(10);
        const userIds = [...new Set([...(recentReads || []).map(r => r.user_id), ...(recentQuiz || []).map(q => q.user_id)])].filter(Boolean);
        let profiles = {};
        if (userIds.length) {
          const { data: ps } = await sb.from('profiles').select('id, username, xp').in('id', userIds);
          (ps || []).forEach(p => { profiles[p.id] = p; });
        }
        const fmt = (d) => { const diff = Date.now() - new Date(d).getTime(); if (diff < 3600000) return Math.floor(diff / 60000) + 'min'; if (diff < 86400000) return Math.floor(diff / 3600000) + 'h'; return Math.floor(diff / 86400000) + 'j'; };
        const events = [
          ...(recentReads || []).map(r => ({ type: 'read', userId: r.user_id, name: profiles[r.user_id]?.username || 'Anonyme', time: fmt(r.created_at), theme: r.anecdotes?.theme, icon: r.anecdotes?.icon || '💡', color: '#00c8ff' })),
          ...(recentQuiz || []).map(q => ({ type: 'quiz', userId: q.user_id, name: profiles[q.user_id]?.username || 'Anonyme', time: fmt(q.created_at), pct: q.pct, color: '#34d399' })),
        ].sort((a, b) => a.time.localeCompare(b.time));
        setFeed(events.slice(0, 25));
      } catch (e) {}
      setFeedLoading(false);
    })();
  }, [subTab]);

  async function createDefi() {
    setDefiPhase('loading');
    try {
      const user = (await sb.auth.getUser()).data?.user;
      let q = null;
      if (user) {
        const { data: reads } = await sb.from('reads').select('anecdote_id').eq('user_id', user.id);
        const ids = (reads || []).map(r => r.anecdote_id);
        if (ids.length) {
          const { data: qs } = await sb.from('questions').select('*').in('anecdote_id', ids).limit(50);
          if (qs && qs.length) q = qs[Math.floor(Math.random() * qs.length)];
        }
      }
      if (!q) { const fb = FALLBACK_VS100[Math.floor(Math.random() * FALLBACK_VS100.length)]; q = { question: fb.question, options: fb.answers, answer: fb.correctIdx, explanation: fb.explanation }; }
      setDefiQ(q);
      setDefiAnswer(null);
      setDefiPhase('ready');
    } catch (e) { setDefiPhase('idle'); }
  }

  function copyDefi() {
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify({ q: defiQ.question, opts: defiQ.options, ans: defiQ.answer }))));
    const url = window.location.href.split('#')[0] + '#defi=' + encoded;
    navigator.clipboard.writeText(url).then(() => setDefiPhase('copied'));
  }

  const RC_AMIS = { E: '#9ca3af', D: '#22c55e', C: '#00c8ff', B: '#a855f7', A: '#fbbf24', S: '#ef4444' };

  return (
    <div style={{ width: '100%' }}>
      <div style={{ marginBottom: '1.25rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: AMIS_COLOR, textTransform: 'uppercase', marginBottom: '.3rem' }}>👥 AMIS</div>
        <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif' }}>Activité sociale</div>
      </div>
      {/* Sub-tabs */}
      <div style={{ display: 'flex', gap: '.4rem', marginBottom: '1.25rem' }}>
        {[{ id: 'feed', lbl: '📡 Feed' }, { id: 'amis', lbl: '👥 Amis' }, { id: 'defis', lbl: '⚔️ Défis' }].map(t => (
          <button key={t.id} onClick={() => setSubTab(t.id)} style={{ padding: '.35rem .85rem', borderRadius: '999px', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.65rem', fontWeight: 700, border: `1px solid ${subTab === t.id ? AMIS_COLOR : 'var(--b2)'}`, background: subTab === t.id ? AMIS_COLOR + '18' : 'transparent', color: subTab === t.id ? AMIS_COLOR : 'var(--ink3)', cursor: 'pointer' }}>{t.lbl}</button>
        ))}
      </div>

      {/* FEED */}
      {subTab === 'feed' && (feedLoading
        ? <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Chargement du feed…</div>
        : feed.length === 0
          ? <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Pas encore d'activité, lis des anecdotes !</div>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: '.5rem' }}>
              {feed.map((e, i) => (
                <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '.65rem', padding: '.65rem .85rem', background: `color-mix(in srgb,${e.color} 5%,var(--s1))`, border: `1px solid color-mix(in srgb,${e.color} 15%,transparent)`, borderRadius: '.85rem' }}>
                  <div style={{ width: 28, height: 28, borderRadius: '50%', background: e.color + '20', border: `1px solid ${e.color}40`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.6rem', fontWeight: 800, color: e.color, flexShrink: 0 }}>{(e.name || '?')[0].toUpperCase()}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: '.78rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.4 }}>
                      <span style={{ color: e.color }}>{e.name}</span>
                      {e.type === 'read' && <> a lu <span style={{ color: 'var(--ink2)' }}>{e.icon} {e.theme || 'une anecdote'}</span></>}
                      {e.type === 'quiz' && <> a scoré <span style={{ color: '#34d399', fontWeight: 700 }}>{e.pct}%</span> au quiz</>}
                    </div>
                    <div style={{ fontSize: '.58rem', color: 'var(--ink3)', marginTop: '.15rem' }}>il y a {e.time}</div>
                  </div>
                  <span style={{ fontSize: '.85rem', flexShrink: 0 }}>{e.type === 'read' ? '📖' : '🎯'}</span>
                </div>
              ))}
            </div>
      )}

      {/* AMIS */}
      {subTab === 'amis' && <div>
        {/* Demandes reçues */}
        {pendingIn.length > 0 && <div style={{ marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: '#f59e0b', textTransform: 'uppercase', marginBottom: '.6rem' }}>🔔 Demandes reçues</div>
          {pendingIn.map(r => (
            <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: '.75rem', padding: '.65rem .9rem', background: 'var(--s1)', border: '1px solid rgba(245,158,11,.2)', borderRadius: '.85rem', marginBottom: '.4rem' }}>
              <div style={{ width: 34, height: 34, borderRadius: '50%', background: `${RC_AMIS[rankFor(r.xp)]}22`, border: `1px solid ${RC_AMIS[rankFor(r.xp)]}55`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.65rem', fontWeight: 700, color: RC_AMIS[rankFor(r.xp)] }}>{rankFor(r.xp)}</div>
              <div style={{ flex: 1 }}><div style={{ fontSize: '.82rem', fontWeight: 700, color: 'var(--ink)' }}>{r.username}</div><div style={{ fontSize: '.62rem', color: 'var(--ink3)' }}>{r.xp.toLocaleString('fr-FR')} XP</div></div>
              <button onClick={() => respondRequest(r.id, true)} style={{ padding: '.3rem .65rem', background: 'rgba(52,211,153,.12)', border: '1px solid rgba(52,211,153,.3)', borderRadius: '.5rem', color: '#34d399', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.65rem', fontWeight: 700, cursor: 'pointer' }}>✓</button>
              <button onClick={() => respondRequest(r.id, false)} style={{ padding: '.3rem .65rem', background: 'rgba(248,113,113,.08)', border: '1px solid rgba(248,113,113,.2)', borderRadius: '.5rem', color: '#f87171', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.65rem', fontWeight: 700, cursor: 'pointer' }}>✕</button>
            </div>
          ))}
        </div>}

        {/* Recherche */}
        <div style={{ marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: AMIS_COLOR, textTransform: 'uppercase', marginBottom: '.6rem' }}>Ajouter un ami</div>
          <div style={{ position: 'relative' }}>
            <input value={friendSearch} onChange={e => searchFriends(e.target.value)} placeholder="Chercher par pseudo…" style={{ width: '100%', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.75rem', color: 'var(--ink)', padding: '.6rem .9rem', fontSize: '.82rem', fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
          </div>
          {friendSearchLoading && <div style={{ fontSize: '.72rem', color: 'var(--ink3)', marginTop: '.5rem', textAlign: 'center' }}>…</div>}
          {friendResults.length > 0 && <div style={{ marginTop: '.5rem', display: 'flex', flexDirection: 'column', gap: '.35rem' }}>
            {friendResults.map(r => {
              const rk = rankFor(r.xp); const col = RC_AMIS[rk];
              const alreadySent = pendingOut.some(p => p.userId === r.id);
              const alreadyFriend = myFriends.some(f => f.userId === r.id);
              return (
                <div key={r.id} style={{ display: 'flex', alignItems: 'center', gap: '.75rem', padding: '.6rem .9rem', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '.85rem' }}>
                  <div style={{ width: 32, height: 32, borderRadius: '50%', background: col + '22', border: `1px solid ${col}55`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.62rem', fontWeight: 700, color: col }}>{rk}</div>
                  <div style={{ flex: 1 }}><div style={{ fontSize: '.8rem', fontWeight: 700, color: 'var(--ink)' }}>{r.username}</div><div style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>{r.xp?.toLocaleString('fr-FR')} XP</div></div>
                  {alreadyFriend ? <span style={{ fontSize: '.62rem', color: '#34d399', fontWeight: 600 }}>✓ Ami</span>
                  : alreadySent ? <span style={{ fontSize: '.62rem', color: 'var(--ink3)', fontWeight: 600 }}>Envoyée</span>
                  : <button onClick={() => sendRequest(r.id)} style={{ padding: '.3rem .75rem', background: 'var(--adim)', border: '1px solid var(--a)', borderRadius: '.5rem', color: 'var(--a)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.65rem', fontWeight: 700, cursor: 'pointer' }}>+ Ajouter</button>}
                </div>
              );
            })}
          </div>}
        </div>

        {/* Liste d'amis */}
        <div>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.6rem' }}>Mes amis {myFriends.length > 0 && `(${myFriends.length})`}</div>
          {friendsLoading ? <div style={{ fontSize: '.78rem', color: 'var(--ink3)', textAlign: 'center', padding: '1.5rem 0' }}>Chargement…</div>
          : myFriends.length === 0 ? <div style={{ background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem', padding: '1.5rem', textAlign: 'center' }}>
              <div style={{ fontSize: '1.5rem', marginBottom: '.5rem' }}>🔍</div>
              <div style={{ fontSize: '.78rem', color: 'var(--ink3)', lineHeight: 1.6 }}>Pas encore d'amis.<br/>Cherche un pseudo ci-dessus !</div>
            </div>
          : myFriends.map(f => {
              const rk = rankFor(f.xp); const col = RC_AMIS[rk];
              return (
                <div key={f.id} style={{ display: 'flex', alignItems: 'center', gap: '.75rem', padding: '.65rem .9rem', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '.85rem', marginBottom: '.4rem' }}>
                  <div style={{ width: 34, height: 34, borderRadius: '50%', background: col + '22', border: `1px solid ${col}55`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.65rem', fontWeight: 700, color: col }}>{rk}</div>
                  <div style={{ flex: 1 }}><div style={{ fontSize: '.82rem', fontWeight: 700, color: 'var(--ink)' }}>{f.username}</div><div style={{ fontSize: '.62rem', color: 'var(--ink3)' }}>{f.xp.toLocaleString('fr-FR')} XP</div></div>
                  <button onClick={() => {}} style={{ padding: '.3rem .65rem', background: 'var(--adim)', border: '1px solid var(--b2)', borderRadius: '.5rem', color: 'var(--ink3)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.62rem', cursor: 'pointer' }}>⚔️ Défi</button>
                </div>
              );
            })}
        </div>
      </div>}

      {/* DÉFIS */}
      {subTab === 'defis' && <div>
        {/* Received challenges */}
        <div style={{ marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.65rem' }}>Défis reçus</div>
          {MOCK_DEFIS.map((d, i) => (
            <div key={i} style={{ background: `color-mix(in srgb,${d.color} 6%,var(--s1))`, border: `1px solid color-mix(in srgb,${d.color} 20%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem', marginBottom: '.5rem' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem', marginBottom: '.45rem' }}>
                <div style={{ width: 22, height: 22, borderRadius: '50%', background: d.color + '20', border: `1px solid ${d.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '.5rem', fontWeight: 800, color: d.color }}>{d.rank}</div>
                <span style={{ fontSize: '.75rem', fontWeight: 600, color: 'var(--ink)' }}>{d.from}</span>
                <span style={{ fontSize: '.6rem', color: '#fbbf24', marginLeft: 'auto' }}>⚔️ te défie !</span>
                <span style={{ fontSize: '.58rem', color: 'var(--ink3)' }}>{d.time}</span>
              </div>
              <div style={{ fontSize: '.78rem', color: 'var(--ink)', marginBottom: '.5rem', lineHeight: 1.5 }}>{d.question}</div>
              {d.answered
                ? <span style={{ fontSize: '.65rem', fontWeight: 700, color: d.result === '✓' ? '#34d399' : '#f87171' }}>{d.result} Déjà répondu</span>
                : <button style={{ padding: '.38rem .8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.65rem', fontWeight: 700, background: d.color + '18', border: `1px solid ${d.color}40`, borderRadius: '.65rem', color: d.color, cursor: 'pointer' }}>Répondre →</button>
              }
            </div>
          ))}
        </div>
        {/* Create challenge */}
        <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.65rem' }}>Lancer un défi</div>
        {defiPhase === 'idle' && <button onClick={createDefi} style={{ width: '100%', padding: '.85rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.78rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(251,191,36,.08)', border: '1px solid rgba(251,191,36,.25)', borderRadius: '.85rem', color: '#fbbf24', cursor: 'pointer' }}>⚔️ Générer un défi</button>}
        {defiPhase === 'loading' && <div style={{ textAlign: 'center', padding: '1rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Préparation du défi…</div>}
        {(defiPhase === 'ready' || defiPhase === 'copied') && defiQ && (
          <div style={{ background: 'rgba(251,191,36,.06)', border: '1px solid rgba(251,191,36,.22)', borderRadius: '1rem', padding: '1rem' }}>
            <div style={{ fontSize: '.58rem', fontWeight: 700, color: '#fbbf24', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: '.5rem' }}>Ton défi</div>
            <div style={{ fontSize: '.88rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.55, marginBottom: '.85rem' }}>{defiQ.question}</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.4rem', marginBottom: '.75rem' }}>
              {(defiQ.options || []).map((opt, i) => (
                <div key={i} onClick={() => setDefiAnswer(i)} style={{ padding: '.5rem .6rem', background: defiAnswer === i ? 'rgba(251,191,36,.15)' : 'var(--s2)', border: `1px solid ${defiAnswer === i ? 'rgba(251,191,36,.4)' : 'var(--b1)'}`, borderRadius: '.65rem', fontSize: '.75rem', color: defiAnswer === i ? '#fbbf24' : 'var(--ink2)', cursor: 'pointer', textAlign: 'left' }}>
                  <span style={{ opacity: .5, marginRight: '.3rem', fontSize: '.6rem' }}>{String.fromCharCode(65 + i)}</span>{opt}
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: '.5rem' }}>
              <button onClick={copyDefi} style={{ flex: 1, padding: '.65rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, background: defiPhase === 'copied' ? 'rgba(52,211,153,.12)' : 'rgba(251,191,36,.12)', border: `1px solid ${defiPhase === 'copied' ? 'rgba(52,211,153,.3)' : 'rgba(251,191,36,.3)'}`, borderRadius: '.75rem', color: defiPhase === 'copied' ? '#34d399' : '#fbbf24', cursor: 'pointer' }}>
                {defiPhase === 'copied' ? '✓ Lien copié !' : '🔗 Copier le lien'}
              </button>
              <button onClick={() => { setDefiPhase('idle'); setDefiQ(null); }} style={{ padding: '.65rem .8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, background: 'transparent', border: '1px solid var(--b1)', borderRadius: '.75rem', color: 'var(--ink3)', cursor: 'pointer' }}>✕</button>
            </div>
          </div>
        )}
      </div>}
    </div>
  );
}

// ── CHAT ──
function ScreenChat() {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const [username, setUsername] = useState('');
  const [userId, setUserId] = useState(null);
  const [onlineCount, setOnlineCount] = useState(1);
  const channelRef = useRef(null);
  const endRef = useRef(null);
  const CHAT_TABLE = 'site_chat';

  useEffect(() => {
    // Get user session
    sb.auth.getUser().then(({ data: { user } }) => {
      if (user) {
        setUserId(user.id);
        sb.from('profiles').select('username').eq('id', user.id).maybeSingle().then(({ data }) => {
          setUsername(data?.username || user.email?.split('@')[0] || 'Chasseur');
        });
      } else {
        setUsername('Anonyme');
      }
    });

    // Load recent messages
    sb.from(CHAT_TABLE).select('*').order('created_at', { ascending: true }).limit(60).then(({ data }) => {
      setMsgs(data || []);
      setTimeout(() => endRef.current?.scrollIntoView({ behavior: 'auto' }), 100);
    });

    // Subscribe realtime
    const ch = sb.channel('site-chat-v1').
    on('postgres_changes', { event: 'INSERT', schema: 'public', table: CHAT_TABLE }, (payload) => {
      setMsgs((prev) => [...prev, payload.new]);
      setTimeout(() => endRef.current?.scrollIntoView({ behavior: 'smooth' }), 50);
    }).
    on('presence', { event: 'sync' }, () => {
      const state = ch.presenceState();
      setOnlineCount(Object.keys(state).length || 1);
    }).
    subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await ch.track({ user_id: userId || 'anon', online_at: new Date().toISOString() });
      }
    });
    channelRef.current = ch;
    return () => {sb.removeChannel(ch);};
  }, []);

  async function send() {
    const msg = input.trim();
    if (!msg || sending) return;
    if (!userId) {alert('Connecte-toi pour envoyer des messages !');return;}
    if (msg.length > 280) return;
    setSending(true);
    await sb.from(CHAT_TABLE).insert({ user_id: userId, username, message: msg });
    setInput('');
    setSending(false);
  }

  const fmt = (d) => new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const CHAT_COLOR = '#a855f7';

  return (
    <div style={{ width: '100%', display: 'flex', flexDirection: 'column', height: 'calc(100vh - 116px)', maxHeight: '720px' }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '.65rem 0', marginBottom: '.5rem', borderBottom: '1px solid rgba(255,255,255,.06)', flexShrink: 0 }}>
        <div>
          <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '.88rem', fontWeight: 700, color: 'var(--ink)' }}>Chat communauté</div>
          <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>Discussion ouverte, soyez sympas 👋</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '.35rem', background: `color-mix(in srgb,${CHAT_COLOR} 10%,transparent)`, border: `1px solid color-mix(in srgb,${CHAT_COLOR} 25%,transparent)`, borderRadius: '999px', padding: '.25rem .65rem' }}>
          <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: CHAT_COLOR, animation: 'sl-pulse 2s ease-in-out infinite' }} />
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: CHAT_COLOR }}>{onlineCount} en ligne</span>
        </div>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '.5rem', paddingRight: '.25rem', scrollbarWidth: 'thin', scrollbarColor: 'rgba(255,255,255,.1) transparent' }}>
        {msgs.length === 0 && <div style={{ textAlign: 'center', color: 'var(--ink3)', fontSize: '.78rem', paddingTop: '2rem' }}>Pas encore de messages, sois le premier ! 👋</div>}
        {msgs.map((m, i) => {
          const isMe = m.user_id === userId;
          const showMeta = i === 0 || msgs[i - 1]?.user_id !== m.user_id;
          return (
            <div key={m.id || i} style={{ display: 'flex', flexDirection: 'column', alignItems: isMe ? 'flex-end' : 'flex-start', gap: '.2rem' }}>
              {showMeta && <div style={{ fontSize: '.6rem', color: 'var(--ink3)', padding: `0 ${isMe ? '.2rem' : '.8rem'}`, display: 'flex', gap: '.4rem', alignItems: 'center', flexDirection: isMe ? 'row-reverse' : 'row' }}>
                <span style={{ fontWeight: 700, color: isMe ? CHAT_COLOR : 'var(--ink2)' }}>{m.username || 'Anonyme'}</span>
                <span>{fmt(m.created_at)}</span>
              </div>}
              <div style={{ maxWidth: '75%', background: isMe ? `color-mix(in srgb,${CHAT_COLOR} 18%,var(--s2))` : 'var(--s2)', border: `1px solid ${isMe ? `color-mix(in srgb,${CHAT_COLOR} 35%,transparent)` : 'rgba(255,255,255,.08)'}`, borderRadius: isMe ? '1rem 1rem .25rem 1rem' : '1rem 1rem 1rem .25rem', padding: '.5rem .85rem', fontSize: '.82rem', color: 'var(--ink)', lineHeight: 1.55, wordBreak: 'break-word' }}>
                {m.message}
              </div>
            </div>);

        })}
        <div ref={endRef} />
      </div>

      {/* Input */}
      <div style={{ paddingTop: '.75rem', flexShrink: 0, borderTop: '1px solid rgba(255,255,255,.06)' }}>
        {!userId && <div style={{ fontSize: '.7rem', color: 'var(--ink3)', textAlign: 'center', marginBottom: '.5rem', padding: '.45rem', background: 'rgba(255,255,255,.03)', borderRadius: '.65rem' }}>🔒 Connecte-toi pour écrire</div>}
        <div style={{ display: 'flex', gap: '.5rem' }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && send()}
          placeholder={userId ? 'Votre message…' : 'Connectez-vous pour écrire'}
          disabled={!userId || sending} maxLength={280}
          style={{ flex: 1, background: 'rgba(0,0,0,.3)', border: `1px solid color-mix(in srgb,${CHAT_COLOR} 25%,transparent)`, borderRadius: '.75rem', color: 'var(--ink)', fontSize: '.84rem', padding: '.6rem .9rem', outline: 'none', fontFamily: 'Space Grotesk,sans-serif', transition: 'border-color .2s', opacity: userId ? 1 : .5 }}
          onFocus={(e) => e.target.style.borderColor = CHAT_COLOR}
          onBlur={(e) => e.target.style.borderColor = `color-mix(in srgb,${CHAT_COLOR} 25%,transparent)`} />
          <button onClick={send} disabled={!input.trim() || !userId || sending}

      </div>
    </div>);

}

const CRACK_COLOR = '#ef4444';
const EDGE_CRACK = SB_URL + '/functions/v1/daily-enigmas';
const CRACK_CATS = [
{ id: 'cryptogramme', label: 'Cryptogramme', icon: '🔐', tag: 'César, Atbash, Vigenère…', color: '#00c8ff' },
{ id: 'logique', label: 'Logique', icon: '🧩', tag: 'Déduction & raisonnement', color: '#a855f7' },
