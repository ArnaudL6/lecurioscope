function ScreenProfil({ profile: authProfile, authUser, onNav }) {
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [showEdit, setShowEdit] = useState(false);
  const [editKey, setEditKey] = useState(0);
  const editData = JSON.parse(localStorage.getItem('profile_edit') || '{}');
  const accentColor = editData.color || '#00c8ff';

  async function fetchProfile() {
    setLoading(true);
    try {
      // Toujours l'utilisateur connecté — pas de recherche par pseudo
      const uid = authUser?.id || (await sb.auth.getUser()).data?.user?.id || null;
      let p = authProfile && authProfile.id === uid ? authProfile : null;
      if (!p && uid) {
        const { data } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
        p = data;
      }
      if (p) {
        const xp = p.xp || p.total_xp || 0;
        const streak = p.streak || p.current_streak || 0;
        const { data: rc } = await sb.from('reads').select('id').eq('user_id', p.id);
        const { data: qc } = await sb.from('quiz_history').select('pct').eq('user_id', p.id);
        const reads = (rc || []).length;
        const quizzes = (qc || []).length;
        const avgQuiz = qc?.length ? Math.round(qc.reduce((a, b) => a + (b.pct || 0), 0) / qc.length) : p.avg_quiz || 0;
        setProfile({ name: p.username || 'Hunter', xp, reads: reads || 0, quizzes: quizzes || 0, avgQuiz, streak: streak || 0, streakRecord: p.streak_record || 0, joined: p.joined || p.created_at || new Date().toISOString(), initiale: (p.username || '?')[0].toUpperCase(), avatarUrl: p.avatar_url || null, role: p.role || null, privateStats: reads === 0 && quizzes === 0 });
      } else {
        setProfile(null);
      }
    } catch (e) {console.error(e);setProfile(null);}
    setLoading(false);
  }

  useEffect(() => {fetchProfile();}, [authProfile, authUser]);

  // Profil introuvable (ne devrait pas arriver : on est forcément connecté)
  if (!loading && !profile) return (
    <div style={{ width: '100%', paddingTop: '3rem', textAlign: 'center' }}>
      <div style={{ fontSize: '2rem', marginBottom: '.75rem' }}>👤</div>
      <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.1rem', fontWeight: 700, color: 'var(--ink)', marginBottom: '.5rem' }}>Profil indisponible</div>
      <div style={{ fontSize: '.78rem', color: 'var(--ink3)', marginBottom: '1.25rem' }}>Impossible de charger ton profil pour le moment.</div>
      <button onClick={() => fetchProfile()} style={{ padding: '.65rem 1.4rem', background: 'var(--adim)', border: '1px solid var(--a)', borderRadius: '.75rem', color: 'var(--a)', fontSize: '.78rem', fontWeight: 700, cursor: 'pointer', fontFamily: 'Space Grotesk,sans-serif' }}>↻ Réessayer</button>
    </div>);


  if (loading) return (
    <div style={{ width: '100%', paddingTop: '2rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
      {[120, 60, 60, 120].map((h, i) => <div key={i} style={{ height: h, background: 'var(--s1)', borderRadius: '1rem', animation: 'psk 1.5s ease-in-out infinite', animationDelay: i * .15 + 's' }} />)}
    </div>);


  // Barème de rang UNIFIÉ avec le hub (RANKS global) — le rang du profil = celui de la carte Hunter
  const rank = getRank(profile.xp);

  const xpPct = nextRank ? Math.min(100, Math.round((profile.xp - rank.minXP) / (nextRank.minXP - rank.minXP) * 100)) : 100;

        )}
      </div>
    <button onClick={() => onNav('archives')} style={{ width: '100%', marginTop: '1.25rem', padding: '.8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(251,191,36,.06)', border: '1px solid rgba(251,191,36,.2)', borderRadius: '.85rem', color: '#fbbf24', cursor: 'pointer' }}>📚 Mes Archives</button>
    <div style={{ display: 'flex', gap: '.6rem', marginTop: '.65rem' }}>

      <NotifButton />
    </div>

    <EditProfileDrawer open={showEdit} onClose={() => setShowEdit(false)} onSave={() => { setShowEdit(false); setEditKey(k => k + 1); }} />
    </div>);

}

function ScreenDuel() {
  const DUEL_COLOR = '#a855f7';
  const DUEL_THEMES = [
  { id: 'histoire', label: 'Histoire', icon: '🏛️', color: '#d97706' },
  { id: 'science', label: 'Science', icon: '🔬', color: '#00c8ff' },
  { id: 'nature', label: 'Nature', icon: '🌿', color: '#22c55e' },
  { id: 'insolite', label: 'Insolite', icon: '🎭', color: '#a855f7' },
  { id: 'art', label: 'Art', icon: '🎨', color: '#ec4899' },
  { id: 'espace', label: 'Espace', icon: '🚀', color: '#818cf8' },
  { id: 'sport', label: 'Sport', icon: '⚡', color: '#f97316' },
  { id: 'food', label: 'Gastro', icon: '🍽️', color: '#fb923c' },
  { id: 'legendes', label: 'Légendes', icon: '🔍', color: '#14b8a6' }];

  const BOT_RANKS = [
  { id: 'E', label: 'E', color: '#9ca3af', min: .30, max: .50 },
  { id: 'D', label: 'D', color: '#22c55e', min: .45, max: .65 },
  { id: 'C', label: 'C', color: '#00c8ff', min: .60, max: .75 },
  { id: 'B', label: 'B', color: '#a855f7', min: .72, max: .85 },
  { id: 'A', label: 'A', color: '#fbbf24', min: .82, max: .92 },
  { id: 'S', label: 'S', color: '#ef4444', min: .88, max: .95 }];

  const BOT_NAMES = ['Théo42', 'LucasQ', 'Emma_X', 'JujuPro', 'Naomie', 'Zak99', 'KilianK', 'Sofia3', 'MaxDev', 'Clément', 'InèsZ', 'ThibO', 'CharlyB', 'NoéM', 'AlinaS'];
  const FALLBACK_Q = [
  { question: "Quelle est la capitale de l'Australie ?", answers: ["Sydney", "Melbourne", "Canberra", "Brisbane"], correctIdx: 2 },
  { question: "Combien de côtés a un hexagone ?", answers: ["5", "6", "7", "8"], correctIdx: 1 },
  { question: "Qui a peint la Joconde ?", answers: ["Michel-Ange", "Raphaël", "Léonard de Vinci", "Botticelli"], correctIdx: 2 },
  { question: "En quelle année la Révolution française ?", answers: ["1789", "1769", "1799", "1815"], correctIdx: 0 },
  { question: "Symbole chimique du Fer ?", answers: ["Au", "Fe", "Cu", "Ag"], correctIdx: 1 },
  { question: "Plus grande planète du système solaire ?", answers: ["Saturne", "Neptune", "Jupiter", "Uranus"], correctIdx: 2 },
  { question: "Auteur des Misérables ?", answers: ["Balzac", "Zola", "Hugo", "Flaubert"], correctIdx: 2 },
  { question: "Vitesse de la lumière (km/s) ?", answers: ["100 000", "200 000", "300 000", "400 000"], correctIdx: 2 },
  { question: "Première marche sur la Lune ?", answers: ["1965", "1967", "1969", "1971"], correctIdx: 2 },
  { question: "Combien d'os dans le corps humain adulte ?", answers: ["196", "206", "216", "226"], correctIdx: 1 },
  { question: "Capital de l'Argentine ?", answers: ["Santiago", "Lima", "Buenos Aires", "Bogotá"], correctIdx: 2 },
  { question: "Formule de l'eau ?", answers: ["H2O2", "CO2", "H2O", "NaCl"], correctIdx: 2 }];


  const [phase, setPhase] = useState('lobby');
  const [mode, setMode] = useState(null);
  const [selRank, setSelRank] = useState(null);
  const [bot, setBot] = useState(null);
  const [isDoubleEveil, setIsDoubleEveil] = useState(false);
  const [myScore, setMyScore] = useState(0);
  const [botScore, setBotScore] = useState(0);
  const [rounds, setRounds] = useState([]); // completed rounds
  const [curRound, setCurRound] = useState(0); // 0-3
  const [curTheme, setCurTheme] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [myAnswers, setMyAnswers] = useState([]);
  const [botAnswers, setBotAnswers] = useState([]);
  const [waiting, setWaiting] = useState(false);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);

  const TOTAL_ROUNDS = 4;
  const Q_PER_ROUND = 3;

  function startBot() {
    const r = BOT_RANKS.find((x) => x.id === selRank) || BOT_RANKS[2];
    const eveil = Math.random() < 0.08;
    const rate = (r.min + Math.random() * (r.max - r.min)) * (eveil ? 1.3 : 1);
    const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    setBot({ name, rank: r.id, color: r.color, rate: Math.min(0.97, rate) });
    setIsDoubleEveil(eveil);
    setPhase('theme-pick');
  }

  function startMatchmaking() {
    setPhase('matchmaking');
    setTimeout(() => {
      // VS Human simulated by random bot C-B
      const r = BOT_RANKS[2 + Math.floor(Math.random() * 2)];
      const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
      const rate = r.min + Math.random() * (r.max - r.min);
      setBot({ name, rank: r.id, color: r.color, rate });
      setIsDoubleEveil(false);
      setPhase('theme-pick');
    }, 3000);
  }

  async function pickThemeAndLoad(themeId) {
    setCurTheme(themeId);
    setMyAnswers([]);setBotAnswers([]);setQIdx(0);setSelected(null);setAnswered(false);
    let qs = [];
    try {
      const { data } = await sb.rpc('get_random_questions', { n: Q_PER_ROUND });
      if (data && data.length >= 3) qs = data.map((q) => ({ question: q.question, answers: q.options, correctIdx: q.answer }));
    } catch (e) {}
    if (!qs.length) {
      qs = [...FALLBACK_Q].sort(() => Math.random() - .5).slice(0, Q_PER_ROUND);
    }
    setQuestions(qs);
    setPhase('questions');
  }

  function handleAnswer(optIdx) {
    if (answered) return;
    const q = questions[qIdx];
    const ok = optIdx === q.correctIdx;
    setSelected(optIdx);setAnswered(true);
    const newMA = [...myAnswers, { chosen: optIdx, correct: ok }];
    setMyAnswers(newMA);
    // Ne pas auto-avancer — le joueur clique "Suivant"
  }

  function nextQuestion() {
    const newMA = myAnswers;
    if (qIdx < Q_PER_ROUND - 1) {setQIdx((i) => i + 1);setSelected(null);setAnswered(false);} else
    {
      // Fin du round — bot répond
      setWaiting(true);
      setTimeout(() => {
        const ba = questions.map((q) => ({ correct: Math.random() < bot.rate }));
        setBotAnswers(ba);
        const mPts = newMA.filter((a) => a.correct).length;
        const bPts = ba.filter((a) => a.correct).length;
        setMyScore((s) => s + mPts);
        setBotScore((s) => s + bPts);
        const newRound = { round: curRound, theme: curTheme, myPts: mPts, botPts: bPts, myAnswers: newMA, botAnswers: ba, picker: curRound % 2 === 0 ? 'me' : 'bot' };
        const newRounds = [...rounds, newRound];
        setRounds(newRounds);
        setWaiting(false);
        if (curRound + 1 >= TOTAL_ROUNDS) {setPhase('final');} else
        {setCurRound((r) => r + 1);setPhase('round-reveal');}
      }, 1200);
    }
  }

  // Bot picks theme for even rounds
  function botPickTheme() {
    const t = DUEL_THEMES[Math.floor(Math.random() * DUEL_THEMES.length)];
    pickThemeAndLoad(t.id);
  }

  const theme = DUEL_THEMES.find((t) => t.id === curTheme);
  const q = questions[qIdx];
  const iMyRound = curRound % 2 === 0;

  // ── LOBBY ──
  if (phase === 'lobby') return (
    <div style={{ width: '100%' }}>
      <div style={{ textAlign: 'center', padding: '1.5rem 0 1.25rem' }}>
        <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: 'clamp(1.6rem,4vw,2.2rem)', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '-.01em', color: 'var(--ink)', lineHeight: 1.1, marginBottom: '.5rem' }}>
          Duel<br /><span style={{ color: DUEL_COLOR }}>Quiz</span>
        </div>
        <div style={{ fontSize: '.75rem', color: 'var(--ink3)' }}>4 rounds · 12 questions · 1 vainqueur</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '.75rem', marginBottom: '1.5rem' }}>
        {[
        { id: 'human', ico: '👤', title: 'VS Humain', desc: 'Recherche un joueur disponible', color: '#00c8ff', xp: '+200 XP' },
        { id: 'bot', ico: '🤖', title: 'VS Bot', desc: 'Choisis ton adversaire (E → S)', color: DUEL_COLOR, xp: '+150 XP' }].
        map((m) =>
        <div key={m.id} onClick={() => setMode(m.id)}
        style={{ background: mode === m.id ? `color-mix(in srgb,${m.color} 12%,var(--bg))` : `color-mix(in srgb,${m.color} 5%,var(--bg))`, border: `1px solid color-mix(in srgb,${m.color} ${mode === m.id ? 55 : 22}%,transparent)`, borderRadius: '1rem', padding: '1rem 1.25rem', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '1rem', transition: 'all .18s', boxShadow: mode === m.id ? `0 6px 20px color-mix(in srgb,${m.color} 20%,transparent)` : 'none' }}>
            <span style={{ fontSize: '1.8rem' }}>{m.ico}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: '.92rem', fontWeight: 700, color: mode === m.id ? 'var(--ink)' : 'var(--ink2)' }}>{m.title}</div>
              <div style={{ fontSize: '.65rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{m.desc}</div>
            </div>
            <span style={{ fontSize: '.58rem', fontWeight: 700, color: m.color, background: `color-mix(in srgb,${m.color} 15%,transparent)`, border: `1px solid color-mix(in srgb,${m.color} 30%,transparent)`, borderRadius: '999px', padding: '.2rem .6rem' }}>{m.xp}</span>
          </div>
        )}
      </div>
      {mode === 'bot' &&
      <div style={{ marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.65rem' }}>Rang de l'adversaire</div>
          <div style={{ display: 'flex', gap: '.5rem', flexWrap: 'wrap' }}>
            {BOT_RANKS.map((r) =>
          <button key={r.id} onClick={() => setSelRank(r.id)}
          style={{ padding: '.5rem .9rem', background: selRank === r.id ? `color-mix(in srgb,${r.color} 20%,var(--bg))` : 'rgba(255,255,255,.04)', border: `1px solid ${selRank === r.id ? r.color : 'rgba(255,255,255,.1)'}`, borderRadius: '.65rem', color: selRank === r.id ? r.color : 'var(--ink3)', fontWeight: 800, fontSize: '.8rem', cursor: 'pointer', fontFamily: 'monospace', transition: 'all .15s' }}>
                {r.id}
              </button>
          )}
          </div>
          <div style={{ fontSize: '.62rem', color: 'rgba(168,85,247,.6)', marginTop: '.5rem' }}>⚠️ Risque de Double Éveil : le bot pourrait cacher sa vraie puissance</div>
        </div>
      }
      <button disabled={!mode || mode === 'bot' && !selRank}
      onClick={() => mode === 'human' ? startMatchmaking() : startBot()}
      style={{ width: '100%', padding: '1rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.82rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: mode && (mode === 'human' || selRank) ? DUEL_COLOR : 'rgba(168,85,247,.06)', color: mode && (mode === 'human' || selRank) ? '#fff' : 'rgba(168,85,247,.3)', border: 'none', borderRadius: '1rem', cursor: mode && (mode === 'human' || selRank) ? 'pointer' : 'default', transition: 'all .22s', boxShadow: mode && (mode === 'human' || selRank) ? `0 4px 20px rgba(168,85,247,.3),0 2px 0 #5b21b6` : 'none' }}>
        ⚔️ Lancer le duel
      </button>
    </div>);


  // ── MATCHMAKING ──
  if (phase === 'matchmaking') return (
    <div style={{ width: '100%', minHeight: '50vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1.5rem', textAlign: 'center' }}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <div style={{ width: '52px', height: '52px', border: `3px solid color-mix(in srgb,${DUEL_COLOR} 20%,transparent)`, borderTopColor: DUEL_COLOR, borderRadius: '50%', animation: 'spin .9s linear infinite' }} />
      <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '.85rem', fontWeight: 700, color: 'var(--ink)', letterSpacing: '.08em' }}>Recherche d'un adversaire…</div>
      <div style={{ fontSize: '.7rem', color: 'var(--ink3)' }}>Connexion en cours</div>
    </div>);


  // ── THEME PICK ──
  if (phase === 'theme-pick') {
    if (!iMyRound) {setTimeout(() => botPickTheme(), 800);return (
        <div style={{ width: '100%', textAlign: 'center', paddingTop: '3rem' }}>
        <div style={{ fontSize: '1.5rem', marginBottom: '1rem', animation: 'sl-pulse 1.5s ease-in-out infinite' }}>🤖</div>
        <div style={{ fontSize: '.85rem', fontWeight: 600, color: 'var(--ink)', marginBottom: '.4rem' }}>{bot?.name} choisit un thème…</div>
        <div style={{ fontSize: '.7rem', color: 'var(--ink3)' }}>Round {curRound + 1}/4</div>
      </div>);
    }
    return (
      <div style={{ width: '100%' }}>
        <div style={{ marginBottom: '1.25rem' }}>
          <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.18em', color: DUEL_COLOR, textTransform: 'uppercase', marginBottom: '.4rem' }}>Round {curRound + 1}/4 · Ton choix</div>
          <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.2rem', fontWeight: 800, color: 'var(--ink)', textTransform: 'uppercase', letterSpacing: '-.01em' }}>Choisis un thème →</div>
          <div style={{ fontSize: '.72rem', color: 'var(--ink3)', marginTop: '.25rem' }}>vs <strong style={{ color: bot?.color }}>{bot?.name}</strong> [{bot?.rank}-RANG]</div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '.5rem' }}>
          {DUEL_THEMES.map((t) =>
          <div key={t.id} onClick={() => pickThemeAndLoad(t.id)}
          style={{ background: `color-mix(in srgb,${t.color} 8%,var(--bg))`, border: `1px solid color-mix(in srgb,${t.color} 22%,transparent)`, borderRadius: '.85rem', padding: '.8rem .6rem', cursor: 'pointer', textAlign: 'center', transition: 'all .15s' }}
          onMouseEnter={(e) => {e.currentTarget.style.transform = 'translateY(-2px)';e.currentTarget.style.borderColor = `color-mix(in srgb,${t.color} 50%,transparent)`;}}
          onMouseLeave={(e) => {e.currentTarget.style.transform = '';e.currentTarget.style.borderColor = `color-mix(in srgb,${t.color} 22%,transparent)`;}}>
              <div style={{ fontSize: '1.4rem', marginBottom: '.25rem' }}>{t.icon}</div>
              <div style={{ fontSize: '.65rem', fontWeight: 600, color: 'var(--ink2)' }}>{t.label}</div>
            </div>
          )}
        </div>
      </div>);

  }

  // ── QUESTIONS ──
  if (phase === 'questions' && q) return (
    <div style={{ width: '100%' }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem' }}>
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: theme?.color || DUEL_COLOR, background: `color-mix(in srgb,${theme?.color || DUEL_COLOR} 12%,transparent)`, border: `1px solid color-mix(in srgb,${theme?.color || DUEL_COLOR} 28%,transparent)`, borderRadius: '999px', padding: '.2rem .6rem', letterSpacing: '.08em' }}>{theme?.icon} {theme?.label}</span>
          <span style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>Q{qIdx + 1}/{Q_PER_ROUND} · R{curRound + 1}/4</span>
        </div>
        <div style={{ display: 'flex', gap: '.5rem', alignItems: 'center' }}>
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: 'var(--gr)' }}>Toi {myScore}</span>
          <span style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>vs</span>
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: bot?.color || DUEL_COLOR }}>{bot?.name?.split('')[0]}… {botScore}</span>
        </div>
      </div>
      {/* Progress */}
      <div style={{ height: '3px', background: 'rgba(255,255,255,.06)', borderRadius: '2px', marginBottom: '1.25rem', overflow: 'hidden' }}>
        <div style={{ height: '100%', width: qIdx / Q_PER_ROUND * 100 + '%', background: theme?.color || DUEL_COLOR, borderRadius: '2px', transition: 'width .3s' }} />
      </div>
      {/* Question */}
      <div style={{ background: `color-mix(in srgb,${theme?.color || DUEL_COLOR} 6%,var(--hero-base))`, border: `1px solid color-mix(in srgb,${theme?.color || DUEL_COLOR} 22%,transparent)`, borderRadius: '1.25rem', padding: '1.25rem 1.4rem', marginBottom: '1rem' }}>
        <div style={{ fontSize: '.95rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.6 }}>{q.question}</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '.45rem' }}>
        {q.answers.map((ans, i) => {
          const isCorrect = i === q.correctIdx,isSel = i === selected;
          let bg = 'rgba(255,255,255,.04)',bdr = 'rgba(255,255,255,.1)',clr = 'var(--ink2)';
          if (answered) {if (isCorrect) {bg = 'rgba(52,211,153,.14)';bdr = '#34d399';clr = '#34d399';} else if (isSel) {bg = 'rgba(248,113,113,.14)';bdr = '#f87171';clr = '#f87171';}}
          return (
            <button key={i} onClick={() => handleAnswer(i)} disabled={answered}
            style={{ background: bg, border: `1px solid ${bdr}`, borderRadius: '.75rem', padding: '.75rem .95rem', textAlign: 'left', color: clr, fontSize: '.82rem', cursor: answered ? 'default' : 'pointer', transition: 'all .15s', fontFamily: 'Space Grotesk,sans-serif', display: 'flex', gap: '.5rem', alignItems: 'flex-start' }}>
              <span style={{ fontWeight: 700, color: answered ? isCorrect ? '#34d399' : isSel ? '#f87171' : 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.3)', flexShrink: 0 }}>{String.fromCharCode(65 + i)}.</span>
              {ans}
            </button>);

        })}
      </div>
      {answered && q.explanation &&
      <div style={{ marginTop: '.75rem', padding: '.65rem .9rem', background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.08)', borderRadius: '.75rem', fontSize: '.76rem', color: 'var(--ink2)', lineHeight: 1.65 }}>
          💡 {q.explanation}
        </div>
      }
      {answered && !waiting &&
      <button onClick={nextQuestion} style={{ marginTop: '.75rem', width: '100%', padding: '.7rem', background: `color-mix(in srgb,${theme?.color || '#a855f7'} 12%,transparent)`, border: `1px solid color-mix(in srgb,${theme?.color || '#a855f7'} 30%,transparent)`, borderRadius: '.75rem', color: theme?.color || '#a855f7', fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, fontSize: '.78rem', cursor: 'pointer', letterSpacing: '.06em' }}>
          {qIdx < Q_PER_ROUND - 1 ? 'Question suivante →' : 'Fin du round →'}
        </button>
      }
      {waiting && <div style={{ marginTop: '.75rem', textAlign: 'center', fontSize: '.72rem', color: 'var(--ink3)', animation: 'sl-pulse 1.2s ease-in-out infinite' }}>{bot?.name} répond…</div>}
    </div>);


  // ── ROUND REVEAL ──
  if (phase === 'round-reveal') {
    const last = rounds[rounds.length - 1];
    const t = DUEL_THEMES.find((x) => x.id === last?.theme);
    const myW = last?.myPts > last?.botPts,tie = last?.myPts === last?.botPts;
    return (
      <div style={{ width: '100%', textAlign: 'center', paddingTop: '1.5rem' }}>
        <div style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.18em', color: DUEL_COLOR, textTransform: 'uppercase', marginBottom: '.75rem' }}>Round {curRound}/4 terminé</div>
        <div style={{ background: `color-mix(in srgb,${t?.color || DUEL_COLOR} 8%,var(--bg))`, border: `1px solid color-mix(in srgb,${t?.color || DUEL_COLOR} 22%,transparent)`, borderRadius: '1rem', padding: '1rem', marginBottom: '1.25rem', display: 'flex', justifyContent: 'space-around', alignItems: 'center' }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: '1.6rem', fontWeight: 800, color: myW ? '#34d399' : tie ? '#fbbf24' : '#f87171', fontFamily: 'monospace' }}>{last?.myPts}</div>
            <div style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>Toi</div>
          </div>
          <div style={{ fontSize: '1.4rem' }}>{t?.icon}</div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: '1.6rem', fontWeight: 800, color: !myW && !tie ? '#34d399' : tie ? '#fbbf24' : '#f87171', fontFamily: 'monospace' }}>{last?.botPts}</div>
            <div style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>{bot?.name}</div>
          </div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', padding: '.65rem 1rem', background: 'rgba(255,255,255,.03)', border: '1px solid rgba(255,255,255,.06)', borderRadius: '1rem', marginBottom: '1.25rem' }}>
          <span style={{ fontSize: '.7rem', color: 'var(--ink3)' }}>Score total</span>
          <span style={{ fontSize: '.75rem', fontWeight: 700, color: 'var(--ink)' }}>{myScore} – {botScore}</span>
        </div>
        <button onClick={() => setPhase('theme-pick')} style={{ width: '100%', padding: '.85rem', background: `color-mix(in srgb,${DUEL_COLOR} 15%,transparent)`, border: `1px solid color-mix(in srgb,${DUEL_COLOR} 35%,transparent)`, borderRadius: '1rem', color: DUEL_COLOR, fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, fontSize: '.8rem', cursor: 'pointer', letterSpacing: '.08em' }}>
          Round {curRound + 1} →
        </button>
      </div>);

  }

  // ── FINAL ──
  if (phase === 'final') {
    const win = myScore > botScore,tie = myScore === botScore;
    const xp = win ? 200 : tie ? 80 : 30;
    return (
      <div style={{ width: '100%', textAlign: 'center', paddingTop: '1.5rem' }}>
        {/* Double Éveil reveal */}
        {isDoubleEveil && !win &&
        <div style={{ background: 'rgba(236,72,153,.1)', border: '1px solid rgba(236,72,153,.4)', borderRadius: '1rem', padding: '.85rem 1rem', marginBottom: '1.25rem', animation: 'sl-pulse .8s ease-in-out' }}>
            <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.18em', color: '#ec4899', textTransform: 'uppercase', marginBottom: '.25rem' }}>⚠ DOUBLE ÉVEIL DÉTECTÉ</div>
            <div style={{ fontSize: '.8rem', color: 'var(--ink2)' }}>{bot?.name} cachait sa vraie puissance, ce n'était pas une défaite ordinaire.</div>
          </div>
        }
        {isDoubleEveil && win &&
        <div style={{ background: 'rgba(52,211,153,.1)', border: '1px solid rgba(52,211,153,.35)', borderRadius: '1rem', padding: '.85rem 1rem', marginBottom: '1.25rem' }}>
            <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.18em', color: '#34d399', textTransform: 'uppercase', marginBottom: '.25rem' }}>🏆 EXPLOIT</div>
            <div style={{ fontSize: '.8rem', color: 'var(--ink2)' }}>Tu as vaincu un guerrier en état d'Éveil : performance exceptionnelle !</div>
          </div>
        }
        <div style={{ fontSize: win ? '4rem' : tie ? '3rem' : '3.5rem', marginBottom: '.75rem', animation: 'sl-pulse 1s ease-in-out infinite' }}>{win ? '🏆' : tie ? '🤝' : '💀'}</div>
        <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '2rem', fontWeight: 800, textTransform: 'uppercase', color: win ? '#fbbf24' : tie ? '#00c8ff' : '#ef4444', letterSpacing: '.1em', marginBottom: '.4rem' }}>{win ? 'Victoire !' : tie ? 'Égalité !' : 'Défaite'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.6rem', margin: '1.25rem 0' }}>
          <div style={{ background: 'rgba(52,211,153,.08)', border: '1px solid rgba(52,211,153,.2)', borderRadius: '1rem', padding: '1rem' }}>
            <div style={{ fontFamily: 'monospace', fontSize: '1.4rem', fontWeight: 700, color: 'var(--gr)' }}>{myScore}</div>
            <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>Toi</div>
          </div>
          <div style={{ background: `color-mix(in srgb,${bot?.color || DUEL_COLOR} 8%,transparent)`, border: `1px solid color-mix(in srgb,${bot?.color || DUEL_COLOR} 20%,transparent)`, borderRadius: '1rem', padding: '1rem' }}>
            <div style={{ fontFamily: 'monospace', fontSize: '1.4rem', fontWeight: 700, color: bot?.color || DUEL_COLOR }}>{botScore}</div>
            <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{bot?.name}{isDoubleEveil ? <span style={{ color: '#ec4899' }}> ★</span> : null}</div>
          </div>
        </div>
        <div style={{ padding: '.75rem', background: `color-mix(in srgb,${DUEL_COLOR} 8%,transparent)`, border: `1px solid color-mix(in srgb,${DUEL_COLOR} 20%,transparent)`, borderRadius: '1rem', marginBottom: '1.25rem', fontSize: '.8rem', color: 'var(--ink2)' }}>
          +{xp} XP remportés
        </div>
        <button onClick={() => {setPhase('lobby');setMode(null);setSelRank(null);setBot(null);setMyScore(0);setBotScore(0);setRounds([]);setCurRound(0);}}
        style={{ width: '100%', padding: '.85rem', background: `color-mix(in srgb,${DUEL_COLOR} 15%,transparent)`, border: `1px solid color-mix(in srgb,${DUEL_COLOR} 35%,transparent)`, borderRadius: '1rem', color: DUEL_COLOR, fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, fontSize: '.8rem', cursor: 'pointer', letterSpacing: '.08em' }}>
          Rejouer →
        </button>
      </div>);

  }

  return null;
}

// ── QUIZ SOLO ──
function ScreenQuizSolo({ onBack }) {
  const QS_COLOR = '#22c55e';
  const [phase, setPhase] = useState('setup');
  const [nbQ, setNbQ] = useState(10);
  const [questions, setQuestions] = useState([]);
  const [availableCount, setAvailableCount] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const user = (await sb.auth.getUser()).data?.user;
        if (!user) {setAvailableCount(0);return;}
        const { data: reads } = await sb.from('reads').select('anecdote_id').eq('user_id', user.id);
        const anecIds = (reads || []).map((r) => r.anecdote_id);
        if (!anecIds.length) {setAvailableCount(0);return;}
        const { data: rawQs } = await sb.from('questions').select('id').in('anecdote_id', anecIds);
        setAvailableCount((rawQs || []).length);
      } catch (e) {setAvailableCount(null);}
    })();
  }, []);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [wrongs, setWrongs] = useState([]);
  const [combo, setCombo] = useState(0);

  async function start() {
    setPhase('loading');
    let qs = [];
    try {
      // Même logique que le prod : reads → questions filtrées par anecdotes lues
      const user = (await sb.auth.getUser()).data?.user;
      if (user) {
        const { data: reads } = await sb.from('reads').select('anecdote_id').eq('user_id', user.id);
        const anecIds = (reads || []).map((r) => r.anecdote_id);
        if (anecIds.length) {
          const { data: rawQs } = await sb.from('questions').select('*').in('anecdote_id', anecIds);
          if (rawQs && rawQs.length >= 3) {
            qs = [...rawQs].sort(() => Math.random() - .5).slice(0, nbQ).
            map((q) => ({ question: q.question, answers: q.options, correctIdx: q.answer, explanation: q.explanation || '' }));
          }
        }
      }
    } catch (e) {console.warn('Quiz solo fetch:', e);}
    if (!qs.length) qs = [...FALLBACK_VS100].sort(() => Math.random() - .5).slice(0, Math.min(nbQ, FALLBACK_VS100.length));
    setQuestions(qs);setIdx(0);setScore(0);setWrongs([]);setSelected(null);setAnswered(false);setCombo(0);
    setPhase('question');
  }

  function handleAnswer(chosen) {
    if (answered) return;
    const q = questions[idx];
    const ok = chosen === q.correctIdx;
    setSelected(chosen);setAnswered(true);
    if (ok) {setScore((s) => s + (combo >= 3 ? 1.5 : 1));setCombo((c) => c + 1);} else
    {setWrongs((w) => [...w, { q, chosen }]);setCombo(0);}
  }

  function next() {
    if (idx >= questions.length - 1) setPhase('results');else
    {setIdx((i) => i + 1);setSelected(null);setAnswered(false);}
  }

  // ── SETUP ──
  if (phase === 'setup') {
    const mins = Math.ceil(nbQ * 0.5);
    return (
      <div style={{ width: '100%' }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '.72rem', fontFamily: 'Space Grotesk,sans-serif', marginBottom: '1.5rem', display: 'flex', alignItems: 'center', gap: '.4rem', padding: 0 }}>← Retour</button>
        <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
          <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: QS_COLOR, textTransform: 'uppercase', marginBottom: '.5rem' }}>🎯 D-RANG · QUIZ SOLO</div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '2.2rem', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '.06em', color: 'var(--ink)', lineHeight: 1.1, marginBottom: '.5rem' }}>Révision</div>
          <div style={{ fontSize: '.78rem', color: 'var(--ink3)' }}>
            {availableCount === null ? 'Chargement…' : availableCount === 0 ? '⚠ Lis des anecdotes pour débloquer le quiz de révision !' : `${availableCount} question${availableCount > 1 ? 's' : ''} disponibles · tirées de tes anecdotes lues`}
          </div>
        </div>
        <div style={{ background: `color-mix(in srgb,${QS_COLOR} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${QS_COLOR} 22%,transparent)`, borderRadius: '1rem', padding: '1.5rem', marginBottom: '1.5rem' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '1rem' }}>
            <span style={{ fontSize: '.62rem', fontWeight: 700, letterSpacing: '.12em', color: 'var(--ink3)', textTransform: 'uppercase' }}>Nombre de questions</span>
            <span style={{ fontFamily: 'Syne,sans-serif', fontSize: '2.4rem', fontWeight: 800, color: QS_COLOR, lineHeight: 1 }}>{nbQ}</span>
          </div>
          <input type="range" min="5" max={availableCount ? Math.min(50, availableCount) : 50} step="5" value={nbQ} onChange={(e) => setNbQ(+e.target.value)}
          style={{ width: '100%', accentColor: QS_COLOR, cursor: 'pointer', marginBottom: '.75rem' }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '.58rem', color: 'var(--ink3)' }}>
            <span>5 min.</span><span>~{mins} min. estimées</span><span>25 min.</span>
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '.5rem', marginBottom: '1.5rem' }}>
          {[['📖', 'Pas de timer', 'À ton rythme'], ['💡', 'Explications', 'À chaque réponse'], ['🏆', '+80 XP max', 'Selon ton score']].map(([ico, lbl, sub], i) =>
          <div key={i} style={{ background: 'rgba(255,255,255,.03)', border: '1px solid var(--b1)', borderRadius: '.75rem', padding: '.75rem .5rem', textAlign: 'center' }}>
              <div style={{ fontSize: '1.1rem', marginBottom: '.25rem' }}>{ico}</div>
              <div style={{ fontSize: '.65rem', fontWeight: 700, color: 'var(--ink2)' }}>{lbl}</div>
              <div style={{ fontSize: '.58rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{sub}</div>
            </div>
          )}
        </div>
        <button onClick={start} style={{ width: '100%', padding: '1rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.82rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: QS_COLOR, color: '#000', border: 'none', borderRadius: '1rem', cursor: 'pointer', boxShadow: `0 4px 0 #15803d,0 6px 20px ${QS_COLOR}44` }}>
          🎯 Commencer · {nbQ} questions
        </button>
      </div>);
  }

  // ── LOADING ──
  if (phase === 'loading') return (
    <div style={{ width: '100%', minHeight: '50vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1rem' }}>
      <div style={{ fontSize: '1.4rem', fontWeight: 800, color: QS_COLOR, letterSpacing: '.12em', textTransform: 'uppercase', fontFamily: 'Syne,sans-serif', animation: 'sl-pulse 1.5s ease-in-out infinite' }}>Chargement…</div>
      <div style={{ fontSize: '.72rem', color: 'var(--ink3)' }}>Préparation de tes {nbQ} questions…</div>
    </div>);

  // ── QUESTION ──
  if (phase === 'question') {
    const q = questions[idx];
    const prog = Math.round(idx / questions.length * 100);
    const isRight = selected === q.correctIdx;
    return (
      <div style={{ width: '100%' }}>
        {/* Header progress */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '.6rem' }}>
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: QS_COLOR, background: `${QS_COLOR}18`, border: `1px solid ${QS_COLOR}44`, borderRadius: '999px', padding: '.22rem .7rem', letterSpacing: '.1em' }}>Q{idx + 1}/{questions.length}</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.4rem' }}>
            {combo >= 3 && <span style={{ fontSize: '.58rem', fontWeight: 800, color: '#f97316', background: 'rgba(249,115,22,.12)', border: '1px solid rgba(249,115,22,.3)', borderRadius: '999px', padding: '.15rem .45rem', letterSpacing: '.06em' }}>🔥 x1.5</span>}
            <span style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>✓ {Math.floor(score)} correctes</span>
          </div>
        </div>
        <div style={{ height: '4px', background: 'rgba(255,255,255,.06)', borderRadius: '2px', marginBottom: '1.25rem' }}>
          <div style={{ height: '100%', width: prog + '%', background: `linear-gradient(90deg,${QS_COLOR},#86efac)`, borderRadius: '2px', transition: 'width .4s ease' }} />
        </div>
        {/* Question card */}
        <div style={{ background: `color-mix(in srgb,${QS_COLOR} 5%,var(--bg))`, border: `1px solid color-mix(in srgb,${QS_COLOR} 18%,transparent)`, borderRadius: '1.25rem', padding: '1.25rem 1.4rem' }}>
          <div style={{ fontSize: '.96rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.65, marginBottom: '1.1rem' }}>{q.question}</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.5rem' }}>
            {q.answers.map((ans, i) => {
              const isCorrect = i === q.correctIdx,isSel = i === selected;
              let bg = 'rgba(255,255,255,.04)',bdr = 'rgba(255,255,255,.1)',clr = 'var(--ink2)';
              if (answered) {
                if (isCorrect) {bg = 'rgba(52,211,153,.14)';bdr = '#34d399';clr = '#34d399';} else
                if (isSel) {bg = 'rgba(248,113,113,.14)';bdr = '#f87171';clr = '#f87171';}
              }
              return (
                <button key={i} onClick={() => handleAnswer(i)} disabled={answered}
                style={{ background: bg, border: `1px solid ${bdr}`, borderRadius: '.75rem', padding: '.7rem .8rem', textAlign: 'left', color: clr, fontSize: '.78rem', cursor: answered ? 'default' : 'pointer', transition: 'all .15s', fontFamily: 'Space Grotesk,sans-serif', display: 'flex', gap: '.45rem', alignItems: 'flex-start', lineHeight: 1.4 }}>
                  <span style={{ fontWeight: 700, flexShrink: 0, color: answered ? isCorrect ? '#34d399' : isSel ? '#f87171' : 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.3)' }}>{String.fromCharCode(65 + i)}.</span>{ans}
                </button>);
            })}
          </div>
          {/* Feedback */}
          {answered &&
          <div style={{ marginTop: '1rem' }}>
              <div style={{ background: isRight ? 'rgba(52,211,153,.06)' : 'rgba(248,113,113,.06)', border: `1px solid ${isRight ? 'rgba(52,211,153,.18)' : 'rgba(248,113,113,.18)'}`, borderRadius: '.75rem', padding: '.75rem .9rem', marginBottom: '.75rem' }}>
                {!isRight && <div style={{ fontSize: '.62rem', fontWeight: 700, letterSpacing: '.1em', color: '#f87171', textTransform: 'uppercase', marginBottom: '.35rem' }}>✗ Bonne réponse : <span style={{ color: '#34d399' }}>{q.answers[q.correctIdx]}</span></div>}
                {q.explanation ?
              <div style={{ fontSize: '.80rem', color: 'var(--ink2)', lineHeight: 1.7 }}>💡 {q.explanation}</div> :
              isRight && <div style={{ fontSize: '.80rem', color: '#34d399', fontWeight: 600 }}>✓ Bonne réponse !</div>}
              </div>
              <button onClick={next} style={{ width: '100%', padding: '.8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.78rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: isRight ? 'rgba(52,211,153,.12)' : 'rgba(255,255,255,.05)', color: isRight ? '#34d399' : 'var(--ink2)', border: `1px solid ${isRight ? 'rgba(52,211,153,.3)' : 'var(--b2)'}`, borderRadius: '.75rem', cursor: 'pointer' }}>
                {idx >= questions.length - 1 ? '🏁 Voir mes résultats' : '▶ Question suivante'}
              </button>
            </div>
          }
        </div>
      </div>);
  }

  // ── RÉSULTATS ──
  if (phase === 'results') {
    const pct = Math.round(score / questions.length * 100);
    const xp = Math.round(80 * pct / 100);
    const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '⭐' : pct >= 50 ? '💪' : '📚';
    return (
      <div style={{ width: '100%' }}>
        {/* Score card */}
        <div style={{ background: `color-mix(in srgb,${QS_COLOR} 7%,var(--bg))`, border: `1px solid color-mix(in srgb,${QS_COLOR} 25%,transparent)`, borderRadius: '1rem', padding: '1.75rem 1.25rem', textAlign: 'center', marginBottom: '1rem' }}>
          <div style={{ fontSize: '3rem', marginBottom: '.5rem' }}>{emoji}</div>
          <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '3.5rem', fontWeight: 800, color: QS_COLOR, lineHeight: 1 }}>{pct}<span style={{ fontSize: '1.8rem', color: 'var(--ink3)' }}>%</span></div>
          <div style={{ fontSize: '.82rem', color: 'var(--ink2)', marginTop: '.4rem', marginBottom: '1rem' }}>{score}/{questions.length} bonnes réponses</div>
          <div style={{ height: '6px', background: 'rgba(255,255,255,.06)', borderRadius: '3px', overflow: 'hidden' }}>
            <div style={{ height: '100%', width: pct + '%', background: `linear-gradient(90deg,${QS_COLOR},#86efac)`, borderRadius: '3px', transition: 'width 1s ease' }} />
          </div>
        </div>
        {/* Stats row */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '.5rem', marginBottom: '1.25rem' }}>
          {[['✓', score, 'Correctes', '#34d399'], ['✗', questions.length - score, 'Erreurs', '#f87171'], ['⚡', '+' + xp, 'XP gagné', '#fbbf24']].map(([ico, val, lbl, c], i) =>
          <div key={i} style={{ background: 'rgba(255,255,255,.03)', border: '1px solid var(--b1)', borderRadius: '.75rem', padding: '.85rem .5rem', textAlign: 'center' }}>
              <div style={{ fontSize: '.7rem', color: c, marginBottom: '.2rem' }}>{ico}</div>
              <div style={{ fontFamily: 'Syne,sans-serif', fontSize: '1.4rem', fontWeight: 800, color: 'var(--ink)' }}>{val}</div>
              <div style={{ fontSize: '.58rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{lbl}</div>
            </div>
          )}
        </div>
        {/* Revue des erreurs */}
        {wrongs.length > 0 &&
        <div style={{ marginBottom: '1.25rem' }}>
            <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.16em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.7rem' }}>📋 Révision des erreurs</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '.6rem' }}>
              {wrongs.map(({ q, chosen }, i) =>
            <div key={i} style={{ background: 'rgba(248,113,113,.04)', border: '1px solid rgba(248,113,113,.15)', borderRadius: '.85rem', padding: '.85rem 1rem' }}>
                  <div style={{ fontSize: '.8rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.5, marginBottom: '.5rem' }}>{q.question}</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '.25rem', marginBottom: q.explanation ? '.5rem' : 0 }}>
                    <div style={{ fontSize: '.72rem', color: '#f87171' }}>✗ Ta réponse : {q.answers[chosen]}</div>
                    <div style={{ fontSize: '.72rem', color: '#34d399' }}>✓ Bonne réponse : {q.answers[q.correctIdx]}</div>
                  </div>
                  {q.explanation && <div style={{ fontSize: '.72rem', color: 'var(--ink3)', lineHeight: 1.6, borderTop: '1px solid rgba(255,255,255,.05)', paddingTop: '.45rem' }}>💡 {q.explanation}</div>}
                </div>
            )}
            </div>
          </div>
        }
        {/* Actions */}
        <div style={{ display: 'flex', gap: '.65rem' }}>
          <button onClick={() => {setPhase('setup');setQuestions([]);}} style={{ flex: 1, padding: '.75rem', background: `${QS_COLOR}18`, border: `1px solid ${QS_COLOR}44`, borderRadius: '.75rem', color: QS_COLOR, fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, cursor: 'pointer', fontSize: '.76rem' }}>🔄 Rejouer</button>
          <button onClick={onBack} style={{ flex: 1, padding: '.75rem', background: 'rgba(255,255,255,.04)', border: '1px solid var(--b1)', borderRadius: '.75rem', color: 'var(--ink2)', fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, cursor: 'pointer', fontSize: '.76rem' }}>← Retour</button>
        </div>
      </div>);
  }
  return null;
}

// ── ARCHIVES (tabbed) ──
function ArchiveTabContent({ table, fields, sortCol, renderCard, color }) {
  const PAGE = 15;
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState(0);
  const [hasMore, setHasMore] = useState(true);
  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const { data } = await sb.from(table).select(fields).order(sortCol || 'date', { ascending: false }).range(page * PAGE, (page + 1) * PAGE - 1);
        const d = data || [];
        setItems(prev => page === 0 ? d : [...prev, ...d]);
        setHasMore(d.length === PAGE);
      } catch (e) {}
      setLoading(false);
    })();
  }, [page]);
  if (loading && !items.length) return <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Chargement…</div>;
  if (!items.length) return <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Aucun contenu encore.</div>;
  return (
    <>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '.55rem', marginBottom: '1rem' }}>
        {items.map((item, i) => renderCard(item, i, color))}
      </div>
      {hasMore && !loading && <button onClick={() => setPage(p => p + 1)} style={{ width: '100%', padding: '.7rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.7rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: color + '08', border: `1px solid ${color}25`, borderRadius: '.85rem', color, cursor: 'pointer' }}>Charger plus →</button>}
    </>
  );
}

    { id: 'eph', lbl: 'Éphéméride', ico: '📅', color: '#a855f7' },
    { id: 'enigmes', lbl: 'Crack le Code', ico: '🧩', color: '#fbbf24' },
    { id: 'tdq', lbl: "T'as Dit Quoi", ico: '💬', color: '#ec4899' },
  ];
  const THEMES_ARR = ['histoire', 'science', 'nature', 'insolite', 'art', 'espace', 'sport', 'food', 'legendes'];
  const THEME_LABELS = { histoire: 'Histoire', science: 'Science', nature: 'Nature', insolite: 'Insolite', art: 'Art', espace: 'Espace', sport: 'Sport', food: 'Food', legendes: 'Légendes' };
  const THEME_COLORS = { histoire: '#d97706', science: '#00c8ff', nature: '#22c55e', insolite: '#a855f7', art: '#ec4899', espace: '#6366f1', sport: '#f97316', food: '#ef4444', legendes: '#fbbf24' };
  const PAGE_SIZE = 20;
  const [tab, setTab] = useState('anecdotes');
  const [anecdotes, setAnecdotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState(null);
  const [page, setPage] = useState(0);
  const [hideRead, setHideRead] = useState(false);
  const [readIds, setReadIds] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const user = (await sb.auth.getUser()).data?.user;
        if (user) {
          const { data } = await sb.from('reads').select('anecdote_id').eq('user_id', user.id);
          setReadIds((data || []).map(r => r.anecdote_id));
        } else { setReadIds([]); }
      } catch (e) { setReadIds([]); }
    })();
  }, []);

  useEffect(() => {
    if (tab !== 'anecdotes') return;
    (async () => {
      setLoading(true);
      try {
        let query = sb.from('anecdotes').select('id,date,theme,anecdote,icon,chooser').order('date', { ascending: false }).range(page * PAGE_SIZE, (page + 1) * PAGE_SIZE - 1);
        if (filter) query = query.ilike('theme', `%${filter}%`);
        if (hideRead && readIds && readIds.length > 0) query = query.not('id', 'in', `(${readIds.join(',')})`);
        const { data } = await query;
        setAnecdotes(prev => page === 0 ? (data || []) : [...prev, ...(data || [])]);
      } catch (e) {}
      setLoading(false);
    })();
  }, [filter, page, hideRead, readIds, tab]);

  function changeFilter(f) { setFilter(f); setPage(0); setAnecdotes([]); }
  function toggleHideRead() { setHideRead(h => !h); setPage(0); setAnecdotes([]); }

  async function openAnec(a) {
    const { data: qs } = await sb.from('questions').select('*').eq('anecdote_id', a.id);
    onOpenAnec(a, qs || []);
  }

  const themeColor = (t) => {
    if (!t) return '#00c8ff';
    const k = t.toLowerCase();
    return Object.entries(THEME_COLORS).find(([key]) => k.includes(key))?.[1] || '#00c8ff';
  };

  const currentTab = TABS.find(t => t.id === tab) || TABS[0];

  return (
    <div style={{ width: '100%' }}>
      <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '.72rem', fontFamily: 'Space Grotesk,sans-serif', marginBottom: '1rem', padding: 0, display: 'block' }}>← Retour</button>
      <div style={{ marginBottom: '1rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: '#fbbf24', textTransform: 'uppercase', marginBottom: '.3rem' }}>📚 A-RANG · ARCHIVES</div>
        <div style={{ fontSize: '1.5rem', fontWeight: 800, textTransform: 'uppercase', color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif' }}>Historique</div>
      </div>
      {/* Tab bar */}
      <div style={{ display: 'flex', gap: '.4rem', overflowX: 'auto', marginBottom: '1.25rem', paddingBottom: '.25rem', scrollbarWidth: 'none' }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flexShrink: 0, padding: '.32rem .7rem', borderRadius: '999px', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.63rem', fontWeight: 700, border: `1px solid ${tab === t.id ? t.color : 'var(--b2)'}`, background: tab === t.id ? t.color + '18' : 'transparent', color: tab === t.id ? t.color : 'var(--ink3)', cursor: 'pointer', whiteSpace: 'nowrap' }}>{t.ico} {t.lbl}</button>
        ))}
      </div>

      {/* Anecdotes tab */}
      {tab === 'anecdotes' && <>
        <div style={{ display: 'flex', gap: '.4rem', flexWrap: 'wrap', marginBottom: '1rem' }}>
          <button onClick={() => changeFilter(null)} style={{ padding: '.25rem .6rem', borderRadius: '999px', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.6rem', fontWeight: 700, border: `1px solid ${filter === null && !hideRead ? '#fbbf24' : 'var(--b2)'}`, background: filter === null && !hideRead ? 'rgba(251,191,36,.12)' : 'transparent', color: filter === null && !hideRead ? '#fbbf24' : 'var(--ink3)', cursor: 'pointer' }}>Tous</button>
          <button onClick={toggleHideRead} style={{ padding: '.25rem .6rem', borderRadius: '999px', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.6rem', fontWeight: 700, border: `1px solid ${hideRead ? '#34d399' : 'var(--b2)'}`, background: hideRead ? 'rgba(52,211,153,.12)' : 'transparent', color: hideRead ? '#34d399' : 'var(--ink3)', cursor: 'pointer' }}>👁 Non lues</button>
          {THEMES_ARR.map(t => <button key={t} onClick={() => changeFilter(THEME_LABELS[t])} style={{ padding: '.25rem .6rem', borderRadius: '999px', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.6rem', fontWeight: 700, border: `1px solid ${filter === THEME_LABELS[t] ? THEME_COLORS[t] : 'var(--b2)'}`, background: filter === THEME_LABELS[t] ? THEME_COLORS[t] + '18' : 'transparent', color: filter === THEME_LABELS[t] ? THEME_COLORS[t] : 'var(--ink3)', cursor: 'pointer' }}>{THEME_LABELS[t]}</button>)}
        </div>
        {loading && !anecdotes.length ? <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Chargement…</div> :
         !anecdotes.length ? <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--ink3)', fontSize: '.78rem' }}>Aucune anecdote trouvée.</div> : <>
          <div style={{ display: 'flex', flexDirection: 'column', gap: '.6rem', marginBottom: '1rem' }}>
            {anecdotes.map(a => { const tc = themeColor(a.theme); return (
              <div key={a.id} onClick={() => openAnec(a)} style={{ background: `color-mix(in srgb,${tc} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${tc} 22%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem', cursor: 'pointer', transition: 'transform .15s' }} onMouseOver={e => e.currentTarget.style.transform = 'translateY(-2px)'} onMouseOut={e => e.currentTarget.style.transform = ''}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem', marginBottom: '.4rem' }}>
                  <span style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.1em', color: tc, background: tc + '18', border: `1px solid ${tc}30`, borderRadius: '999px', padding: '.12rem .45rem', textTransform: 'uppercase' }}>{a.icon || '💡'} {a.theme || 'Anecdote'}</span>
                  <span style={{ fontSize: '.58rem', color: 'var(--ink3)', marginLeft: 'auto' }}>{a.date}</span>
                </div>
                <div style={{ fontSize: '.8rem', color: 'var(--ink)', lineHeight: 1.6, display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{a.anecdote}</div>
              </div>);
            })}
          </div>
          {!loading && anecdotes.length === (page + 1) * PAGE_SIZE && <button onClick={() => setPage(p => p + 1)} style={{ width: '100%', padding: '.75rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(251,191,36,.06)', border: '1px solid rgba(251,191,36,.2)', borderRadius: '.85rem', color: '#fbbf24', cursor: 'pointer' }}>Charger plus →</button>}
        </>}
      </>}

      {/* Mais Dis Moi tab */}
      {tab === 'mdm' && <ArchiveTabContent key="mdm" table="mais_dis_moi" fields="id,date,title,explanation,category,fun_fact" sortCol="date" color="#34d399" renderCard={(item, i, color) => (
        <div key={item.id || i} style={{ background: `color-mix(in srgb,${color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${color} 22%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.35rem' }}>
            <span style={{ fontSize: '.58rem', fontWeight: 700, color, background: color + '18', borderRadius: '999px', padding: '.12rem .45rem', border: `1px solid ${color}30` }}>🔍 {item.category || 'Comment ça marche ?'}</span>
            <span style={{ fontSize: '.58rem', color: 'var(--ink3)' }}>{item.date}</span>
          </div>
          <div style={{ fontSize: '.88rem', fontWeight: 700, color: 'var(--ink)', marginBottom: '.35rem', lineHeight: 1.4 }}>{item.title}</div>
          <div style={{ fontSize: '.75rem', color: 'var(--ink3)', lineHeight: 1.6, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{item.explanation}</div>
        </div>
      )} />}

      {/* Éphéméride tab */}
      {tab === 'eph' && <ArchiveTabContent key="eph" table="ephemerides" fields="id,date,day_month,events" sortCol="date" color="#a855f7" renderCard={(item, i, color) => {
        const evts = Array.isArray(item.events) ? item.events : [];
        return (
          <div key={item.id || i} style={{ background: `color-mix(in srgb,${color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${color} 22%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.5rem' }}>
              <span style={{ fontSize: '.62rem', fontWeight: 700, color }}>{item.day_month || item.date}</span>
              <span style={{ fontSize: '.58rem', color: 'var(--ink3)' }}>{evts.length} événement{evts.length > 1 ? 's' : ''}</span>
            </div>
            {evts.slice(0, 2).map((e, j) => (
              <div key={j} style={{ marginBottom: '.35rem' }}>
                <span style={{ fontSize: '.65rem', fontWeight: 700, color, marginRight: '.4rem' }}>{e.year}</span>
                <span style={{ fontSize: '.75rem', color: 'var(--ink)', fontWeight: 600 }}>{e.title}</span>
              </div>
            ))}
          </div>
        );
      }} />}

      {/* Crack le Code tab */}
      {tab === 'enigmes' && <ArchiveTabContent key="enigmes" table="daily_enigmas" fields="id,date,category,question,answer,difficulty,explanation" sortCol="date" color="#fbbf24" renderCard={(item, i, color) => {
        const [open, setOpen] = React.useState(false);
        const diffColor = { easy: '#34d399', medium: '#fbbf24', hard: '#ef4444' }[item.difficulty] || '#fbbf24';
        return (
          <div key={item.id || i} style={{ background: `color-mix(in srgb,${color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${color} 22%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.35rem' }}>
              <span style={{ fontSize: '.58rem', fontWeight: 700, color, background: color + '18', borderRadius: '999px', padding: '.12rem .45rem', border: `1px solid ${color}30` }}>🧩 {item.category}</span>
              <div style={{ display: 'flex', gap: '.4rem', alignItems: 'center' }}>
                <span style={{ fontSize: '.55rem', fontWeight: 700, color: diffColor }}>{item.difficulty}</span>
                <span style={{ fontSize: '.58rem', color: 'var(--ink3)' }}>{item.date}</span>
              </div>
            </div>
            <div style={{ fontSize: '.8rem', color: 'var(--ink)', lineHeight: 1.55, marginBottom: '.5rem' }}>{item.question}</div>
            <button onClick={() => setOpen(o => !o)} style={{ fontSize: '.65rem', fontWeight: 700, color, background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>{open ? '▼ Masquer la réponse' : '▶ Voir la réponse'}</button>
            {open && <div style={{ marginTop: '.4rem', padding: '.5rem .75rem', background: color + '10', border: `1px solid ${color}25`, borderRadius: '.65rem', fontSize: '.78rem', color: 'var(--ink2)' }}>✓ {item.answer}</div>}
          </div>
        );
      }} />}

      {/* T'as Dit Quoi tab */}
      {tab === 'tdq' && <ArchiveTabContent key="tdq" table="tas_dit_quoi" fields="id,date,word,category,explanation,origin,wrong_usage,correct_usage" sortCol="date" color="#ec4899" renderCard={(item, i, color) => {
        const [open, setOpen] = React.useState(false);
        return (
          <div key={item.id || i} style={{ background: `color-mix(in srgb,${color} 6%,var(--bg))`, border: `1px solid color-mix(in srgb,${color} 22%,transparent)`, borderRadius: '1rem', padding: '.85rem 1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.4rem' }}>
              <span style={{ fontSize: '.58rem', fontWeight: 700, color, background: color + '18', borderRadius: '999px', padding: '.12rem .45rem', border: `1px solid ${color}30` }}>💬 {item.category}</span>
              <span style={{ fontSize: '.58rem', color: 'var(--ink3)' }}>{item.date}</span>
            </div>
            <div style={{ fontSize: '1.15rem', fontWeight: 800, color, letterSpacing: '.04em', marginBottom: '.35rem' }}>{item.word}</div>
            <div style={{ fontSize: '.75rem', color: 'var(--ink3)', lineHeight: 1.6, display: open ? 'block' : '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: open ? 'visible' : 'hidden' }}>{item.explanation}</div>
            {item.wrong_usage && <button onClick={() => setOpen(o => !o)} style={{ fontSize: '.65rem', fontWeight: 700, color, background: 'none', border: 'none', cursor: 'pointer', padding: '0', marginTop: '.35rem' }}>{open ? '▼ Réduire' : '▶ Voir usage'}</button>}
            {open && item.wrong_usage && <div style={{ marginTop: '.5rem', display: 'flex', flexDirection: 'column', gap: '.3rem' }}>
              <div style={{ fontSize: '.72rem', color: '#f87171' }}>✗ {item.wrong_usage}</div>
              <div style={{ fontSize: '.72rem', color: '#34d399' }}>✓ {item.correct_usage}</div>
            </div>}
          </div>
        );
      }} />}
    </div>
  );
}

// ── BOSS DE RANG ──
function ScreenBoss({ onBack }) {
  const PASS_THRESHOLD = 14;
  const TOTAL_Q = 20;
  const DIFF = (i) => i < 7 ? { lbl: 'FACILE', color: '#34d399' } : i < 14 ? { lbl: 'MOYEN', color: '#fbbf24' } : { lbl: 'DIFFICILE', color: '#ef4444' };
  const [phase, setPhase] = useState('intro');
  const [questions, setQuestions] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [timeLeft, setTimeLeft] = useState(15);
  const timerRef = useRef(null);

  async function startBoss() {
    setPhase('loading');
    let qs = [];
    try {
      const { data } = await sb.from('questions').select('*').limit(100);
      if (data && data.length >= 10) qs = [...data].sort(() => Math.random() - .5).slice(0, TOTAL_Q).map(q => ({ question: q.question, answers: q.options, correctIdx: q.answer, explanation: q.explanation || '' }));
    } catch (e) {}
    if (!qs.length) {
      const pool = [...FALLBACK_VS100];
      while (qs.length < TOTAL_Q) qs = [...qs, ...pool.sort(() => Math.random() - .5)];
      qs = qs.slice(0, TOTAL_Q);
    }
    setQuestions(qs); setQIdx(0); setScore(0); setSelected(null); setAnswered(false);
    setPhase('question'); startTimer();
  }

  function startTimer() {
    clearInterval(timerRef.current);
    setTimeLeft(15);
    let t = 15;
    timerRef.current = setInterval(() => {
      t--; setTimeLeft(t);
      if (t <= 0) { clearInterval(timerRef.current); handleAutoFail(); }
    }, 1000);
  }

  function handleAutoFail() {
    setSelected(-1); setAnswered(true);
    setTimeout(() => nextQ(false), 1000);
  }

  function handleAnswer(i) {
    if (answered) return;
    clearInterval(timerRef.current);
    const ok = i === questions[qIdx].correctIdx;
    setSelected(i); setAnswered(true);
    if (ok) setScore(s => s + 1);
    setTimeout(() => nextQ(ok), 900);
  }

  function nextQ(ok) {
    const next = qIdx + 1;
    if (next >= TOTAL_Q) { setPhase('result'); return; }
    setQIdx(next); setSelected(null); setAnswered(false);
    startTimer();
  }

  useEffect(() => () => clearInterval(timerRef.current), []);

  const q = questions[qIdx];
  const passed = score >= PASS_THRESHOLD;

  if (phase === 'intro') return (
    <div style={{ width: '100%', textAlign: 'center', paddingTop: '1.5rem' }}>
      <div style={{ fontSize: '.55rem', fontWeight: 800, letterSpacing: '.2em', color: '#ef4444', textTransform: 'uppercase', marginBottom: '.5rem', border: '1px solid rgba(239,68,68,.3)', display: 'inline-block', padding: '.2rem .6rem', borderRadius: '4px' }}>BOSS DE RANG</div>
      <div style={{ fontSize: '3.5rem', margin: '1rem 0', animation: 'sl-pulse 1.5s ease-in-out infinite' }}>⚔️</div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '1rem', marginBottom: '1.25rem' }}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '2.5rem', fontWeight: 900, color: rank.color }}>{rank.label}</div>
          <div style={{ fontSize: '.6rem', color: 'var(--ink3)', textTransform: 'uppercase' }}>{rank.title}</div>
        </div>
        <div style={{ fontSize: '1.5rem', color: 'var(--ink3)' }}>→</div>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '2.5rem', fontWeight: 900, color: nextRank?.color || '#fbbf24' }}>{nextRank?.label || '?'}</div>
          <div style={{ fontSize: '.6rem', color: 'var(--ink3)', textTransform: 'uppercase' }}>{nextRank?.title || 'Suivant'}</div>
        </div>
      </div>
      <div style={{ background: 'rgba(239,68,68,.06)', border: '1px solid rgba(239,68,68,.18)', borderRadius: '1rem', padding: '1rem', marginBottom: '1.25rem', textAlign: 'left' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '.5rem', textAlign: 'center' }}>
          {[['20', 'Questions'], ['15s', 'Par question'], ['14/20', 'Pour passer']].map(([v, l]) => (
            <div key={l} style={{ background: 'rgba(239,68,68,.08)', borderRadius: '.75rem', padding: '.65rem .5rem' }}>
              <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.2rem', fontWeight: 800, color: '#ef4444' }}>{v}</div>
              <div style={{ fontSize: '.6rem', color: 'var(--ink3)', marginTop: '.1rem' }}>{l}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{ fontSize: '.72rem', color: 'rgba(239,68,68,.7)', marginBottom: '1.5rem' }}>⚠ Échec = XP du rang remis à zéro</div>
      <button onClick={startBoss} style={{ width: '100%', padding: '1rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.82rem', fontWeight: 700, letterSpacing: '.12em', textTransform: 'uppercase', background: '#ef4444', color: 'var(--ink)', border: 'none', borderRadius: '.85rem', cursor: 'pointer', boxShadow: '0 4px 24px rgba(239,68,68,.35)' }}>⚔️ Affronter le Boss</button>
      <button onClick={onBack} style={{ marginTop: '.75rem', background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '.72rem', fontFamily: 'Space Grotesk,sans-serif', width: '100%' }}>← Retraite stratégique</button>
    </div>
  );

  if (phase === 'loading') return (
    <div style={{ width: '100%', minHeight: '60vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1rem' }}>
      <div style={{ fontSize: '2rem', animation: 'sl-pulse 1s ease-in-out infinite' }}>⚔️</div>
      <div style={{ fontSize: '.78rem', color: 'var(--ink3)' }}>Invocation du Boss…</div>
    </div>
  );

  if (phase === 'question' && q) {
    const diff = DIFF(qIdx);
    const prog = Math.round(qIdx / TOTAL_Q * 100);
    return (
      <div style={{ width: '100%' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '.85rem' }}>
          <span style={{ fontSize: '.6rem', fontWeight: 700, color: diff.color, background: diff.color + '18', border: `1px solid ${diff.color}40`, borderRadius: '999px', padding: '.2rem .6rem', letterSpacing: '.08em' }}>{diff.lbl}</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem' }}>
            <span style={{ fontSize: '.62rem', color: 'var(--ink3)' }}>{qIdx + 1}/{TOTAL_Q}</span>
            <span style={{ fontFamily: 'monospace', fontSize: '1.3rem', fontWeight: 900, color: timeLeft <= 5 ? '#f87171' : '#ef4444' }}>{String(timeLeft).padStart(2, '0')}</span>
          </div>
        </div>
        <div style={{ height: '4px', background: 'rgba(239,68,68,.15)', borderRadius: '2px', marginBottom: '1rem', overflow: 'hidden' }}>
          <div style={{ height: '100%', width: prog + '%', background: '#ef4444', borderRadius: '2px', transition: 'width .4s' }} />
        </div>
        <div style={{ display: 'flex', gap: '.5rem', marginBottom: '1rem' }}>
          {Array.from({ length: qIdx }).map((_, i) => <div key={i} style={{ flex: 1, height: '4px', borderRadius: '2px', background: i < score ? '#34d399' : '#f87171' }} />)}
          {Array.from({ length: TOTAL_Q - qIdx }).map((_, i) => <div key={i} style={{ flex: 1, height: '4px', borderRadius: '2px', background: 'rgba(255,255,255,.08)' }} />)}
        </div>
        <div style={{ fontSize: '.96rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.6, marginBottom: '1.25rem', padding: '.9rem 1rem', background: 'rgba(239,68,68,.04)', border: '1px solid rgba(239,68,68,.14)', borderRadius: '1rem' }}>{q.question}</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.55rem' }}>
          {(q.answers || []).map((ans, i) => {
            const isCorrect = i === q.correctIdx, isSel = i === selected;
            let bg = 'var(--s1)', bdr = 'var(--b1)', clr = 'var(--ink2)';
            if (answered && isCorrect) { bg = 'rgba(52,211,153,.12)'; bdr = '#34d399'; clr = '#34d399'; }
            else if (answered && isSel) { bg = 'rgba(248,113,113,.12)'; bdr = '#f87171'; clr = '#f87171'; }
            return (
              <button key={i} onClick={() => handleAnswer(i)} disabled={answered}

      {passed ? (
        <div style={{ background: 'rgba(251,191,36,.06)', border: '1px solid rgba(251,191,36,.2)', borderRadius: '1rem', padding: '1.5rem', marginBottom: '1.25rem' }}>

      <div style={{ display: 'flex', gap: '.6rem' }}>
        {!passed && <button onClick={() => { setPhase('intro'); setScore(0); }} style={{ flex: 1, padding: '.8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(239,68,68,.1)', border: '1px solid rgba(239,68,68,.3)', borderRadius: '.85rem', color: '#ef4444', cursor: 'pointer' }}>Réessayer</button>}
        <button onClick={onBack} style={{ flex: 1, padding: '.8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: 'rgba(255,255,255,.04)', border: '1px solid var(--b1)', borderRadius: '.85rem', color: 'var(--ink2)', cursor: 'pointer' }}>← Hub</button>
      </div>
    </div>
  );

  return null;
}
