<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>La Curiosphère</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#07090f;--s0:#0d0f1c;--s1:#101320;--s2:#141728;
  --b1:rgba(255,255,255,.055);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.20);
  --ink:#eef0f4;--ink2:#94a3b8;--ink3:#475569;
  --a:#00c8ff;--a2:#0099cc;--adim:rgba(0,200,255,.08);--aglow:rgba(0,200,255,.20);
  --gr:#34d399;--re:#f87171;--bl:#818cf8;--cr:.5rem;
  --hero-base:#0c0c18;
}
[data-theme="light"]{
  --bg:#f0f3fa;--s0:#ffffff;--s1:#f8f9fd;--s2:#eef1f8;
  --b1:rgba(0,0,0,.07);--b2:rgba(0,0,0,.12);--b3:rgba(0,0,0,.20);
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;
  --hero-base:#eef1f8;
  --a:#0088bb;--a2:#006d99;--adim:rgba(0,136,187,.08);--aglow:rgba(0,136,187,.20);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;}
/* Grid lines bg */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--b1) 1px,transparent 1px),linear-gradient(90deg,var(--b1) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 100%);}
/* Aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora::before{content:'';position:absolute;width:700px;height:500px;top:-200px;left:-150px;background:radial-gradient(ellipse,rgba(0,200,255,.22),transparent 65%);filter:blur(60px);opacity:.35;animation:afloat 24s ease-in-out infinite alternate;}
.aurora::after{content:'';position:absolute;width:500px;height:400px;bottom:-100px;right:-100px;background:radial-gradient(ellipse,rgba(0,150,255,.15),transparent 65%);filter:blur(80px);opacity:.5;animation:afloat 32s ease-in-out infinite alternate-reverse;}
@keyframes afloat{0%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,30px) scale(1.05);}100%{transform:translate(-20px,15px) scale(.97);}}
[data-theme="light"] .aurora::before{opacity:.08;}
[data-theme="light"] .aurora::after{opacity:.1;}
[data-theme="light"] header{background:rgba(240,243,250,.92);}
[data-theme="light"] .bottom-nav{background:rgba(240,243,250,.96);}
/* Hunter card */
[data-theme="light"] .sl-hunter-card{background:linear-gradient(135deg,#e8ecf8,#eef1fc);}
[data-theme="light"] .sl-hunter-label{color:var(--ink3);}
[data-theme="light"] .sl-hunter-name{color:var(--ink);}
[data-theme="light"] .sl-hunter-streak{color:var(--ink3);}
[data-theme="light"] .sl-missions-left{color:var(--ink3);}
[data-theme="light"] .sl-xp-track{background:rgba(0,0,0,.08);}
/* Daily gates */
[data-theme="light"] .sl-gate{background:linear-gradient(135deg,color-mix(in srgb,var(--gc,#000) 10%,#f0f3fa),#f0f3fa);}
[data-theme="light"] .sl-gate-name{color:var(--ink);}
[data-theme="light"] .sl-gate-desc{color:var(--ink3);}
[data-theme="light"] .sl-gate-xp{color:var(--ink3);}
/* Arena */
[data-theme="light"] .sl-arena-gate{background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(239,68,68,.02));}
[data-theme="light"] .sl-arena-name{color:var(--ink);}
[data-theme="light"] .sl-arena-desc{color:var(--ink3);}
/* Locked gates */
[data-theme="light"] .sl-locked-gate{background:color-mix(in srgb,var(--gc,#000) 6%,#f0f3fa);}
[data-theme="light"] .sl-locked-name{color:var(--ink3);}
/* Header */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.5rem;justify-content:space-between;padding:0 1.5rem;height:52px;background:rgba(7,9,15,.9);border-bottom:1px solid rgba(0,200,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.logo{display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;flex-shrink:0;}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--a);position:relative;flex-shrink:0;}
.logo-dot::before,.logo-dot::after{content:'';position:absolute;top:50%;left:50%;border-radius:50%;background:transparent;border:2px solid var(--a);transform:translate(-50%,-50%) scale(1);animation:dot-wave 2.2s ease-out infinite;}
.logo-dot::after{animation-delay:1.1s;}
@keyframes dot-wave{0%{width:7px;height:7px;opacity:1}100%{width:28px;height:28px;opacity:0;}}
.logo-brand{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap;}
/* ── TOP TABS ── */
.top-tabs{display:flex;align-items:center;gap:0;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;}
.top-tabs::-webkit-scrollbar{display:none}
.top-tab{display:inline-flex;align-items:center;gap:.45rem;padding:.28rem .7rem;background:none;border:none;color:var(--ink3);font-family:'Space Grotesk',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;transition:color .18s;white-space:nowrap;}
.top-tab:hover{color:var(--ink2);}
.top-tab.active{color:var(--ink);}
.top-tab em{font-style:normal;color:var(--ink2);}
.top-tab.active em{color:var(--ink);}
.tab-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--a);flex-shrink:0;}
.tab-sep{width:1px;height:12px;background:var(--b2);flex-shrink:0;margin:0 .1rem;}
.tab-wip-badge{font-size:.45rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#f97316;color:var(--ink);border-radius:999px;padding:2px 6px;}
/* ── HEADER RIGHT ── */
.h-right{display:flex;align-items:center;gap:.65rem;flex-shrink:0;}
.date-tag{font-size:.65rem;font-weight:500;color:var(--ink3);letter-spacing:.06em;white-space:nowrap;}
.streak-badge{display:flex;align-items:center;gap:.3rem;background:rgba(255,140,0,.1);border:1px solid rgba(249,115,22,.25);border-radius:2rem;padding:.22rem .65rem;font-size:.68rem;font-weight:700;color:#f97316;cursor:pointer;transition:all .2s;}
.av-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--a);background:var(--adim);cursor:pointer;font-size:.68rem;font-weight:700;color:var(--a);display:flex;align-items:center;justify-content:center;transition:all .22s;}
.av-btn:hover{background:var(--a);color:#000;}
/* Mobile header */
@media(max-width:768px){
  header{flex-wrap:wrap;height:auto;min-height:48px;padding:.4rem .9rem .3rem;gap:.2rem;}
  .logo{flex:1;min-width:0;}
  .top-tabs{order:10;flex:0 0 100%;width:100%;border-top:1px solid var(--b1);padding:.3rem 0 .15rem;justify-content:flex-start;gap:.15rem;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .top-tab{flex-shrink:0;padding:.4rem .7rem;font-size:.66rem;scroll-snap-align:start;}
  .tab-sep{display:none;}
  .date-tag{display:none;}
}
/* Main + screens */
main{position:relative;z-index:10;min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;padding:0 1rem 6rem;}
.screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:640px;padding-top:2rem;}
.screen.on{display:flex;animation:sfade .4s cubic-bezier(.16,1,.3,1) forwards;}
.hub-screen{max-width:100%;padding:1.5rem 0 2rem;}
@keyframes sfade{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
/* SL HUB */
.sl-hub{width:100%;}
.sl-system-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0 1rem;}
.sl-system-label{font-family:'Space Grotesk',monospace;font-size:.65rem;font-weight:700;letter-spacing:.2em;color:var(--a);text-transform:uppercase;}
.sl-system-date{font-size:.62rem;color:var(--ink3);letter-spacing:.08em;}
.sl-hub-cols{display:flex;flex-direction:column;gap:1.25rem;}
/* Hunter card */
.sl-hunter-card{background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid;border-radius:1rem;padding:1.1rem;margin-bottom:1.25rem;position:relative;overflow:hidden;}
.sl-hunter-card::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;}
.sl-hunter-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.9rem;}
.sl-hunter-label{font-size:.55rem;font-weight:700;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;margin-bottom:.2rem;}
.sl-hunter-name{font-size:1.35rem;font-weight:600;color:var(--ink);}
.sl-rank-badge{display:flex;flex-direction:column;align-items:center;border:2px solid;border-radius:.6rem;padding:.35rem .65rem;min-width:56px;}
.sl-rank-id{font-family:'Space Grotesk',monospace;font-size:1.3rem;font-weight:900;line-height:1;}
.sl-rank-title{font-size:.5rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-top:.1rem;}
.sl-xp-section{margin-bottom:.75rem;}
.sl-xp-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;}
.sl-xp-label{font-family:'Space Grotesk',monospace;font-size:.55rem;font-weight:700;letter-spacing:.15em;color:var(--ink3);text-transform:uppercase;}
.sl-xp-val{font-family:'Space Grotesk',monospace;font-size:.85rem;font-weight:700;}
.sl-xp-next{font-size:.62rem;color:var(--ink3);margin-left:auto;}
.sl-xp-track{height:6px;background:var(--b1);border-radius:10px;overflow:hidden;}
.sl-xp-fill{height:100%;border-radius:10px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.sl-hunter-streak{display:flex;align-items:center;gap:.5rem;font-size:.72rem;color:var(--ink);}
.sl-missions-left{margin-left:auto;font-size:.62rem;color:var(--ink3);}
.sl-missions-done{margin-left:auto;font-size:.62rem;font-weight:700;color:var(--gr);letter-spacing:.06em;}
.sl-stats-btn{background:none;border:1px solid rgba(52,211,153,.35);color:var(--gr);font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.28rem .7rem;border-radius:.3rem;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem;margin-top:.5rem;transition:all .2s;}
.sl-stats-btn:hover{background:rgba(52,211,153,.1);border-color:var(--gr);}
/* Section header */
.sl-section-header{display:flex;align-items:center;gap:.5rem;margin:0 0 .65rem;padding-bottom:.5rem;border-bottom:1px solid var(--b1);}
.sl-sh-icon{font-size:.9rem;}
.sl-sh-title{font-family:'Space Grotesk',monospace;font-size:.6rem;font-weight:700;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;flex:1;}
.sl-sh-badge{font-family:'Space Grotesk',monospace;font-size:.6rem;font-weight:700;color:var(--ink3);letter-spacing:.1em;}
.sl-sh-new{font-size:.55rem;font-weight:800;letter-spacing:.12em;padding:.2rem .5rem;border-radius:20px;background:rgba(168,85,247,.15);color:#a855f7;border:1px solid rgba(168,85,247,.3);text-transform:uppercase;}
.sl-section-locked .sl-sh-title,.sl-section-locked .sl-sh-icon{opacity:.5;}
/* Arena gate */
.sl-arena-gate{background:linear-gradient(135deg,rgba(239,68,68,.08),rgba(239,68,68,.03));border:1px solid rgba(239,68,68,.3);border-radius:1rem;padding:1rem 1.1rem;cursor:pointer;transition:transform .18s,box-shadow .18s;margin-bottom:1.5rem;}
.sl-arena-gate:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(239,68,68,.25);}
.sl-arena-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem;}
.sl-arena-tag{font-size:.55rem;font-weight:800;letter-spacing:.15em;color:#ef4444;border:1px solid #ef4444;padding:.15rem .45rem;border-radius:4px;text-transform:uppercase;}
.sl-arena-xp{font-size:.7rem;font-weight:700;color:var(--gr);}
.sl-arena-bd{display:flex;align-items:center;gap:.85rem;margin-bottom:.75rem;}
.sl-arena-ico{font-size:1.8rem;line-height:1;}
.sl-arena-name{font-size:1.15rem;font-weight:600;color:var(--ink);}
.sl-arena-desc{font-size:.72rem;color:var(--ink2);margin-top:.15rem;}
.sl-arena-enter{font-size:.65rem;font-weight:700;letter-spacing:.1em;color:#ef4444;text-align:right;text-transform:uppercase;}
/* Daily gates */
.sl-gates{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.25rem;}
.sl-gate{background:linear-gradient(135deg,color-mix(in srgb,var(--gc,#ffffff) 8%,var(--bg)),var(--bg));border:1px solid color-mix(in srgb,var(--gc,#ffffff) 28%,transparent);border-radius:1rem;padding:.9rem 1rem;cursor:pointer;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden;}
.sl-gate::before{content:'';position:absolute;inset:0;background:var(--gc,transparent);opacity:0;transition:opacity .2s;pointer-events:none;}
.sl-gate:hover{transform:translateY(-2px);box-shadow:0 8px 24px color-mix(in srgb,var(--gc,#ffffff) 20%,transparent);}
.sl-gate:hover::before{opacity:.04;}
.sl-gate-done{opacity:.5;cursor:default;}
.sl-gate-done:hover{transform:none;box-shadow:none;}
.sl-gate-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;}
.sl-gate-rank{font-family:'Space Grotesk',monospace;font-size:.55rem;font-weight:700;letter-spacing:.15em;border:1px solid;border-radius:4px;padding:.1rem .35rem;text-transform:uppercase;}
.sl-gate-xp{font-family:'Space Grotesk',monospace;font-size:.6rem;color:var(--ink3);letter-spacing:.08em;}
.sl-gate-bd{display:flex;align-items:center;gap:.75rem;margin-bottom:.6rem;}
.sl-gate-ico{font-size:1.5rem;width:2rem;text-align:center;}
.sl-gate-name{font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:.15rem;}
.sl-gate-desc{font-size:.7rem;color:var(--ink3);}
.sl-gate-action{text-align:right;}
.sl-gate-enter{font-family:'Space Grotesk',monospace;font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;animation:ptxt 2s ease-in-out infinite;}
.sl-gate-done-badge{font-family:'Space Grotesk',monospace;font-size:.62rem;font-weight:700;color:var(--gr);letter-spacing:.1em;}
@keyframes ptxt{0%,100%{opacity:1;}50%{opacity:.5;}}
/* Locked */
.sl-locked-gates{display:flex;flex-direction:column;gap:.45rem;}
.sl-locked-gate{display:flex;align-items:center;gap:.6rem;background:color-mix(in srgb,var(--gc,#ffffff) 5%,var(--bg));border:1px solid color-mix(in srgb,var(--gc,#ffffff) 18%,transparent);border-radius:.65rem;padding:.65rem .85rem;opacity:.5;}
.sl-locked-ico{font-size:1rem;width:1.5rem;text-align:center;}
.sl-locked-name{font-size:.78rem;color:var(--ink2);flex:1;}
.sl-locked-rank{font-family:'Space Grotesk',monospace;font-size:.6rem;font-weight:700;letter-spacing:.1em;}
/* Anecdote screen */
.anec-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--b1);width:100%;}
.anec-theme-chip{display:inline-flex;align-items:center;gap:.5rem;font-size:.6rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--a);background:var(--adim);border:1px solid rgba(255,255,255,.08);padding:.22rem .75rem;border-radius:3px;}
.anec-theme-chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--a);box-shadow:0 0 6px var(--aglow);}
.jour-badge{font-size:.58rem;font-weight:500;color:var(--ink3);letter-spacing:.08em;padding:.22rem .65rem;border:1px solid var(--b1);border-radius:3px;}
.anec-chooser{text-align:right;}
.anec-chooser-lbl{font-size:.56rem;font-weight:500;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;}
.anec-chooser-name{font-size:.78rem;font-weight:600;color:var(--ink2);margin-top:.1rem;}
.anec-card{background:linear-gradient(135deg,color-mix(in srgb,var(--a) 6%,var(--bg)),var(--bg));border:1px solid color-mix(in srgb,var(--a) 28%,transparent);padding:2rem 2.25rem;margin-bottom:1.75rem;position:relative;overflow:hidden;border-radius:1rem;width:100%;transition:box-shadow .2s;}
.anec-card::after{content:attr(data-num);position:absolute;bottom:-.5rem;right:1.5rem;font-size:8rem;line-height:1;font-style:italic;color:var(--ink);opacity:.03;user-select:none;pointer-events:none;}
.anec-glow{position:absolute;top:-40px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,var(--adim),transparent 60%);pointer-events:none;}
.anec-body{font-size:clamp(.95rem,2vw,1.08rem);font-weight:400;line-height:1.9;color:var(--ink);position:relative;z-index:1;}
/* Contexte */
.ctx{background:var(--s1);border:1px solid var(--b1);border-radius:var(--cr);overflow:hidden;margin-bottom:1.25rem;width:100%;}
.ctx-tog{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;background:none;border:none;width:100%;color:inherit;transition:background .15s;}
.ctx-tog:hover{background:var(--b1);}
.ctx-l{display:flex;align-items:center;gap:.65rem;}
.ctx-ico{font-size:.9rem;}
.ctx-title{font-size:.74rem;font-weight:600;color:var(--ink2);}
.ctx-arr{font-size:.6rem;color:var(--ink3);transition:transform .22s;}
.ctx-arr.open{transform:rotate(180deg);}
.ctx-body{padding:0 1.25rem 1rem;font-size:.78rem;line-height:1.65;color:var(--ink2);}
.ctx-src{margin-top:.75rem;font-size:.6rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);}
/* Buttons & actions */
.anec-actions{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:1.25rem;width:100%;}
.btn-share{display:inline-flex;align-items:center;gap:.5rem;padding:0 1rem;height:2.2rem;background:none;border:1px solid var(--b2);border-radius:var(--cr);color:var(--ink3);font-family:'Space Grotesk',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .22s;}
.btn-share:hover{border-color:var(--a);color:var(--a);}
.btn-share.on{border-color:var(--a);color:var(--a);background:var(--adim);}
/* Join bar */
.join-bar{width:100%;background:linear-gradient(135deg,var(--s0),var(--s1));border:1px solid var(--b2);padding:.85rem 1.25rem;display:flex;align-items:center;gap:1.1rem;position:relative;overflow:hidden;border-radius:1rem;margin-bottom:1.5rem;}
.join-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--a),transparent 55%);opacity:.5;}
.join-ico{font-size:1.5rem;flex-shrink:0;opacity:.7;}
.join-txt{flex:1;font-size:.76rem;color:var(--ink3);line-height:1.6;}
.join-txt strong{color:var(--ink2);display:block;font-size:.8rem;font-weight:600;margin-bottom:.15rem;}
.btn-join{flex-shrink:0;padding:.4rem 1rem;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--a);border:1px solid var(--a);cursor:pointer;transition:all .22s;border-radius:3px;}
.btn-join:hover{background:var(--a);color:#000;}
/* Anec footer */
.anec-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;width:100%;}
.anec-note{font-size:.74rem;color:var(--ink3);line-height:1.7;flex:1;padding-left:.85rem;border-left:1px solid var(--b1);font-style:italic;}
.cd-block{flex-shrink:0;text-align:right;}
.cd-label{font-size:.56rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:.4rem;}
.cd-time{font-size:1.25rem;font-weight:700;color:var(--ink);letter-spacing:.12em;font-variant-numeric:tabular-nums;background:var(--s2);border:1px solid var(--b1);padding:.35rem .7rem;}
/* Profile */
.prof-hero-card{width:100%;display:flex;align-items:center;gap:1rem;padding:1.1rem 1.25rem;background:var(--s1);border:1px solid var(--b1);border-radius:var(--cr);position:relative;overflow:hidden;margin-bottom:.85rem;}
.prof-hero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--a),transparent 65%);}

    if (!email.trim() || !pass) { setErr('Email et mot de passe requis'); return; }
    setLoading(true); setErr('');
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé, vérifie ta connexion et réessaie')), ms))]);
    try {
      const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass }), 15000);
      if (error) throw error;
      const { data: prof } = await withTimeout(sb.from('profiles').select('role').eq('id', data.user.id).maybeSingle(), 15000);
      if (!prof || !ALLOWED_ROLES.includes(prof.role)) {
        await sb.auth.signOut();
        setErr("Accès refusé : ton compte n'a pas encore l'accès bêta. L'équipe l'activera bientôt.");
        setLoading(false);
        return;
      }
      onAuth(data.user);
    } catch (e) { setErr(e.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : e.message); }
    setLoading(false);
  }

  async function handleOAuth(provider) {
    setLoading(true); setErr('');
    try {
      await sb.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.href } });
    } catch (e) { setErr(e.message); setLoading(false); }
  }

  if (done) return (
    <div style={{ position: 'fixed', inset: 0, background: 'var(--bg)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1rem', padding: '2rem', textAlign: 'center' }}>
      <div style={{ fontSize: '2.5rem' }}>✉️</div>
      <div style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--ink)' }}>Compte créé !</div>
      <div style={{ fontSize: '.82rem', color: 'var(--ink3)', lineHeight: 1.65, maxWidth: 320 }}>Vérifie ton email pour confirmer ton compte. Ton accès bêta sera activé par l'équipe, on te préviendra. Reviens ensuite te connecter.</div>
      <button onClick={() => { setDone(false); setAuthTab('login'); }} style={{ padding: '.6rem 1.5rem', background: 'var(--adim)', border: '1px solid var(--a)', borderRadius: '.75rem', color: 'var(--a)', fontFamily: 'Space Grotesk,sans-serif', fontWeight: 700, fontSize: '.78rem', cursor: 'pointer' }}>→ Se connecter</button>
    </div>
  );

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'var(--bg)', display: 'flex', flexDirection: 'column', zIndex: 200 }}>
      {/* Background grid */}
      <div style={{ position: 'absolute', inset: 0, backgroundImage: 'linear-gradient(var(--b1) 1px,transparent 1px),linear-gradient(90deg,var(--b1) 1px,transparent 1px)', backgroundSize: '56px 56px', maskImage: 'radial-gradient(ellipse 70% 70% at 50% 40%, #000 30%, transparent 100%)', pointerEvents: 'none' }} />
      {/* Aurora */}
      <div style={{ position: 'absolute', top: '-15%', left: '-10%', width: 500, height: 500, background: `radial-gradient(circle, ${isSlide ? sl.color + '18' : 'rgba(0,200,255,.12)'}, transparent 60%)`, pointerEvents: 'none', transition: 'background 0.6s' }} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2rem 1.5rem', position: 'relative', zIndex: 10 }}>
        {/* Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: '.5rem', fontFamily: 'Space Grotesk,sans-serif', fontWeight: 800, fontSize: '.78rem', textTransform: 'uppercase', letterSpacing: '.1em', color: 'var(--ink)', marginBottom: '2.5rem' }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--a)', boxShadow: '0 0 10px var(--a)' }} />
          La Curiosphère
        </div>

        {isSlide ? (
          /* ── SLIDES ── */
          <div style={{ width: '100%', maxWidth: 380, textAlign: 'center' }}>
            <div style={{ fontSize: '3.5rem', marginBottom: '1.25rem', filter: `drop-shadow(0 0 20px ${sl.color}40)`, transition: 'all .4s' }}>{sl.icon}</div>
            <div style={{ fontSize: 'clamp(1.5rem,6vw,2rem)', fontWeight: 800, color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif', marginBottom: '.75rem', lineHeight: 1.2 }}>{sl.title}</div>
            <div style={{ fontSize: '.88rem', color: 'var(--ink2)', lineHeight: 1.7, marginBottom: '2.5rem', maxWidth: 320, marginLeft: 'auto', marginRight: 'auto' }}>{sl.desc}</div>
            {/* Dots */}
            <div style={{ display: 'flex', justifyContent: 'center', gap: '.4rem', marginBottom: '1.5rem' }}>
              {ONBOARDING_SLIDES.map((_, i) => <div key={i} style={{ width: i === step ? 20 : 6, height: 6, borderRadius: 999, background: i === step ? sl.color : 'var(--b2)', transition: 'all .3s' }} />)}
            </div>
            <div style={{ display: 'flex', gap: '.75rem', justifyContent: 'center' }}>
              <button onClick={() => setStep(3)} style={{ padding: '.5rem 1.1rem', background: 'transparent', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink3)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 600, cursor: 'pointer' }}>Passer</button>
              <button onClick={() => setStep(s => s + 1)} style={{ padding: '.5rem 1.4rem', background: sl.color, border: 'none', borderRadius: '.65rem', color: '#07090f', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, cursor: 'pointer' }}>{step === 2 ? '🚀 Commencer' : 'Suivant →'}</button>
            </div>
          </div>
        ) : (
          /* ── AUTH FORM ── */
          <div style={{ width: '100%', maxWidth: 380 }}>
            {/* Tabs */}
            <div style={{ display: 'flex', gap: '.35rem', background: 'rgba(255,255,255,.04)', borderRadius: '.65rem', padding: '.2rem', marginBottom: '1.5rem' }}>
              {[{ id: 'signup', lbl: 'Créer un compte' }, { id: 'login', lbl: 'Se connecter' }].map(t => (
                <button key={t.id} onClick={() => { setAuthTab(t.id); setErr(''); }} style={{ flex: 1, padding: '.45rem', border: 'none', borderRadius: '.45rem', background: authTab === t.id ? 'var(--a)' : 'transparent', color: authTab === t.id ? '#07090f' : 'var(--ink3)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 700, cursor: 'pointer', transition: 'all .2s' }}>{t.lbl}</button>
              ))}
            </div>

            {/* OAuth */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.5rem', marginBottom: '1rem' }}>
              <button onClick={() => handleOAuth('google')} disabled={loading} style={{ padding: '.55rem', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.4rem' }}>
                <svg width="14" height="14" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
              </button>
              <button onClick={() => handleOAuth('discord')} disabled={loading} style={{ padding: '.55rem', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.72rem', fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.4rem' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.045.028.056A19.9 19.9 0 0 0 5.9 20.597a.077.077 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                Discord
              </button>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '.75rem', marginBottom: '1rem' }}>
              <div style={{ flex: 1, height: 1, background: 'var(--b2)' }} />
              <span style={{ fontSize: '.62rem', color: 'var(--ink3)', fontWeight: 600 }}>ou</span>
              <div style={{ flex: 1, height: 1, background: 'var(--b2)' }} />
            </div>

            {/* Fields */}
            {authTab === 'signup' && (
              <div style={{ marginBottom: '.7rem' }}>
                <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.1em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.3rem' }}>Pseudo</div>
                <input value={pseudo} onChange={e => setPseudo(e.target.value)} placeholder="Hunter42" maxLength={20} style={{ width: '100%', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink)', padding: '.6rem .9rem', fontSize: '.85rem', fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
              </div>
            )}
            <div style={{ marginBottom: '.7rem' }}>
              <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.1em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.3rem' }}>Email</div>
              <input type="email" autoCapitalize="none" autoCorrect="off" autoComplete="email" inputMode="email" spellCheck={false} value={email} onChange={e => setEmail(e.target.value)} placeholder="ton@email.fr" style={{ width: '100%', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink)', padding: '.6rem .9rem', fontSize: '.85rem', fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
            </div>
            <div style={{ marginBottom: '1rem' }}>
              <div style={{ fontSize: '.58rem', fontWeight: 700, letterSpacing: '.1em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.3rem' }}>Mot de passe</div>
              <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder={authTab === 'signup' ? 'Min. 6 caractères' : '••••••••'} onKeyDown={e => e.key === 'Enter' && (authTab === 'signup' ? handleSignup() : handleLogin())} style={{ width: '100%', background: 'var(--s2)', border: '1px solid var(--b2)', borderRadius: '.65rem', color: 'var(--ink)', padding: '.6rem .9rem', fontSize: '.85rem', fontFamily: 'inherit', outline: 'none', boxSizing: 'border-box' }} />
            </div>
            {err && <div style={{ fontSize: '.72rem', color: 'var(--re)', background: 'rgba(248,113,113,.08)', border: '1px solid rgba(248,113,113,.2)', borderRadius: '.5rem', padding: '.5rem .75rem', marginBottom: '.75rem' }}>{err}</div>}
            <button onClick={authTab === 'signup' ? handleSignup : handleLogin} disabled={loading} style={{ width: '100%', padding: '.75rem', background: 'var(--a)', color: '#07090f', border: 'none', borderRadius: '.75rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.82rem', fontWeight: 700, letterSpacing: '.08em', cursor: 'pointer', opacity: loading ? .5 : 1 }}>
              {loading ? '…' : authTab === 'signup' ? '→ Créer mon compte' : '→ Se connecter'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('hub');
  const [anecDone, setAnecDone] = useState(false);
  const [anec, setAnec] = useState(null);
  const [anecQs, setAnecQs] = useState([]);
  const [loadingAnec, setLoadingAnec] = useState(true);
  const [league, setLeague] = useState([]);
  const [mystery, setMystery] = useState(null);
  const [mysteryDow, setMysteryDow] = useState(0);
  const [tutoStep, setTutoStep] = useState(0);
  const [tutoActive, setTutoActive] = useState(() => !localStorage.getItem('tuto_done'));
  function tutoSkip() { localStorage.setItem('tuto_done', '1'); setTutoActive(false); }

  // ── Auth ──
  const [authUser, setAuthUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [denied, setDenied] = useState(false);

  async function loadProfile(user) {
    if (!user) { setProfile(null); return; }
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
    let p = null, fetchFailed = false;
    try {
      const res = await withTimeout(sb.from('profiles').select('*').eq('id', user.id).maybeSingle(), 8000);
      if (res?.error) fetchFailed = true;
      p = res?.data || null;
    } catch (e) {
      console.warn('profile fetch failed (réseau):', e);
      fetchFailed = true;
    }
    if (fetchFailed) {
      // Réseau capricieux : on NE déconnecte PAS — la session reste valide. Profil minimal le temps de réessayer.
      setDenied(false);
      setProfile({ id: user.id, username: (user.email || '').split('@')[0] || 'Hunter', role: 'beta_tester', xp: 0, streak: 0, joined: new Date().toISOString(), streak_record: 0 });
      return;
    }
    // Pas de profil ? On le crée (comme l'app d'origine) — il y a une session, donc le RLS l'autorise
    if (!p) {
      const meta = user.user_metadata || {};
      let uname = (meta.username || meta.user_name || meta.full_name || (user.email || '').split('@')[0] || ('chasseur' + Math.floor(Math.random() * 9999))).replace(/[^a-zA-Z0-9_\-]/g, '_').slice(0, 20);
      try {
        const { data: ex } = await sb.from('profiles').select('id').eq('username', uname).maybeSingle();
        if (ex) uname = uname.slice(0, 15) + '_' + Math.floor(Math.random() * 999);
        const { data: created } = await sb.from('profiles').insert({ id: user.id, username: uname, joined: todayStr() }).select().maybeSingle();
        p = created || { id: user.id, username: uname, role: 'user' };
      } catch (e) { console.warn('create profile:', e); p = { id: user.id, username: uname, role: 'user' }; }
    }
    if (!ALLOWED_ROLES.includes(p.role)) {
      await sb.auth.signOut();
      setAuthUser(null); setProfile(null); setDenied(true);
      return;
    }
    // Affiche le hub TOUT DE SUITE (rôle vérifié) — XP/streak calculés ensuite en arrière-plan
    setDenied(false);
    setProfile({ ...p, xp: 0, streak: 0 });
    // Calcul XP & streak en arrière-plan (ne bloque pas l'affichage)
    (async () => {
      try {
        const [rR, rQ, rE] = await Promise.all([
          sb.from('reads').select('date').eq('user_id', user.id),
          sb.from('quiz_history').select('pct').eq('user_id', user.id),
          sb.from('enigma_responses').select('is_correct').eq('user_id', user.id),
        ]);
        const reads = rR?.data || [], quizzes = rQ?.data || [], enigmas = rE?.data || [];
        const streak = computeStreak(reads.map(r => r.date));
        const xp = calcSLXP({ reads: reads.length, quizzes, enigmas, streak });
        setProfile(prev => (prev && prev.id === p.id) ? { ...prev, xp, streak } : prev);
      } catch (e) { console.warn('xp calc:', e); }
    })();
  }

  useEffect(() => {
    const withTimeout = (p, ms) => Promise.race([p, new Promise((res) => setTimeout(() => res({ __timeout: true }), ms))]);
    let settled = false;
    const finish = () => { if (!settled) { settled = true; setAuthLoading(false); } };
    const hasStoredToken = !!localStorage.getItem('sb-zryrfmothjhywkklmniw-auth-token');
    (async () => {
      let session = null;
      try {
        const r = await withTimeout(sb.auth.getSession(), 6000);
        if (!r.__timeout) session = r?.data?.session || null;
        else console.warn('getSession timeout');
      } catch (e) { console.error('getSession:', e); }
      try {
        if (session?.user) { setAuthUser(session.user); await loadProfile(session.user); finish(); }
        else if (!hasStoredToken) { setAuthUser(null); finish(); }
        // sinon : un token est stocké → on garde le loader, onAuthStateChange va restaurer la session (pas de flash d'onboarding)
      } catch (e) { console.error('auth init:', e); setAuthUser(null); finish(); }
    })();
    const { data: { subscription } } = sb.auth.onAuthStateChange(async (_e, session) => {
      try {
        if (session?.user) { setAuthUser(session.user); await loadProfile(session.user); }
        else { setAuthUser(null); setProfile(null); }
      } catch (e) { console.error('auth change:', e); }
      finish();
    });
    // Garde-fou : ne jamais rester bloqué sur le loader
    const guard = setTimeout(finish, 9000);
    return () => { subscription.unsubscribe(); clearTimeout(guard); };
  }, []);

  // ── Theme ──
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem('theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
    localStorage.setItem('theme', theme);
  }, [theme]);
  function toggleTheme() { setTheme(t => t === 'dark' ? 'light' : 'dark'); }

  async function handleRandomAnec() {
    try {
      const { data } = await sb.from('anecdotes').select('*').order('created_at', { ascending: false }).limit(100);
      if (data && data.length) {
        const pick = data[Math.floor(Math.random() * data.length)];
        setAnec(pick);
        const { data: qs } = await sb.from('questions').select('*').eq('anecdote_id', pick.id);
        setAnecQs(qs || []);
        setScreen('anec');
      }
    } catch (e) {console.warn('random anec:', e);}
  }

  useEffect(() => {
    // Fetch real daily anecdote
    async function loadAnec() {
      try {
        const res = await fetch(EDGE + '?date=' + todayStr() + '&_t=' + Date.now(), {
          cache: 'no-store',
          headers: { 'Authorization': 'Bearer ' + SB_ANON, 'apikey': SB_ANON }
        });
        const { anecdote, questions } = await res.json();
        if (anecdote) {setAnec(anecdote);setAnecQs(questions || []);}
      } catch (e) {console.error('Anecdote fetch:', e);} finally
      {setLoadingAnec(false);}
    }
    // Fetch real weekly league top 5
    async function loadLeague() {
      try {
        const now = new Date();
        const dow = (now.getDay() + 6) % 7;
        const mon = new Date(now);mon.setDate(now.getDate() - dow);mon.setHours(0, 0, 0, 0);
        const ws = mon.toISOString().slice(0, 10);
        const { data: scores } = await sb.from('league_scores').select('user_id,points').eq('week_start', ws).order('points', { ascending: false }).limit(5);
        if (!scores || !scores.length) return;
        const ids = scores.map((s) => s.user_id);
        const { data: profiles } = await sb.from('profiles').select('id,username').in('id', ids);
        const pMap = {};(profiles || []).forEach((p) => {pMap[p.id] = p.username;});
        setLeague(scores.map((s) => ({ name: pMap[s.user_id] || 'Chasseur', pts: s.points, init: (pMap[s.user_id] || '?')[0].toUpperCase() })));
      } catch (e) {console.error('League fetch:', e);}
    }
    loadAnec();loadLeague();
    // Fetch weekly mystery
    (async () => {
      try {
        const now = new Date(),dow = (now.getDay() + 6) % 7;
        const mon = new Date(now);mon.setDate(now.getDate() - dow);mon.setHours(0, 0, 0, 0);
        const ws = mon.toISOString().slice(0, 10);
        const { data } = await sb.from('weekly_mysteries').select('id,title,story_days,week_start').eq('week_start', ws).maybeSingle();
        const MOCK_MYSTERY = {
          id: 'mock', title: 'Le Meurtre au Musée Grimaldi', week_start: '2026-05-25',
          intro: "Lundi matin, le musée Grimaldi est en émoi : le tableau « La Mélancolie » de Voss, estimé à 4 millions d'euros, a disparu pendant la nuit, sans la moindre trace d'effraction. Quatre personnes seulement avaient accès aux lieux cette nuit-là. Chaque jour de la semaine, un nouvel indice fait surface.",
          goal: "Recouper les indices des 5 actes et démasquer le coupable du vol au musée Grimaldi.",
          story_days: [
          "Ce lundi matin, le directeur du musée Grimaldi découvrit avec horreur la vitrine principale brisée. Le tableau \"La Mélancolie\" de Voss (estimé à 4 millions d'euros) avait disparu. Aucune trace d'effraction sur les portes. Le gardien de nuit, Marco Ferri, prétend n'avoir rien entendu.",
          "Les enquêteurs ont relevé des traces de poudre blanche près de la vitrine. Le chimiste de garde, Élise Morand, confirme qu'il s'agit de plâtre, comme celui utilisé dans les travaux de restauration du deuxième étage. Curieusement, le chantier a été arrêté vendredi dernier.",
          "Une caméra de surveillance a capté une silhouette à 2h17 du matin. La qualité est mauvaise, mais la morphologie correspond à un employé de taille moyenne. La liste des personnes ayant accès au musée la nuit comprend 4 noms : Marco Ferri, Élise Morand, le restaurateur Jules Anter, et la conservatrice Nadia Blum.",
          "Jules Anter a été retrouvé en possession d'une clé de réserve non déclarée. Il affirme l'avoir trouvée par hasard. Ses empreintes digitales ont été relevées sur le cadre vide de la vitrine. Il maintient son innocence.",
          "Un témoin anonyme a contacté la police : le soir du vol, il aurait vu une voiture grise garée devant l'entrée de service. La plaque correspond au véhicule de Nadia Blum. Mais Nadia présente un alibi pour cette nuit-là..."]

        };
        if (data) {setMystery(data);setMysteryDow(dow);} else
        {setMystery(MOCK_MYSTERY);setMysteryDow(dow);}
      } catch (e) {console.error('Mystery fetch:', e);}
    })();
  }, []);

  // Auto-redirect to pick if no anec after load
  useEffect(() => {
    if (!loadingAnec && !anec && screen === 'anec') setScreen('pick');
  }, [loadingAnec, anec, screen]);

  return (
    <>
      {/* Auth gate */}

// ── Theme color map ──
const THEME_COLOR_MAP = {
  'histoire': '#d97706', 'science': '#00c8ff', 'nature': '#22c55e',
  'insolite': '#a855f7', 'art': '#ec4899', 'art & culture': '#ec4899',
  'espace': '#818cf8', 'sport': '#f97316', 'gastronomie': '#fb923c',
  'legendes': '#14b8a6', 'legendes urbaines': '#14b8a6', 'légendes': '#14b8a6', 'légendes urbaines': '#14b8a6'
};
function getThemeColor(theme) {
  if (!theme) return '#00c8ff';
  const k = theme.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return THEME_COLOR_MAP[k] || THEME_COLOR_MAP[Object.keys(THEME_COLOR_MAP).find((x) => k.includes(x))] || '#00c8ff';
}

// ── Quiz section ──
function QuizSection({ questions, themeColor }) {
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [combo, setCombo] = useState(0);
  if (!questions || !questions.length) return null;
  const color = themeColor || '#00c8ff';
  if (done) {
    const pct = Math.round(score / questions.length * 100);
    const emoji = pct >= 80 ? '🏆' : pct >= 60 ? '⭐' : '💪';
    return (
      <div style={{ background: `color-mix(in srgb,${color} 5%,transparent)`, border: `1px solid color-mix(in srgb,${color} 20%,transparent)`, borderRadius: '1rem', padding: '2rem 1.25rem', textAlign: 'center' }}>
        <div style={{ fontSize: '2.5rem', marginBottom: '.5rem' }}>{emoji}</div>
        <div style={{ fontSize: '1.5rem', fontWeight: 700, color: 'var(--ink)', fontFamily: 'monospace' }}>{pct}%</div>
        <div style={{ fontSize: '.82rem', color: 'var(--ink2)', marginTop: '.3rem' }}>{score}/{questions.length} correctes</div>
      </div>);

  }
  const q = questions[idx];
  const prog = Math.round(idx / questions.length * 100);
  return (
    <div style={{ background: `color-mix(in srgb,${color} 5%,transparent)`, border: `1px solid color-mix(in srgb,${color} 20%,transparent)`, borderRadius: '1rem', padding: '1.25rem' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.5rem' }}>
        <span style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.1em', color: `color-mix(in srgb,${color} 80%,#fff)`, textTransform: 'uppercase' }}>Q {idx + 1}/{questions.length}</span>
        <div style={{ display: 'flex', alignItems: 'center', gap: '.4rem' }}>
          {combo >= 3 && <span style={{ fontSize: '.58rem', fontWeight: 800, color: '#f97316', background: 'rgba(249,115,22,.12)', border: '1px solid rgba(249,115,22,.3)', borderRadius: '999px', padding: '.15rem .45rem', letterSpacing: '.06em' }}>🔥 x1.5</span>}
          <span style={{ fontSize: '.6rem', color: 'var(--ink3)' }}>{score} pts</span>
        </div>
      </div>
      <div style={{ height: '3px', background: 'rgba(255,255,255,.06)', borderRadius: '2px', marginBottom: '1rem' }}>
        <div style={{ height: '100%', width: prog + '%', background: color, borderRadius: '2px', transition: 'width .3s' }} />
      </div>
      <div style={{ fontSize: '.88rem', fontWeight: 600, color: 'var(--ink)', lineHeight: 1.6, marginBottom: '1rem' }}>{q.question}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: '.4rem', marginBottom: '.75rem' }}>
        {q.options.map((opt, i) => {
          const isCorrect = i === q.answer,isSelected = i === selected;
          let bg = 'rgba(255,255,255,.03)',bdr = 'rgba(255,255,255,.08)',clr = 'var(--ink2)';
          if (answered) {
            if (isCorrect) {bg = 'rgba(52,211,153,.12)';bdr = '#34d399';clr = '#34d399';} else
            if (isSelected) {bg = 'rgba(248,113,113,.12)';bdr = '#f87171';clr = '#f87171';}
          }
          return (
            <button key={i} onClick={() => {if (answered) return;setSelected(i);setAnswered(true);const ok = i === q.answer;if (ok) {const mult = combo >= 3 ? 1.5 : 1;setScore((s) => s + mult);setCombo((c) => c + 1);} else {setCombo(0);}}}
            style={{ background: bg, border: `1px solid ${bdr}`, borderRadius: '.65rem', padding: '.65rem .9rem', textAlign: 'left', color: clr, fontSize: '.8rem', cursor: answered ? 'default' : 'pointer', transition: 'all .15s', fontFamily: 'Space Grotesk,sans-serif', display: 'flex', gap: '.5rem', alignItems: 'flex-start' }}>
              <span style={{ fontWeight: 700, color: answered ? isCorrect ? '#34d399' : isSelected ? '#f87171' : 'var(--ink3)' : 'var(--ink3)', flexShrink: 0 }}>{String.fromCharCode(65 + i)}.</span>
              <span>{opt}</span>
            </button>);

        })}
      </div>
      {answered && q.explanation && <div style={{ fontSize: '.73rem', color: 'var(--ink3)', lineHeight: 1.6, borderTop: '1px solid rgba(255,255,255,.05)', paddingTop: '.6rem', marginBottom: '.6rem' }}>💡 {q.explanation}</div>}
      {answered && <button onClick={() => {if (idx >= questions.length - 1) setDone(true);else {setIdx((i) => i + 1);setSelected(null);setAnswered(false);}}}
      style={{ width: '100%', padding: '.6rem', background: `color-mix(in srgb,${color} 12%,transparent)`, border: `1px solid color-mix(in srgb,${color} 30%,transparent)`, borderRadius: '.65rem', color, fontSize: '.75rem', fontWeight: 700, cursor: 'pointer', fontFamily: 'Space Grotesk,sans-serif' }}>
        {idx >= questions.length - 1 ? 'Voir mon score →' : 'Question suivante →'}
      </button>}
    </div>);

}

// ── COMMENTS SECTION (réutilisable) ──
function CommentsSection({ contentType, contentId, color }) {
  const C = color || '#00c8ff';
  const [comments, setComments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    if (!open || !contentId) return;
    (async () => {
      setLoading(true);
      try {
        const { data } = await sb.from('comments')
          .select('id, user_id, username, message, created_at')
          .eq('content_type', contentType).eq('content_id', String(contentId))
          .order('created_at', { ascending: true }).limit(50);
        setComments(data || []);
      } catch (e) { setComments([]); }
      setLoading(false);
    })();
  }, [open, contentId]);

  async function send() {
    if (!input.trim() || sending) return;
    setSending(true);
    try {
      const user = (await sb.auth.getUser()).data?.user;
      const { data: p } = user ? await sb.from('profiles').select('username').eq('id', user.id).maybeSingle() : { data: null };
      const username = p?.username || localStorage.getItem('proto_username') || 'Anonyme';
      const { data: msg } = await sb.from('comments').insert({ user_id: user?.id || null, username, message: input.trim(), content_type: contentType, content_id: String(contentId) }).select().single();
      if (msg) setComments(prev => [...prev, msg]);
      setInput('');
    } catch (e) {}
    setSending(false);
  }

  const fmt = (d) => new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

  return (
    <div style={{ marginBottom: '1rem' }}>
      <button onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', gap: '.5rem', background: 'none', border: 'none', cursor: 'pointer', padding: '0', width: '100%', marginBottom: open ? '.75rem' : 0 }}>
        <span style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.1em', color: 'var(--ink3)', textTransform: 'uppercase' }}>💬 Commentaires</span>
        {comments.length > 0 && <span style={{ fontSize: '.58rem', fontWeight: 700, color: C, background: C + '18', borderRadius: '999px', padding: '.1rem .4rem' }}>{comments.length}</span>}
        <span style={{ fontSize: '.6rem', color: 'var(--ink3)', marginLeft: 'auto' }}>{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div style={{ background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem', padding: '.85rem 1rem' }}>
          {loading ? <div style={{ textAlign: 'center', padding: '1rem', color: 'var(--ink3)', fontSize: '.72rem' }}>Chargement…</div> :
           comments.length === 0 ? <div style={{ textAlign: 'center', padding: '.75rem', color: 'var(--ink3)', fontSize: '.72rem' }}>Sois le premier à commenter !</div> :
           <div style={{ display: 'flex', flexDirection: 'column', gap: '.5rem', marginBottom: '.75rem' }}>
             {comments.map((c, i) => (
               <div key={c.id || i} style={{ padding: '.5rem .65rem', background: 'rgba(255,255,255,.03)', borderRadius: '.65rem' }}>
                 <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '.2rem' }}>
                   <span style={{ fontSize: '.65rem', fontWeight: 700, color: C }}>{c.username || 'Anonyme'}</span>
                   <span style={{ fontSize: '.55rem', color: 'var(--ink3)' }}>{fmt(c.created_at)}</span>
                 </div>
                 <div style={{ fontSize: '.78rem', color: 'var(--ink2)', lineHeight: 1.5 }}>{c.message}</div>
               </div>
             ))}
           </div>}
          <div style={{ display: 'flex', gap: '.4rem' }}>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Ajouter un commentaire…" maxLength={280}
              style={{ flex: 1, background: 'rgba(0,0,0,.25)', border: `1px solid ${C}25`, borderRadius: '.6rem', color: 'var(--ink)', fontSize: '.78rem', padding: '.45rem .7rem', outline: 'none', fontFamily: 'Space Grotesk,sans-serif' }} />
            <button onClick={send} disabled={!input.trim() || sending} style={{ padding: '.45rem .75rem', background: input.trim() ? C : C + '18', border: 'none', borderRadius: '.6rem', color: input.trim() ? '#07090f' : C + '60', fontSize: '.82rem', cursor: input.trim() ? 'pointer' : 'default', fontWeight: 700, transition: 'all .15s' }}>↗</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ScreenAnecdote({ anec, qs, loading, onDone, onPick }) {
  const [ctxText, setCtxText] = useState(null);
  const [ctxOpen, setCtxOpen] = useState(false);
  const [ctxLoading, setCtxLoading] = useState(false);
  const [fav, setFav] = useState(false);
  const [reactions, setReactions] = useState({ up: 0, down: 0, mine: null });
  const [quizOpen, setQuizOpen] = useState(false);
  const [readDone, setReadDone] = useState(false);
  const [typed, setTyped] = useState('');
  const [typewriterDone, setTypewriterDone] = useState(false);
  const cd = useCountdown();
  const questions = qs || [];
  const themeColor = getThemeColor(anec?.theme);

  useEffect(() => {
    if (!anec?.anecdote) return;
    const txt = anec.anecdote;
    setTyped('');setTypewriterDone(false);
    let i = 0;
    const iv = setInterval(() => {
      if (i >= txt.length) {clearInterval(iv);setTypewriterDone(true);return;}
      setTyped(txt.slice(0, ++i));
    }, 14);
    return () => clearInterval(iv);
  }, [anec?.anecdote]);

  useEffect(() => {
    if (!anec?.id) return;
    (async () => {
      try {
        const { data } = await sb.from('reactions').select('reaction').eq('anecdote_id', anec.id);
        const counts = data || [];
        setReactions((r) => ({ ...r, up: counts.filter((x) => x.reaction === 'up').length, down: counts.filter((x) => x.reaction === 'down').length }));
      } catch (e) {}
    })();
  }, [anec?.id]);

  async function toggleCtx() {
    if (ctxText !== null) {setCtxOpen((o) => !o);return;}
    if (anec?.contexte) {setCtxText(anec.contexte);setCtxOpen(true);return;}
    setCtxLoading(true);setCtxOpen(true);
    try {
      const res = await fetch(EDGE, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'apikey': SB_ANON }, body: JSON.stringify({ id: anec.id, anecdote: anec.anecdote, theme: anec.theme }) });
      const json = await res.json();
      setCtxText(json.contexte || 'Contenu bientôt disponible.');
    } catch (e) {setCtxText('Impossible de charger le contexte.');}
    setCtxLoading(false);
  }

  function toggleReaction(type) {
    setReactions((r) => {
      const wasActive = r.mine === type;
      return { up: type === 'up' ? r.up + (wasActive ? -1 : 1) + (r.mine === 'down' ? 0 : 0) : r.up + (r.mine === 'up' ? -1 : 0), down: type === 'down' ? r.down + (wasActive ? -1 : 1) : r.down + (r.mine === 'down' ? -1 : 0), mine: wasActive ? null : type };
    });
  }

  const dayOfYear = () => {const n = new Date(),s = new Date(n.getFullYear(), 0, 0);return Math.floor((n - s) / 86400000);};
  const daysInYear = () => {const y = new Date().getFullYear();return y % 4 === 0 && y % 100 !== 0 || y % 400 === 0 ? 366 : 365;};

  if (loading || !anec) return (
    <div style={{ width: '100%', minHeight: '60vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '1.5rem' }}>
      <style>{`
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse-c{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.4}}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.la-orbit{width:60px;height:60px;position:relative}
.la-orbit::before,.la-orbit::after{content:'';position:absolute;border-radius:50%}
.la-orbit::before{inset:0;border:1px solid var(--b2);border-top-color:var(--a);border-right-color:var(--a);animation:sp .9s linear infinite}
.la-orbit::after{inset:12px;border:1px solid transparent;border-bottom-color:var(--a);animation:sp 1.5s linear infinite reverse}
.la-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.la-dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--aglow);animation:pulse-c 1s ease-in-out infinite}
.la-title{font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.04em;color:var(--ink2)}
.la-prog{width:160px;height:1px;background:var(--b2);overflow:hidden}
.la-prog-fill{height:100%;background:linear-gradient(90deg,transparent,var(--a),transparent);animation:scan 1.5s ease-in-out infinite}
`}</style>
      <div className="la-orbit"><div className="la-center"><div className="la-dot" /></div></div>
      <div className="la-title">Génération en cours…</div>
      <div className="la-prog"><div className="la-prog-fill" /></div>
      {onPick && <div style={{ textAlign: 'center', marginTop: '.5rem' }}><button className="btn-share" onClick={onPick}>Choisir un thème →</button></div>}
    </div>);


  const themeLabel = anec.theme || '';
  const chooser = anec.chooser || '';
  return (
    <div style={{ width: '100%' }}>
      {/* Topbar */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '.5rem' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '.55rem', flexWrap: 'wrap' }}>
          <span style={{ fontSize: '.65rem', fontWeight: 700, letterSpacing: '.1em', color: themeColor, background: `color-mix(in srgb,${themeColor} 14%,transparent)`, border: `1px solid color-mix(in srgb,${themeColor} 32%,transparent)`, borderRadius: '999px', padding: '.25rem .75rem', textTransform: 'uppercase' }}>
            {anec.icon || '💡'} {themeLabel}
          </span>
          <span style={{ fontSize: '.62rem', fontWeight: 600, letterSpacing: '.09em', color: 'var(--ink3)', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '999px', padding: '.22rem .65rem' }}>
            Jour {dayOfYear()}/{daysInYear()}
          </span>
        </div>
        {chooser && <div style={{ textAlign: 'right' }}>
          <div style={{ fontSize: '.52rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: '.1rem' }}>Choisi par</div>
          <div style={{ fontSize: '.75rem', fontWeight: 700, color: themeColor }}>{chooser}</div>
        </div>}
      </div>

      {/* Main card */}
      <div style={{ background: `color-mix(in srgb,${themeColor} 7%,var(--hero-base))`, border: `1px solid color-mix(in srgb,${themeColor} 28%,transparent)`, borderRadius: '1.25rem', padding: '1.5rem 1.4rem', marginBottom: '1rem', position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: '-60px', right: '-60px', width: '220px', height: '220px', background: `radial-gradient(circle,color-mix(in srgb,${themeColor} 14%,transparent) 0%,transparent 70%)`, pointerEvents: 'none' }} />
        <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}`}</style>
        <div style={{ fontSize: '1.05rem', lineHeight: 1.85, color: 'var(--ink)', position: 'relative', zIndex: 1 }}>
          {typed}
          {!typewriterDone && <span style={{ display: 'inline-block', width: '2px', height: '1.1em', background: themeColor, marginLeft: '2px', verticalAlign: 'text-bottom', animation: 'blink .7s steps(1) infinite' }} />}
        </div>
        {anec.note && <div style={{ fontSize: '.7rem', color: 'var(--ink3)', marginTop: '1rem', paddingTop: '.75rem', borderTop: `1px solid color-mix(in srgb,${themeColor} 12%,transparent)`, position: 'relative', zIndex: 1 }}>{anec.note}</div>}
      </div>

      {/* Actions */}
      <div style={{ display: 'flex', gap: '.45rem', marginBottom: '1rem', flexWrap: 'wrap' }}>
        <button className={`btn-share${readDone ? ' on' : ''}`} onClick={async () => {
          if (readDone) return;
          setReadDone(true);
          try {
            const u = (await sb.auth.getUser()).data?.user;
            if (u && anec?.id) {
              await sb.from('reads').upsert({ user_id: u.id, anecdote_id: anec.id, date: todayStr(), preview: (anec.anecdote || '').slice(0, 100) }, { onConflict: 'user_id,anecdote_id' });
            }
          } catch (e) { console.warn('read save:', e); }
          if (onDone) onDone();
        }} style={{ flex: 1, minWidth: 120 }}>
          {readDone ? '✓ Lu · +50 XP' : '✓ Marquer comme lu'}
        </button>
        <button className={`btn-share${fav ? ' on' : ''}`} onClick={() => setFav((f) => !f)}>{fav ? '🧡' : '🤍'}</button>
        <button className={`btn-share${reactions.mine === 'up' ? ' on' : ''}`} onClick={() => toggleReaction('up')}>👍 {reactions.up}</button>
        <button className={`btn-share${reactions.mine === 'down' ? ' on' : ''}`} onClick={() => toggleReaction('down')}>👎 {reactions.down}</button>
      </div>

      {/* Context */}
      <div style={{ background: 'rgba(255,255,255,.02)', border: '1px solid rgba(255,255,255,.06)', borderRadius: '1rem', marginBottom: '1rem', overflow: 'hidden' }}>
        <button onClick={toggleCtx} style={{ width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '.85rem 1rem', background: 'none', border: 'none', cursor: 'pointer', color: 'var(--ink2)', fontFamily: 'Space Grotesk,sans-serif' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '.6rem' }}>
            <span>💡</span><span style={{ fontSize: '.8rem', fontWeight: 600 }}>En savoir plus</span>
          </div>
          <span style={{ fontSize: '.75rem', color: 'var(--ink3)', transform: ctxOpen ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }}>▾</span>
        </button>
        {ctxOpen && <div style={{ padding: '0 1rem 1rem', fontSize: '.8rem', color: 'var(--ink2)', lineHeight: 1.75, borderTop: '1px solid rgba(255,255,255,.05)' }}>
          {ctxLoading ? <span style={{ color: 'var(--ink3)', fontStyle: 'italic' }}>✨ Génération en cours…</span> : ctxText}
        </div>}
      </div>

      {/* Quiz */}
      {questions.length > 0 && <div style={{ marginBottom: '1rem' }}>
        {!quizOpen ?
        <button onClick={() => setQuizOpen(true)} style={{ width: '100%', padding: '.85rem', background: `color-mix(in srgb,${themeColor} 8%,transparent)`, border: `1px solid color-mix(in srgb,${themeColor} 25%,transparent)`, borderRadius: '1rem', color: themeColor, fontSize: '.78rem', fontWeight: 700, letterSpacing: '.08em', cursor: 'pointer', fontFamily: 'Space Grotesk,sans-serif' }}>
            📝 Tester mes connaissances ({questions.length} questions)
          </button> :
        <QuizSection questions={questions} themeColor={themeColor} />
        }
      </div>}

      {/* Comments */}
      {anec?.id && <CommentsSection contentType="anecdote" contentId={anec.id} color={themeColor} />}

      {/* Footer countdown */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '.85rem 1rem', background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem' }}>
        <div style={{ fontSize: '.58rem', color: 'var(--ink3)', textTransform: 'uppercase', letterSpacing: '.1em' }}>Prochaine anecdote</div>
        <div style={{ fontFamily: 'monospace', fontSize: '.9rem', fontWeight: 700, color: 'var(--a)', letterSpacing: '.05em' }}>{cd}</div>
      </div>
    </div>);

}


// ── RECAP HEBDO ──
function ScreenRecap({ onBack }) {
  const REC_COLOR = '#a855f7';
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      const now = new Date();
      const monday = new Date(now);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      monday.setHours(0, 0, 0, 0);
      const weekStart = monday.toISOString();
      try {
        const user = (await sb.auth.getUser()).data?.user;
        if (!user) { setStats({ mock: true, reads: 5, quizzes: 3, avgPct: 74, xpGained: 400, streak: USER.streak, topTheme: 'Science', totalMin: 22 }); setLoading(false); return; }
        const [{ data: reads }, { data: quizzes }] = await Promise.all([
          sb.from('reads').select('anecdote_id, created_at, anecdotes(theme)').eq('user_id', user.id).gte('created_at', weekStart),
          sb.from('quiz_history').select('pct, score, total, created_at').eq('user_id', user.id).gte('created_at', weekStart),
        ]);
        const themeCounts = {};
        (reads || []).forEach(r => { const t = r.anecdotes?.theme || 'Autre'; themeCounts[t] = (themeCounts[t] || 0) + 1; });
        const topTheme = Object.entries(themeCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
        const avgPct = quizzes?.length ? Math.round(quizzes.reduce((a, q) => a + (q.pct || 0), 0) / quizzes.length) : 0;
        const xpGained = ((reads || []).length * 50) + ((quizzes || []).length * 80);
        setStats({ reads: (reads || []).length, quizzes: (quizzes || []).length, avgPct, xpGained, streak: USER.streak, topTheme, totalMin: Math.round((reads || []).length * 4.5) });
      } catch (e) { setStats({ mock: true, reads: 5, quizzes: 3, avgPct: 74, xpGained: 400, streak: USER.streak, topTheme: 'Science', totalMin: 22 }); }
      setLoading(false);
    })();
  }, []);

  const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
  const todayIdx = (new Date().getDay() + 6) % 7;

  if (loading) return <div style={{ width: '100%', minHeight: '50vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink3)', fontSize: '.78rem' }}>Chargement de ton recap…</div>;

  return (
    <div style={{ width: '100%' }}>
      <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '.72rem', fontFamily: 'Space Grotesk,sans-serif', marginBottom: '1.25rem', padding: 0, display: 'block' }}>← Retour</button>

      {/* Header */}
      <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: REC_COLOR, textTransform: 'uppercase', marginBottom: '.4rem' }}>📊 RECAP DE LA SEMAINE</div>
        <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.8rem', fontWeight: 800, color: 'var(--ink)', textTransform: 'uppercase' }}>Cette semaine</div>
        <div style={{ fontSize: '.72rem', color: 'var(--ink3)', marginTop: '.25rem' }}>{days.slice(0, todayIdx + 1).join(' · ')}</div>
      </div>

      {/* Hero stat — lectures */}
      <div style={{ background: `color-mix(in srgb,${REC_COLOR} 10%,var(--bg))`, border: `1px solid color-mix(in srgb,${REC_COLOR} 30%,transparent)`, borderRadius: '1.25rem', padding: '1.75rem 1.5rem', textAlign: 'center', marginBottom: '1rem', position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: '-30px', right: '-30px', width: '120px', height: '120px', borderRadius: '50%', background: `radial-gradient(circle,${REC_COLOR}25,transparent 70%)` }} />
        <div style={{ fontSize: '.6rem', fontWeight: 700, letterSpacing: '.15em', color: REC_COLOR, textTransform: 'uppercase', marginBottom: '.5rem' }}>Anecdotes lues</div>
        <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '4rem', fontWeight: 900, color: REC_COLOR, lineHeight: 1 }}>{stats.reads}</div>
        <div style={{ fontSize: '.72rem', color: 'var(--ink3)', marginTop: '.3rem' }}>≈ {stats.totalMin} min de lecture</div>
      </div>

      {/* Stats grid */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '.75rem', marginBottom: '1rem' }}>
        {[
          { ico: '🎯', val: stats.quizzes, lbl: 'Quiz joués', color: '#00c8ff' },
          { ico: '📈', val: stats.avgPct + '%', lbl: 'Moy. quiz', color: '#34d399' },
          { ico: '⚡', val: '+' + stats.xpGained, lbl: 'XP gagnés', color: '#fbbf24' },
          { ico: '🔥', val: stats.streak + 'j', lbl: 'Streak actuel', color: '#f97316' },
        ].map((s, i) => (
          <div key={i} style={{ background: `color-mix(in srgb,${s.color} 7%,var(--bg))`, border: `1px solid color-mix(in srgb,${s.color} 20%,transparent)`, borderRadius: '1rem', padding: '1.1rem', textAlign: 'center' }}>
            <div style={{ fontSize: '1.2rem', marginBottom: '.3rem' }}>{s.ico}</div>
            <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.6rem', fontWeight: 800, color: s.color, lineHeight: 1 }}>{s.val}</div>
            <div style={{ fontSize: '.58rem', color: 'var(--ink3)', marginTop: '.25rem', textTransform: 'uppercase', letterSpacing: '.08em' }}>{s.lbl}</div>
          </div>
        ))}
      </div>

      {/* Top thème */}
      <div style={{ background: 'var(--s1)', border: '1px solid var(--b1)', borderRadius: '1rem', padding: '1rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '1rem' }}>
        <span style={{ fontSize: '2rem' }}>🏷️</span>
        <div>
          <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.12em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.2rem' }}>Top thème</div>
          <div style={{ fontFamily: 'Space Grotesk,sans-serif', fontSize: '1.1rem', fontWeight: 700, color: 'var(--ink)' }}>{stats.topTheme}</div>
        </div>
      </div>

      {/* Share */}
      <button onClick={() => { const t = `Ma semaine sur La Curiosphère 📚\n${stats.reads} anecdotes lues · ${stats.quizzes} quiz · +${stats.xpGained} XP\nRang ${rank.label} · ${stats.streak}j de streak 🔥`; navigator.clipboard.writeText(t).then(() => alert('Recap copié !')); }} style={{ width: '100%', padding: '.8rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.75rem', fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', background: `${REC_COLOR}14`, border: `1px solid ${REC_COLOR}40`, borderRadius: '.85rem', color: REC_COLOR, cursor: 'pointer' }}>📤 Partager mon recap</button>
    </div>
  );

function NotifButton() {
  const [perm, setPerm] = useState(() => typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
  const [preview, setPreview] = useState(false);

  async function requestPerm() {
    if (typeof Notification === 'undefined') return;
    const result = await Notification.requestPermission();
    setPerm(result);
    if (result === 'granted') {
      setPreview(true);
      new Notification('La Curiosphère 🌍', { body: "L'anecdote du jour est disponible. Viens apprendre quelque chose de nouveau !", icon: '/favicon.ico' });
    }
  }

  const states = {
    granted: { lbl: '🔔 Notifs actives', color: '#34d399', bg: 'rgba(52,211,153,.06)', border: 'rgba(52,211,153,.2)' },
    denied:  { lbl: '🔕 Notifs bloquées', color: '#f87171', bg: 'rgba(248,113,113,.06)', border: 'rgba(248,113,113,.2)' },
    default: { lbl: '🔔 Activer les notifs', color: '#00c8ff', bg: 'rgba(0,200,255,.06)', border: 'rgba(0,200,255,.2)' },
    unsupported: { lbl: '🔔 Notifs', color: 'var(--ink3)', bg: 'transparent', border: 'var(--b2)' },
  };
  const s = states[perm] || states.default;

  return (
    <button onClick={perm === 'default' ? requestPerm : undefined}
      style={{ flex: 1, padding: '.75rem', fontFamily: 'Space Grotesk,sans-serif', fontSize: '.68rem', fontWeight: 700, letterSpacing: '.06em', textTransform: 'uppercase', background: s.bg, border: `1px solid ${s.border}`, borderRadius: '.85rem', color: s.color, cursor: perm === 'default' ? 'pointer' : 'default' }}>
      {s.lbl}
    </button>
  );
}

function EditProfileDrawer({ open, onClose, onSave }) {
  const saved = JSON.parse(localStorage.getItem('profile_edit') || '{}');
  const [username, setUsername] = useState(saved.username || localStorage.getItem('proto_username') || '');
  const [bio, setBio] = useState(saved.bio || '');
  const [avatarSrc, setAvatarSrc] = useState(saved.avatarSrc || null);
  const [color, setColor] = useState(saved.color || '#00c8ff');
  const [dragOver, setDragOver] = useState(false);
  const [notifs, setNotifs] = useState(saved.notifs || { anecdote: true, streak: true, defi: true, recap: false });
  const fileRef = useRef(null);

  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => setAvatarSrc(e.target.result);
    reader.readAsDataURL(file);
  }

  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState('');

  async function save() {
    const uname = username.trim();
    if (uname.length < 2) { setSaveErr('Pseudo trop court (2 caractères min)'); return; }
    setSaving(true); setSaveErr('');
    try {
      const uid = (await sb.auth.getUser()).data?.user?.id;
      if (uid) {
        // Pseudo déjà pris par quelqu'un d'autre ?
        const { data: clash } = await sb.from('profiles').select('id').ilike('username', uname).neq('id', uid).maybeSingle();
        if (clash) { setSaveErr('Ce pseudo est déjà pris'); setSaving(false); return; }
        const { error } = await sb.from('profiles').update({ username: uname, bio: bio || null }).eq('id', uid);
        if (error) throw error;
      }
      const data = { username: uname, bio, avatarSrc, color, notifs };
      localStorage.setItem('profile_edit', JSON.stringify(data));
      localStorage.setItem('proto_username', uname);
      onSave(data);
      onClose();
    } catch (e) { setSaveErr(e.message || 'Erreur lors de la sauvegarde'); }
    setSaving(false);
  }

  if (!open) return null;

  return (
    <>
      <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.5)', zIndex: 8000 }} onClick={onClose} />
      <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'var(--s1)', borderTop: `2px solid ${color}50`, borderRadius: '1.5rem 1.5rem 0 0', zIndex: 8001, maxHeight: '88vh', overflowY: 'auto', padding: '1.25rem 1.25rem 2.5rem' }}>
        {/* Handle */}
        <div style={{ width: 40, height: 4, background: 'var(--b2)', borderRadius: '2px', margin: '0 auto .75rem' }} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
          <div style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--ink)', fontFamily: 'Space Grotesk,sans-serif' }}>Modifier le profil</div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: 'var(--ink3)', cursor: 'pointer', fontSize: '1.1rem' }}>✕</button>
        </div>

        {/* Avatar */}
        <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.6rem' }}>Avatar</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1.25rem' }}>
          <div
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}

            style={{ width: 72, height: 72, borderRadius: '50%', border: `2px dashed ${dragOver ? color : 'var(--b2)'}`, background: dragOver ? color + '10' : 'var(--s2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', flexShrink: 0, transition: 'border-color .2s' }}>
            {avatarSrc
              ? <img src={avatarSrc} style={{ width: '100%', height: '100%', objectFit: 'cover' }} alt="avatar" />
              : <span style={{ fontSize: '.65rem', color: 'var(--ink3)', textAlign: 'center', lineHeight: 1.4 }}>📷<br/>Dépose<br/>ici</span>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleFile(e.target.files[0])} />

            <div style={{ fontSize: '.78rem', color: 'var(--ink2)', marginBottom: '.3rem' }}>Glisse une photo ou clique pour choisir</div>

        {/* Username */}
        <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.45rem' }}>Pseudo</div>

        <div style={{ display: 'flex', gap: '.5rem', marginBottom: '1.25rem' }}>

            <button key={c.id} onClick={() => setColor(c.hex)} style={{ width: 32, height: 32, borderRadius: '50%', background: c.hex, border: color === c.hex ? `3px solid #fff` : '3px solid transparent', cursor: 'pointer', boxShadow: color === c.hex ? `0 0 0 2px ${c.hex}` : 'none', transition: 'all .15s' }} title={c.lbl} />
          ))}
        </div>

        {/* Notifications */}
        <div style={{ fontSize: '.56rem', fontWeight: 700, letterSpacing: '.14em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: '.65rem' }}>Notifications</div>
        <div style={{ background: 'var(--s2)', borderRadius: '1rem', overflow: 'hidden', marginBottom: '1.5rem' }}>
          {[
            { key: 'anecdote', ico: '📖', lbl: 'Anecdote du jour', desc: 'Tous les matins à 9h' },
            { key: 'streak', ico: '🔥', lbl: 'Rappel streak', desc: 'Si pas encore lu à 20h' },
            { key: 'defi', ico: '⚔️', lbl: 'Défi reçu', desc: 'Quand un ami t\'envoie un défi' },
            { key: 'recap', ico: '📊', lbl: 'Recap hebdo', desc: 'Chaque vendredi soir' },
          ].map((n, i, arr) => (
            <div key={n.key} style={{ display: 'flex', alignItems: 'center', gap: '.75rem', padding: '.75rem 1rem', borderBottom: i < arr.length - 1 ? '1px solid var(--b1)' : 'none' }}>
              <span style={{ fontSize: '1rem', flexShrink: 0 }}>{n.ico}</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: '.82rem', fontWeight: 600, color: 'var(--ink)' }}>{n.lbl}</div>
                <div style={{ fontSize: '.62rem', color: 'var(--ink3)' }}>{n.desc}</div>
