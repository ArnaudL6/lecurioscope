<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Le Curioscope</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg:#0a0a1a; --surface:#111128; --surface2:#1a1a35; --border:#2a2a5a;
  --accent:#7c6aff; --accent2:#a78bfa; --gold:#ffd700;
  --green:#22c55e; --red:#ef4444; --orange:#f97316;
  --text:#e2e8f0; --text2:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;font-size:15px}

/* ── Auth screens ── */
#loading,#auth-error{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;text-align:center;padding:2rem}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Layout ── */
#app{display:none;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:1rem}
.topbar h1{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.topbar .right{display:flex;align-items:center;gap:.75rem;font-size:.82rem;color:var(--text2)}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 1.5rem;gap:.25rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.7rem 1.1rem;cursor:pointer;color:var(--text2);font-size:.875rem;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
.content{padding:1.5rem;max-width:960px;margin:0 auto}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:.75rem;padding:1.25rem;margin-bottom:1rem}
.card h3{font-size:.9rem;font-weight:700;margin-bottom:1rem;color:var(--accent2);display:flex;align-items:center;gap:.5rem}
.card p.hint{font-size:.8rem;color:var(--text2);margin-bottom:1rem;line-height:1.5}

/* ── Stats grid ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.75rem;margin-bottom:1.25rem}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:.75rem;padding:1rem;text-align:center}
.stat .val{font-size:1.9rem;font-weight:800;color:var(--accent2);display:block;line-height:1}
.stat .lbl{font-size:.72rem;color:var(--text2);margin-top:.4rem;line-height:1.3}

/* ── Buttons ── */
.btn{padding:.5rem 1rem;border:none;border-radius:.5rem;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.btn-sm{padding:.3rem .65rem;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

/* ── Toggle ── */
.toggle{position:relative;display:inline-block;width:42px;height:23px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:23px;transition:.25s}
.toggle .slider:before{content:'';position:absolute;width:17px;height:17px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(19px)}

/* ── Form ── */
.frow{margin-bottom:.75rem}
.frow label,.flabel{font-size:.78rem;color:var(--text2);display:block;margin-bottom:.3rem}
input[type=text],input[type=date],textarea,select{
  background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;
  color:var(--text);padding:.45rem .7rem;font-size:.85rem;width:100%;font-family:inherit
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:75px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}

/* ── Hub preview cards ── */
.hub-preview-list{display:flex;flex-direction:column;gap:.55rem}
.hub-card{background:var(--surface2);border-radius:.875rem;border:1px solid var(--border);border-left:3px solid var(--border);padding:.8rem .9rem;display:flex;align-items:flex-start;gap:.7rem;transition:opacity .2s,box-shadow .15s}
.hub-card.off{opacity:.3}
.hub-card.dragging{opacity:.25;border-left-style:dashed;pointer-events:none}
.hub-card.drag-over{box-shadow:0 0 0 2px #7c6aff44;background:rgba(124,106,255,.05)}
.hub-drag{cursor:grab;color:var(--text2);font-size:1.15rem;padding:.2rem .3rem;border-radius:.35rem;user-select:none;-webkit-user-select:none;flex-shrink:0;margin-top:.1rem}
.hub-drag:hover{color:var(--accent2);background:rgba(124,106,255,.12)}
.hub-drag:active{cursor:grabbing}
.hub-card-inner{flex:1;min-width:0}
.hub-card-top{display:flex;align-items:center;gap:.4rem;margin-bottom:.28rem;flex-wrap:wrap}
.hub-rank{font-size:.58rem;font-weight:800;padding:.08rem .38rem;border-radius:999px;letter-spacing:.05em}
.hub-xp{font-size:.63rem;font-weight:700;color:var(--text2)}
.hub-type-tag{font-size:.6rem;font-weight:700;padding:.08rem .38rem;border-radius:999px}
.hub-card-title{display:flex;align-items:center;gap:.45rem;margin-bottom:.18rem}
.hub-card-desc{font-size:.72rem;color:var(--text2);margin-bottom:.2rem}
.hub-card-edit{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.28rem;align-items:center}
.hub-card-edit input[type=text]{font-size:.74rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.4rem;color:var(--text);padding:.2rem .45rem}
.hub-card-edit input[type=color]{width:30px;height:28px;padding:.12rem;border-radius:.35rem;background:rgba(255,255,255,.04);border:1px solid var(--border);cursor:pointer}
.hub-card-actions{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;padding-top:.1rem}
/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:.55rem .7rem;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:.55rem .7rem;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:.15rem .5rem;border-radius:.3rem;font-size:.7rem;font-weight:700}
.badge-admin{background:#7c6aff;color:#fff}
.badge-mod{background:#f59e0b;color:#000}
.badge-user{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* ── Setup box ── */
.setup-box{background:#12201a;border:1px solid #1e4a2a;border-radius:.75rem;padding:1.25rem}
.setup-box h4{color:#86efac;margin-bottom:.75rem;font-size:.9rem}
.setup-box pre{background:#0a1a10;border-radius:.5rem;padding:.85rem;font-size:.75rem;color:#d1fae5;overflow-x:auto;margin:.5rem 0;white-space:pre-wrap;word-break:break-all}

/* ── Toast ── */
#toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--surface2);border:1px solid var(--border);border-radius:.65rem;padding:.65rem 1.1rem;font-size:.875rem;z-index:9999;transform:translateY(120px);transition:transform .28s;max-width:300px;pointer-events:none}
#toast.show{transform:translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* ── Code inline ── */
code{background:var(--surface2);padding:.1rem .4rem;border-radius:.3rem;font-size:.82rem;font-family:monospace}
a.link{color:var(--accent2);text-decoration:none}.a.link:hover{text-decoration:underline}

/* ── Login screen ── */
#login-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.25rem;padding:2rem;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:1rem;padding:2rem;width:100%;max-width:380px}
.login-box h2{font-size:1.1rem;font-weight:700;margin-bottom:1.5rem;text-align:center;color:var(--accent2)}
.login-logo{font-size:2.5rem;text-align:center;margin-bottom:.5rem}
.login-field{margin-bottom:.9rem}
.login-field label{font-size:.78rem;color:var(--text2);display:block;margin-bottom:.35rem}
.login-field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:.5rem;color:var(--text);padding:.55rem .8rem;font-size:.9rem;font-family:inherit;transition:border-color .2s}
.login-field input:focus{outline:none;border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:.5rem;padding:.65rem;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:.5rem;transition:background .2s}
.login-btn:hover{background:var(--accent2)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{color:var(--red);font-size:.8rem;text-align:center;margin-top:.5rem;min-height:1.2em}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div style="color:var(--text2);margin-top:.5rem">Vérification de session…</div></div>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">⚙️</div>
    <h2>Admin — Le Curioscope</h2>
    <div class="login-field">
      <label>ID de connexion</label>
      <input type="text" id="li-id" placeholder="votre_id" autocomplete="username" />
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="li-pw" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="login-btn" id="li-btn" onclick="doLogin()">Se connecter</button>
    <div class="login-err" id="li-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>⚙️ Admin <span style="color:var(--text2);font-weight:400">Le Curioscope</span></h1>
    <div class="right">
      <span id="user-name-lbl" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <a href="/" style="color:var(--accent2)">← Voir le site</a>
      <button class="btn btn-ghost btn-sm" onclick="doSignOut()">Déco</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="go('stats',this)">📊 Stats</div>
    <div class="tab" onclick="go('hub',this)">🏠 Hub</div>
    <div class="tab" onclick="go('content',this)">✍️ Contenu</div>
    <div class="tab" onclick="go('flags',this)">🚩 Fonctions</div>
    <div class="tab" onclick="go('banner',this)">📢 Bannière</div>
    <div class="tab" onclick="go('users',this)">👥 Utilisateurs</div>
    <div class="tab" onclick="go('setup',this)">🛠️ Setup</div>
    <div class="tab" onclick="go('accounts',this)">👤 Comptes</div>
  </div>

  <div class="content" id="pane"></div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// Config
// ═══════════════════════════════════════
const SB_URL  = 'https://zryrfmothjhywkklmniw.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyeXJmbW90aGpoeXdra2xtbml3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTYzNjEsImV4cCI6MjA5NDkzMjM2MX0.BWsZ5nXj8ePlB577zozrSO3voroRp8wkqGvM9MExaDg';
const APP_URL = 'https://lecurioscope.pages.dev';
const TODAY  = () => new Date().toISOString().slice(0,10);
const SESSION_KEY = 'adminSess_v1';

const sb = supabase.createClient(SB_URL, SB_ANON);
let me = null; // {id, display_name}

// ═══════════════════════════════════════
// Auth — ID / mot de passe (PBKDF2)
// ═══════════════════════════════════════
async function pbkdf2Hash(password, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits   = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: enc.encode(salt), iterations:120000, hash:'SHA-256' }, keyMat, 256
  );
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

async function loadAdminAccounts() {
  const { data } = await sb.from('app_config').select('value').eq('key','admin_accounts').maybeSingle();
  if (!data?.value) return [];
  try { const p = JSON.parse(data.value); return Array.isArray(p) ? p : []; }
  catch(e) { return []; }
}

async function saveAdminAccounts(accounts) {
  await sb.from('app_config').upsert({ key:'admin_accounts', value: JSON.stringify(accounts) }, { onConflict:'key' });
}

async function boot() {
  // Session existante ?
  const sess = sessionStorage.getItem(SESSION_KEY);
  if (sess) {
    try { me = JSON.parse(sess); showApp(); return; } catch(e) {}
  }
  // Aucun compte → premier démarrage
  const accounts = await loadAdminAccounts();
  document.getElementById('loading').style.display = 'none';
  if (accounts.length === 0) { showFirstSetup(); }
  else { document.getElementById('login-screen').style.display = 'flex'; }
}

function showApp() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name-lbl').textContent = me.display_name || me.id;
  go('stats', document.querySelector('.tab'));
}

async function doLogin() {
  const id  = document.getElementById('li-id').value.trim().toLowerCase();
  const pw  = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  const btn = document.getElementById('li-btn');
  if (!id || !pw) { err.textContent = 'Remplis les deux champs.'; return; }
  btn.disabled = true; btn.textContent = 'Connexion…'; err.textContent = '';
  try {
    const accounts = await loadAdminAccounts();
    const acct = accounts.find(a => a.id === id && a.active !== false);
    if (!acct) { err.textContent = 'ID inconnu ou compte désactivé.'; btn.disabled=false; btn.textContent='Se connecter'; return; }
    const hash = await pbkdf2Hash(pw, acct.salt);
    if (hash !== acct.hash) { err.textContent = 'Mot de passe incorrect.'; btn.disabled=false; btn.textContent='Se connecter'; return; }
    me = { id: acct.id, display_name: acct.display_name || acct.id };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(me));
    showApp();
  } catch(e) {
    err.textContent = 'Erreur réseau. Réessaie.';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

function doSignOut() {
  sessionStorage.removeItem(SESSION_KEY);
  window.location.reload();
}

function showFirstSetup() {
  document.querySelector('.login-box').innerHTML = `
    <div class="login-logo">🛡️</div>
    <h2>Créer le premier compte</h2>
    <p style="font-size:.8rem;color:var(--text2);text-align:center;margin-bottom:1.25rem">
      Aucun compte admin trouvé. Crée le tien pour accéder au panel.
    </p>
    <div class="login-field"><label>ID de connexion</label><input type="text" id="setup-id" placeholder="arnaud" /></div>
    <div class="login-field"><label>Nom affiché</label><input type="text" id="setup-name" placeholder="Arnaud" /></div>
    <div class="login-field"><label>Mot de passe (8 chars min)</label><input type="password" id="setup-pw" placeholder="••••••••" /></div>
    <div class="login-field"><label>Confirmer</label><input type="password" id="setup-pw2" placeholder="••••••••" /></div>
    <button class="login-btn" id="setup-btn" onclick="doFirstSetup()">Créer le compte</button>
    <div class="login-err" id="setup-err"></div>
  `;
  document.getElementById('login-screen').style.display = 'flex';
}

async function doFirstSetup() {
  const id   = document.getElementById('setup-id').value.trim().toLowerCase();
  const name = document.getElementById('setup-name').value.trim();
  const pw   = document.getElementById('setup-pw').value;
  const pw2  = document.getElementById('setup-pw2').value;
  const err  = document.getElementById('setup-err');
  const btn  = document.getElementById('setup-btn');
  if (!id || !pw)    { err.textContent='Remplis tous les champs.'; return; }
  if (pw !== pw2)    { err.textContent='Les mots de passe ne correspondent pas.'; return; }
  if (pw.length < 8) { err.textContent='Mot de passe trop court (8 chars min).'; return; }
  btn.disabled = true; btn.textContent = 'Création…';
  const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
  const hash = await pbkdf2Hash(pw, salt);
  await saveAdminAccounts([{ id, display_name: name||id, salt, hash, active:true, created_at: new Date().toISOString() }]);
  me = { id, display_name: name||id };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(me));
  showApp();
}

// ═══════════════════════════════════════
// Tab router
// ═══════════════════════════════════════
const TABS = { stats, hub, content: contentTab, flags, banner, users, setup, accounts };
function go(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const pane = document.getElementById('pane');
  pane.innerHTML = '<div style="color:var(--text2);text-align:center;padding:3rem">Chargement…</div>';
  TABS[name]?.(pane);
}

// ═══════════════════════════════════════
// Stats
// ═══════════════════════════════════════
async function stats(pane) {
  const today = TODAY();
  const [usersR, duelsR, anecR, enigR] = await Promise.all([
    sb.from('profiles').select('id', { count:'exact', head:true }),
    sb.from('duels').select('id', { count:'exact', head:true }).eq('status','active'),
    sb.from('anecdotes').select('id',{count:'exact',head:true}).eq('date',today),
    sb.from('daily_enigmas').select('id',{count:'exact',head:true}).eq('date',today),
  ]);

  const { data: recentUsers } = await sb.from('profiles')
    .select('username,joined,role,streak_record')
    .order('joined',{ascending:false}).limit(8);

  const { data: recentAnec } = await sb.from('anecdotes')
    .select('date,theme,anecdote,chooser').order('date',{ascending:false}).limit(5);

  pane.innerHTML = `
    <div class="stats-grid">
      <div class="stat"><span class="val">${usersR.count ?? '—'}</span><span class="lbl">Chasseurs inscrits</span></div>
      <div class="stat"><span class="val">${duelsR.count ?? '—'}</span><span class="lbl">Duels actifs</span></div>
      <div class="stat"><span class="val">${anecR.count ? '✅' : '❌'}</span><span class="lbl">Anecdote aujourd'hui</span></div>
      <div class="stat"><span class="val">${enigR.count ? '✅' : '❌'}</span><span class="lbl">Énigme aujourd'hui</span></div>
    </div>

    <div class="card">
      <h3>👥 Derniers inscrits</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Pseudo</th><th>Rôle</th><th>Streak record</th><th>Inscription</th></tr></thead>
        <tbody>
          ${(recentUsers||[]).map(u=>`<tr>
            <td>${esc(u.username||'—')}</td>
            <td><span class="badge badge-${u.role||'user'}">${u.role||'user'}</span></td>
            <td>${u.streak_record||0}j</td>
            <td style="color:var(--text2)">${u.joined ? new Date(u.joined).toLocaleDateString('fr-FR') : '—'}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="card">
      <h3>📰 Dernières anecdotes</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Thème</th><th>Extrait</th><th>Auteur</th></tr></thead>
        <tbody>
          ${(recentAnec||[]).map(a=>`<tr>
            <td><code>${a.date}</code></td>
            <td>${esc(a.theme||'—')}</td>
            <td style="color:var(--text2);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((a.anecdote||'').slice(0,80))}…</td>
            <td>${esc(a.chooser||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  `;
}

// ═══════════════════════════════════════
// Hub Config
// ═══════════════════════════════════════
const HUB_DEFAULT = [
  {id:'daily-anecdote',title:'Le Saviez-Vous ?',icon:'💡',rank:'E',color:'#7c6aff',xp:'+50 XP',desc:"L'anecdote du jour",type:'gate',enabled:true},
  {id:'daily-enigme',title:'Crack le Code !',icon:'🔐',rank:'B',color:'#f59e0b',xp:'+150 XP',desc:'Énigme quotidienne',type:'gate',enabled:true},
  {id:'daily-quiz',title:'Quiz',icon:'🎯',rank:'C',color:'#22c55e',xp:'+100 XP',desc:'Questions du jour',type:'gate',enabled:true},

function modHtml(m, i) {
  const typeLabels = {gate:'Quête', section:'Section', locked:'Portail'};
  const typeColors = {gate:'#7c6aff', section:'#ef4444', locked:'#64748b'};
  const col = m.color || '#7c6aff';
  const tc = typeColors[m.type] || '#7c6aff';
  const isGate = m.type === 'gate';
  const parts = [
    '<div class="hub-card'+(m.enabled?'':' off')+'" id="mi'+i+'" draggable="true" data-idx="'+i+'">',
    '<span class="hub-drag" title="Glisser pour réordonner">⠷</span>',
    '<div class="hub-card-inner">',
    '<div class="hub-card-top">',
    '<span class="hub-rank" style="background:'+col+'22;color:'+col+'">'  +esc(m.rank||'?')+'</span>',
    (m.xp ? '<span class="hub-xp">'+esc(m.xp)+'</span>' : ''),
    '<span class="hub-type-tag" style="background:'+tc+'22;color:'+tc+'">'+(typeLabels[m.type]||m.type)+'</span>',
    '</div>',
    '<div class="hub-card-title">',
    '<span style="font-size:1.15rem;line-height:1">'+esc(m.icon||'⭐')+'</span>',
    '<span style="font-size:.88rem;font-weight:700">'+esc(m.title||'')+'</span>',
    '</div>',
    '<div class="hub-card-desc">'+esc(m.desc||'')+'</div>',
  ];
  if (isGate) {
    parts.push(
      '<div class="hub-card-edit">',
      '<input type="text" value="'+esc(m.icon||'')+'" style="width:48px;text-align:center" placeholder="🎯" oninput="upd('+i+',\'icon\',this.value)" title="Icône">',
      '<input type="text" value="'+esc(m.title||'')+'" placeholder="Titre" oninput="upd('+i+',\'title\',this.value)" style="flex:1;min-width:90px">',
      '<input type="color" value="'+col+'" oninput="upd('+i+',\'color\',this.value)" title="Couleur">',
      '</div>'
    );
  }
  parts.push(
    '</div>',
    '<div class="hub-card-actions">',
    '<label class="toggle" title="'+(m.enabled?'Désactiver':'Activer')+'">',
    '<input type="checkbox"'+(m.enabled?' checked':'')+' onchange="togMod('+i+',this.checked)">',
    '<span class="slider"></span></label>',
    '</div></div>'
  );
  return parts.join('');
}

function enableDnD() {
  const list = document.getElementById('mod-list');
  if (!list) return;
  let dragged = null;
  list.querySelectorAll('.hub-card').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragged = item;
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => item.classList.add('dragging'));
    });
    item.addEventListener('dragend', () => {
      if (dragged) dragged.classList.remove('dragging');
      list.querySelectorAll('.hub-card').forEach(el => el.classList.remove('drag-over'));
      const newOrder = [];
      list.querySelectorAll('.hub-card').forEach(el => {
        const idx = parseInt(el.dataset.idx);
        if (!isNaN(idx) && hubMods[idx]) newOrder.push(Object.assign({}, hubMods[idx]));
      });
      if (newOrder.length === hubMods.length) {
        hubMods = newOrder;
        list.innerHTML = hubMods.map((m,i) => modHtml(m,i)).join('');
        enableDnD();
      }
      dragged = null;
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      if (!dragged || dragged === item) return;
      list.querySelectorAll('.hub-card').forEach(el => el.classList.remove('drag-over'));
      item.classList.add('drag-over');
      const rect = item.getBoundingClientRect();
      list.insertBefore(dragged, e.clientY > rect.top + rect.height/2 ? item.nextSibling : item);
    });
    item.addEventListener('dragleave', e => {
      if (!item.contains(e.relatedTarget)) item.classList.remove('drag-over');
    });
  });
}

function upd(i, k, v) { hubMods[i][k] = v; }
function togMod(i, v) {
  hubMods[i].enabled = v;
  const el = document.getElementById('mi'+i);
  if (el) el.classList.toggle('off', !v);
}
function resetHub() {
  if (!confirm('Réinitialiser les modules Hub par défaut ?')) return;
  hubMods = HUB_DEFAULT.map(m => Object.assign({}, m));
  renderHub(document.getElementById('pane'));
}

// Comptes Admin
// ═══════════════════════════════════════
async function accounts(pane) {
  const accts = await loadAdminAccounts();
  const rows = accts.map(a => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:.65rem 0;border-bottom:1px solid var(--border)">
      <div>
        <span style="font-weight:700">${esc(a.id)}</span>
        ${a.display_name && a.display_name !== a.id ? `<span style="color:var(--text2);font-size:.82rem"> — ${esc(a.display_name)}</span>` : ''}
        ${!a.active ? '<span class="badge" style="background:var(--red);color:#fff;margin-left:.4rem">Désactivé</span>' : ''}
        ${a.id === me.id ? '<span class="badge badge-admin" style="margin-left:.4rem">Moi</span>' : ''}
        <span style="color:var(--text2);font-size:.72rem;margin-left:.5rem">${a.created_at ? a.created_at.slice(0,10) : ''}</span>
      </div>
      <div style="display:flex;gap:.4rem;flex-shrink:0">
        ${a.id !== me.id ? `
          <button class="btn btn-ghost btn-sm" onclick="toggleAccount('${esc(a.id)}',${!a.active})">${a.active?'Désactiver':'Activer'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteAccount('${esc(a.id)}')">Suppr.</button>
        ` : ''}
        <button class="btn btn-ghost btn-sm" onclick="showChangePw('${esc(a.id)}')">🔑 MDP</button>
      </div>
    </div>
  `).join('');

  pane.innerHTML = `
    <div class="card">
      <h3>👤 Comptes Admin</h3>
      <p class="hint">Gère les accès au panel. Login = ID + mot de passe, haché avec PBKDF2-SHA256.</p>
      <div id="accts-list">
        ${accts.length ? rows : '<p style="color:var(--text2);font-size:.82rem">Aucun compte.</p>'}
      </div>
    </div>

    <div class="card">
      <h3>➕ Nouveau compte</h3>
      <div class="fgrid">
        <div class="frow"><label class="flabel">ID de connexion</label><input type="text" id="new-acct-id" placeholder="jean" /></div>
        <div class="frow"><label class="flabel">Nom affiché</label><input type="text" id="new-acct-name" placeholder="Jean Dupont" /></div>
      </div>
      <div class="frow"><label class="flabel">Mot de passe (8 chars min)</label><input type="password" id="new-acct-pw" placeholder="••••••••" /></div>
      <div class="btn-row"><button class="btn btn-primary" onclick="createAdminAccount()">Créer le compte</button></div>
    </div>

    <div id="change-pw-box" style="display:none" class="card">
      <h3>🔑 Changer le mot de passe — <span id="cpw-name" style="color:var(--text2)"></span></h3>
      <input type="hidden" id="cpw-id" />
      <div class="frow"><label class="flabel">Nouveau mot de passe</label><input type="password" id="cpw-pw" placeholder="••••••••" /></div>
      <div class="frow"><label class="flabel">Confirmer</label><input type="password" id="cpw-pw2" placeholder="••••••••" /></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="doChangePw()">Enregistrer</button>
        <button class="btn btn-ghost" onclick="document.getElementById('change-pw-box').style.display='none'">Annuler</button>
      </div>
    </div>
  `;
}

async function createAdminAccount() {
  const id   = document.getElementById('new-acct-id').value.trim().toLowerCase();
  const name = document.getElementById('new-acct-name').value.trim();
  const pw   = document.getElementById('new-acct-pw').value;
  if (!id || !pw)    { toast('Remplis ID et mot de passe.','err'); return; }
  if (pw.length < 8) { toast('Mot de passe trop court (8 chars min).','err'); return; }
  const accts = await loadAdminAccounts();
  if (accts.find(a=>a.id===id)) { toast('Cet ID existe déjà.','err'); return; }
  const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
  const hash = await pbkdf2Hash(pw, salt);
  accts.push({ id, display_name: name||id, salt, hash, active:true, created_at: new Date().toISOString() });
  await saveAdminAccounts(accts);
  toast('Compte créé !','ok');
  go('accounts', document.querySelector('.tab.active'));
}

async function toggleAccount(id, activate) {
  const accts = await loadAdminAccounts();
  const a = accts.find(x=>x.id===id); if(a) a.active = activate;
  await saveAdminAccounts(accts);
  toast(activate ? 'Compte activé.' : 'Compte désactivé.','ok');
  go('accounts', document.querySelector('.tab.active'));
}

async function deleteAccount(id) {
  if (!confirm(`Supprimer le compte "${id}" ?`)) return;
  await saveAdminAccounts((await loadAdminAccounts()).filter(a=>a.id!==id));
  toast('Compte supprimé.','ok');
  go('accounts', document.querySelector('.tab.active'));
}

function showChangePw(id) {
  document.getElementById('change-pw-box').style.display = 'block';
  document.getElementById('cpw-id').value   = id;
  document.getElementById('cpw-name').textContent = id;
  document.getElementById('cpw-pw').value  = '';
  document.getElementById('cpw-pw2').value = '';
  document.getElementById('change-pw-box').scrollIntoView({behavior:'smooth'});
}

async function doChangePw() {
  const id  = document.getElementById('cpw-id').value;
  const pw  = document.getElementById('cpw-pw').value;
  const pw2 = document.getElementById('cpw-pw2').value;
  if (pw.length < 8) { toast('Mot de passe trop court.','err'); return; }
  if (pw !== pw2)    { toast('Les mots de passe ne correspondent pas.','err'); return; }
  const accts = await loadAdminAccounts();
  const a = accts.find(x=>x.id===id);
  if (!a) { toast('Compte introuvable.','err'); return; }
  const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
  a.salt = salt; a.hash = await pbkdf2Hash(pw, salt);
  await saveAdminAccounts(accts);
  toast('Mot de passe changé !','ok');
  document.getElementById('change-pw-box').style.display = 'none';
}

// ═══════════════════════════════════════
// Utils
// ═══════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _toTimer;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  clearTimeout(_toTimer); _toTimer=setTimeout(()=>t.className='',3200);
}

// ── Boot ──
boot();
</script>
</body>
</html>
