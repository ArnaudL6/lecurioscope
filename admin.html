// Auth â ID / mot de passe (PBKDF2)

async function pbkdf2Hash(password, salt) {
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits   = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt: enc.encode(salt), iterations:120000, hash:'SHA-256' }, keyMat, 256
  );
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

async function doLogin() {
  const id  = document.getElementById('li-id').value.trim().toLowerCase();
  const pw  = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  const btn = document.getElementById('li-btn');
  if (!id || !pw) { err.textContent = 'Remplis les deux champs.'; return; }
  btn.disabled = true; btn.textContent = 'Connexionâ¦'; err.textContent = '';
  try {
    const accounts = await loadAdminAccounts();
    const acct = accounts.find(a => a.id === id && a.active !== false);
    if (!acct) { err.textContent = 'ID inconnu ou compte dÃ©sactivÃ©.'; btn.disabled=false; btn.textContent='Se connecter'; return; }
    const hash = await pbkdf2Hash(pw, acct.salt);
    if (hash !== acct.hash) { err.textContent = 'Mot de passe incorrect.'; btn.disabled=false; btn.textContent='Se connecter'; return; }
    me = { id: acct.id, display_name: acct.display_name || acct.id };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(me));
    showApp();
  } catch(e) {
    err.textContent = 'Erreur reseau. Reessaie.';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

async function doFirstSetup() {
  const id   = document.getElementById('setup-id').value.trim().toLowerCase();

  if (pw.length < 8) { err.textContent='Mot de passe trop court (8 chars min).'; return; }
  btn.disabled = true; btn.textContent = 'CrÃ©ationâ¦';
  const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));

}

function moveHub(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= hubMods.length) return;
  [hubMods[i], hubMods[j]] = [hubMods[j], hubMods[i]];
  renderHub(document.getElementById('pane'));
}

function delMod(i) {
  if (!confirm('Supprimer "' + (hubMods[i]?.title||'ce module') + '" ?')) return;
  hubMods.splice(i, 1);
  renderHub(document.getElementById('pane'));
  toast('Module supprimÃ© â pense Ã  sauvegarder.','ok');
}

function enableDnD() {
  ['mod-list-gates','mod-list-sections'].forEach(listId => {
    const list = document.getElementById(listId);
    if (!list) return;
    let dragged = null;
    list.querySelectorAll('.hub-gate-row').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragged = item;
        e.dataTransfer.effectAllowed = 'move';
        requestAnimationFrame(() => item.querySelector('.hub-gate-card')?.classList.add('dragging'));
      });
      item.addEventListener('dragend', () => {
        list.querySelectorAll('.hub-gate-card').forEach(el => { el.classList.remove('dragging'); el.classList.remove('drag-over'); });
        const newOrder = [];
        document.querySelectorAll('.hub-gate-row').forEach(el => {
          const idx = parseInt(el.dataset.idx);
          if (!isNaN(idx) && hubMods[idx]) newOrder.push({...hubMods[idx]});
        });
        if (newOrder.length === hubMods.length) hubMods = newOrder;
        renderHub(document.getElementById('pane'));
        dragged = null;
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragged || dragged === item) return;
        list.querySelectorAll('.hub-gate-card').forEach(el => el.classList.remove('drag-over'));
        item.querySelector('.hub-gate-card')?.classList.add('drag-over');
        const rect = item.getBoundingClientRect();
        list.insertBefore(dragged, e.clientY > rect.top + rect.height/2 ? item.nextSibling : item);
      });
      item.addEventListener('dragleave', e => {
        if (!item.contains(e.relatedTarget)) item.querySelector('.hub-gate-card')?.classList.remove('drag-over');
      });
    });
  });
}

function togMod(i, checked) {
  if (!hubMods[i]) return;
  hubMods[i].enabled = checked;
  const card = document.querySelector(`#mi${i} .hub-gate-card`);
  if (card) card.classList.toggle('off', !checked);
}

function upd(i, key, val) {
  if (!hubMods[i]) return;
  hubMods[i][key] = val;
  if (key === 'icon') { const el = document.querySelector(`#mi${i} .hub-gate-icon`); if (el) el.textContent = val; }
  else if (key === 'title') { const el = document.querySelector(`#mi${i} .hub-gate-name`); if (el) el.textContent = val; }
  else if (key === 'desc') { const el = document.querySelector(`#mi${i} .hub-gate-desc`); if (el) el.textContent = val; }
}
