<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · La Curiosphère</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #07090f; --s0: #0d0f1c; --s1: #101320; --s2: #141728;
  --b1: rgba(255,255,255,.055); --b2: rgba(255,255,255,.10);
  --ink: #eef0f4; --ink2: #94a3b8; --ink3: #475569;
  --a: #00c8ff; --adim: rgba(0,200,255,.08); --aglow: rgba(0,200,255,.20);
  --gr: #34d399; --re: #f87171; --or: #f97316;
  --sidebar: 220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; font-size: 14px; }
#root { display: flex; flex-direction: column; min-height: 100vh; }

/* Layout */
.admin-layout { display: flex; min-height: calc(100vh - 52px); }
.admin-sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--s0); border-right: 1px solid var(--b1); position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; display: flex; flex-direction: column; }
.admin-main { flex: 1; min-width: 0; overflow-y: auto; padding: 1.5rem; background: var(--bg); }

/* Header */
.admin-header { position: sticky; top: 0; z-index: 100; height: 52px; background: rgba(7,9,15,.95); border-bottom: 1px solid rgba(0,200,255,.12); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; }
.admin-logo { font-size: .85rem; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: .5rem; }
.admin-logo .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--a); box-shadow: 0 0 8px var(--a); animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:.7} }
.admin-badge { font-size: .52rem; font-weight: 800; letter-spacing: .12em; color: var(--a); background: var(--adim); border: 1px solid rgba(0,200,255,.25); border-radius: 4px; padding: .15rem .45rem; text-transform: uppercase; margin-left: .25rem; }
.admin-user-chip { display: flex; align-items: center; gap: .5rem; font-size: .75rem; color: var(--ink2); }
.admin-logout { background: none; border: 1px solid var(--b2); border-radius: .5rem; color: var(--ink3); cursor: pointer; padding: .3rem .65rem; font-family: inherit; font-size: .7rem; transition: all .15s; }
.admin-logout:hover { border-color: var(--re); color: var(--re); }

/* Sidebar nav */
.sidebar-section { padding: .75rem .75rem .25rem; font-size: .52rem; font-weight: 700; letter-spacing: .14em; color: var(--ink3); text-transform: uppercase; }
.sidebar-item { display: flex; align-items: center; gap: .65rem; padding: .6rem .9rem; cursor: pointer; color: var(--ink3); font-size: .8rem; font-weight: 500; border-radius: .65rem; margin: .1rem .5rem; transition: all .15s; }
.sidebar-item:hover { background: var(--s1); color: var(--ink2); }
.sidebar-item.active { background: var(--adim); color: var(--a); border: 1px solid rgba(0,200,255,.15); }
.sidebar-item .ico { font-size: .95rem; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-sep { height: 1px; background: var(--b1); margin: .5rem .75rem; }
.sidebar-link { color: var(--ink3); font-size: .72rem; padding: .6rem .9rem; display: block; cursor: pointer; }
.sidebar-link:hover { color: var(--a); }

/* Cards */
.card { background: var(--s1); border: 1px solid var(--b1); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
.card-title { font-size: .65rem; font-weight: 700; letter-spacing: .15em; color: var(--ink3); text-transform: uppercase; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--s1); border: 1px solid var(--b1); border-radius: 1rem; padding: 1.1rem 1.25rem; position: relative; overflow: hidden; }
.stat-card::after { content: ''; position: absolute; top: -20px; right: -20px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, var(--card-color, rgba(0,200,255,.12)), transparent 70%); }
.stat-val { font-size: 2rem; font-weight: 800; color: var(--ink); line-height: 1; margin-bottom: .25rem; }
.stat-lbl { font-size: .65rem; color: var(--ink3); text-transform: uppercase; letter-spacing: .1em; }
.stat-change { font-size: .65rem; font-weight: 700; margin-top: .35rem; }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .8rem; }
th { text-align: left; padding: .55rem .75rem; color: var(--ink3); font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--b1); white-space: nowrap; }
td { padding: .6rem .75rem; border-bottom: 1px solid var(--b1); vertical-align: middle; color: var(--ink2); }
tr:hover td { background: var(--s2); }
.td-main { color: var(--ink); font-weight: 600; }

/* Badges */
.rank-badge { display: inline-flex; align-items: center; font-size: .6rem; font-weight: 800; letter-spacing: .1em; border: 1px solid; border-radius: 4px; padding: .1rem .35rem; text-transform: uppercase; }
.badge { display: inline-block; font-size: .65rem; font-weight: 700; padding: .2rem .5rem; border-radius: 999px; }
.badge-admin { background: rgba(251,191,36,.12); color: #fbbf24; border: 1px solid rgba(251,191,36,.25); }
.badge-mod { background: rgba(168,85,247,.12); color: #a855f7; border: 1px solid rgba(168,85,247,.25); }
.badge-user { background: var(--s2); color: var(--ink3); border: 1px solid var(--b1); }
.badge-ok { background: rgba(52,211,153,.12); color: #34d399; border: 1px solid rgba(52,211,153,.25); }
.badge-warn { background: rgba(249,115,22,.12); color: #f97316; border: 1px solid rgba(249,115,22,.25); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: .35rem; padding: .4rem .85rem; border-radius: .6rem; font-family: inherit; font-size: .75rem; font-weight: 700; cursor: pointer; border: none; transition: all .15s; }
.btn-primary { background: var(--a); color: #07090f; }
.btn-primary:hover { opacity: .85; }
.btn-ghost { background: transparent; color: var(--ink3); border: 1px solid var(--b2); }
.btn-ghost:hover { color: var(--ink); border-color: var(--b2); }
.btn-danger { background: rgba(248,113,113,.12); color: var(--re); border: 1px solid rgba(248,113,113,.25); }
.btn-danger:hover { background: rgba(248,113,113,.2); }
.btn-sm { padding: .25rem .55rem; font-size: .68rem; }
.btn:disabled { opacity: .35; cursor: default; }

/* Form */
.form-group { margin-bottom: .85rem; }
.form-label { font-size: .65rem; font-weight: 700; letter-spacing: .1em; color: var(--ink3); text-transform: uppercase; display: block; margin-bottom: .4rem; }
.form-input { width: 100%; background: var(--s2); border: 1px solid var(--b2); border-radius: .6rem; color: var(--ink); padding: .55rem .8rem; font-size: .82rem; font-family: inherit; outline: none; transition: border-color .2s; }
.form-input:focus { border-color: var(--a); }
.form-row { display: flex; gap: .75rem; }

/* Search bar */
.search-bar { display: flex; gap: .65rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
.search-input { background: var(--s1); border: 1px solid var(--b1); border-radius: .65rem; color: var(--ink); padding: .5rem .9rem; font-family: inherit; font-size: .8rem; outline: none; flex: 1; min-width: 160px; }
.search-input:focus { border-color: var(--a); }

/* Toggle */
.toggle-wrap { display: flex; align-items: center; gap: .65rem; }
.toggle { width: 40px; height: 22px; border-radius: 999px; cursor: pointer; position: relative; transition: background .2s; flex-shrink: 0; }
.toggle-knob { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }

/* Toast */
.toast { position: fixed; bottom: 1.25rem; right: 1.25rem; background: var(--s2); border: 1px solid var(--b2); border-radius: .75rem; padding: .65rem 1.1rem; font-size: .82rem; z-index: 9999; transform: translateY(120px); transition: transform .28s; pointer-events: none; max-width: 300px; }
.toast.show { transform: translateY(0); }
.toast.ok { border-color: var(--gr); color: var(--gr); }
.toast.err { border-color: var(--re); color: var(--re); }

/* Login */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
.login-box { background: var(--s1); border: 1px solid var(--b2); border-radius: 1.25rem; padding: 2rem 1.75rem; width: 100%; max-width: 380px; }

/* Pagination */
.pagination { display: flex; align-items: center; gap: .5rem; margin-top: 1rem; justify-content: flex-end; }
.page-btn { padding: .3rem .65rem; border-radius: .45rem; background: var(--s1); border: 1px solid var(--b1); color: var(--ink3); cursor: pointer; font-size: .75rem; font-family: inherit; }
.page-btn:hover { border-color: var(--a); color: var(--a); }
.page-btn.active { background: var(--adim); border-color: var(--a); color: var(--a); }
.page-btn:disabled { opacity: .3; cursor: default; }

/* Tabs */
.mod-tabs { display: flex; gap: .4rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--b1); padding-bottom: .6rem; overflow-x: auto; scrollbar-width: none; }
.mod-tab { padding: .4rem .9rem; border-radius: .5rem .5rem 0 0; cursor: pointer; color: var(--ink3); font-size: .75rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; transition: all .15s; }
.mod-tab:hover { color: var(--ink2); }
.mod-tab.active { color: var(--a); background: var(--adim); border-color: rgba(0,200,255,.2); }

/* Hub gate card */
.gate-item { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; background: var(--s2); border: 1px solid var(--b1); border-radius: .85rem; margin-bottom: .5rem; }
.gate-ico { font-size: 1.1rem; width: 28px; text-align: center; flex-shrink: 0; }
.gate-info { flex: 1; min-width: 0; }
.gate-name { font-size: .82rem; font-weight: 700; color: var(--ink); }
.gate-desc { font-size: .65rem; color: var(--ink3); margin-top: .1rem; }

/* Mobile */
@media (max-width: 768px) {
  .admin-sidebar { width: 100%; height: auto; position: static; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--b1); padding: .35rem; }
  .admin-layout { flex-direction: column; }
  .sidebar-item { padding: .5rem .7rem; font-size: .72rem; }
  .sidebar-section { display: none; }
  .sidebar-sep { display: none; }
  .sidebar-link { display: none; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const SB_URL = 'https://zryrfmothjhywkklmniw.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyeXJmbW90aGpoeXdra2xtbml3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTYzNjEsImV4cCI6MjA5NDkzMjM2MX0.BWsZ5nXj8ePlB577zozrSO3voroRp8wkqGvM9MExaDg';
const sb = supabase.createClient(SB_URL, SB_ANON, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage,
    storageKey: 'sb-zryrfmothjhywkklmniw-auth-token',
    flowType: 'pkce'
  }
});

const RANK_COLORS = { E: '#9ca3af', D: '#22c55e', C: '#00c8ff', B: '#a855f7', A: '#fbbf24', S: '#ef4444', '★': '#ec4899' };
function getRankColor(xp) {
  if (xp >= 75000) return RANK_COLORS['★'];
  if (xp >= 25000) return RANK_COLORS.S;
  if (xp >= 10000) return RANK_COLORS.A;
  if (xp >= 4000) return RANK_COLORS.B;
  if (xp >= 1500) return RANK_COLORS.C;
  if (xp >= 500) return RANK_COLORS.D;
  return RANK_COLORS.E;
}
function getRankLabel(xp) {
  if (xp >= 75000) return '★';
  if (xp >= 25000) return 'S';
  if (xp >= 10000) return 'A';
  if (xp >= 4000) return 'B';
  if (xp >= 1500) return 'C';
  if (xp >= 500) return 'D';
  return 'E';
}

// Toast
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast ${type} show`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

function fmt(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}
function fmtFull(d) {
  if (!d) return '—';
  return new Date(d).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// ── Toggle component ──
function Toggle({ value, onChange, color = 'var(--a)' }) {
  return (
    <div onClick={() => onChange(!value)}
      className="toggle" style={{ background: value ? color : 'var(--b2)' }}>
      <div className="toggle-knob" style={{ left: value ? 21 : 3 }} />
    </div>
  );
}

// ── MODULE: Dashboard ──
function ModuleDashboard() {
  const [stats, setStats] = useState(null);
  const [recent, setRecent] = useState([]);
  useEffect(() => {
    (async () => {
      const today = new Date().toISOString().slice(0, 10);
      const [{ count: users }, { count: reads }, { count: todayReads }, { count: quizzes }, { count: comments }] = await Promise.all([
        sb.from('profiles').select('*', { count: 'exact', head: true }),
        sb.from('reads').select('*', { count: 'exact', head: true }),
        sb.from('reads').select('*', { count: 'exact', head: true }).eq('date', today),
        sb.from('quiz_history').select('*', { count: 'exact', head: true }),
        sb.from('comments').select('*', { count: 'exact', head: true }),
      ]);
      const { data: topAnec } = await sb.from('reads').select('anecdote_id, anecdotes(theme, date)').eq('date', today).limit(1).maybeSingle();
      setStats({ users: users || 0, reads: reads || 0, todayReads: todayReads || 0, quizzes: quizzes || 0, comments: comments || 0 });
      const { data: rec } = await sb.from('reads').select('user_id, created_at, anecdotes(theme), profiles(username)').order('created_at', { ascending: false }).limit(8);
      setRecent(rec || []);
    })();
  }, []);
  if (!stats) return <div style={{ color: 'var(--ink3)', padding: '2rem' }}>Chargement…</div>;
  const CARDS = [
    { lbl: 'Utilisateurs', val: stats.users, color: 'rgba(0,200,255,.12)', icon: '👥' },
    { lbl: 'Lectures totales', val: stats.reads, color: 'rgba(52,211,153,.12)', icon: '📖' },
    { lbl: 'Lectures aujourd\'hui', val: stats.todayReads, color: 'rgba(251,191,36,.12)', icon: '📅' },
    { lbl: 'Quiz joués', val: stats.quizzes, color: 'rgba(168,85,247,.12)', icon: '🎯' },
    { lbl: 'Commentaires', val: stats.comments, color: 'rgba(249,115,22,.12)', icon: '💬' },
  ];
  return (
    <div>
      <div style={{ marginBottom: '1.5rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: 'var(--a)', textTransform: 'uppercase', marginBottom: '.3rem' }}>📊 VUE D'ENSEMBLE</div>
        <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--ink)' }}>Dashboard</div>
      </div>
      <div className="stats-grid">
        {CARDS.map(c => (
          <div key={c.lbl} className="stat-card" style={{ '--card-color': c.color }}>
            <div style={{ fontSize: '1.1rem', marginBottom: '.4rem' }}>{c.icon}</div>
            <div className="stat-val">{c.val.toLocaleString('fr-FR')}</div>
            <div className="stat-lbl">{c.lbl}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-title">📡 Activité récente</div>
        {recent.length === 0 ? <div style={{ color: 'var(--ink3)', fontSize: '.78rem' }}>Aucune activité récente.</div> :
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>Utilisateur</th><th>Anecdote</th><th>Date</th></tr></thead>
            <tbody>
              {recent.map((r, i) => (
                <tr key={i}>
                  <td className="td-main">{r.profiles?.username || '—'}</td>
                  <td>{r.anecdotes?.theme || '—'}</td>
                  <td>{fmtFull(r.created_at)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>}
      </div>
    </div>
  );
}

// ── MODULE: Anecdotes ──
function ModuleAnecdotes() {
  const PAGE = 15;
  const [items, setItems] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(0);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('anecdotes').select('id, date, theme, icon, chooser, created_at', { count: 'exact' }).order('date', { ascending: false }).range(page * PAGE, (page + 1) * PAGE - 1);
    if (search) q = q.ilike('theme', `%${search}%`);
    const { data, count } = await q;
    setItems(data || []);
    setTotal(count || 0);
    setLoading(false);
  }, [page, search]);
  useEffect(() => { load(); }, [load]);
  async function deleteAnec(id) {
    if (!confirm('Supprimer cette anecdote et toutes ses données associées ?')) return;
    try {
      for (const t of ['reads', 'quiz_history', 'questions', 'reactions', 'comments']) {
        await sb.from(t).delete().eq('anecdote_id', id);
      }
      await sb.from('anecdotes').delete().eq('id', id);
      showToast('✓ Anecdote supprimée');
      load();
    } catch (e) { showToast('Erreur: ' + e.message, 'err'); }
  }
  const pages = Math.ceil(total / PAGE);
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
        <div>
          <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: 'var(--a)', textTransform: 'uppercase', marginBottom: '.3rem' }}>📖 CONTENU</div>
          <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--ink)' }}>Anecdotes <span style={{ fontSize: '1rem', color: 'var(--ink3)', fontWeight: 500 }}>({total})</span></div>
        </div>
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="Rechercher par thème…" value={search} onChange={e => { setSearch(e.target.value); setPage(0); }} />
      </div>
      <div className="card" style={{ padding: 0 }}>
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>Date</th><th>Thème</th><th>Choisi par</th><th>Actions</th></tr></thead>
            <tbody>
              {loading ? <tr><td colSpan={4} style={{ textAlign: 'center', color: 'var(--ink3)', padding: '2rem' }}>Chargement…</td></tr> :
               items.map(a => (
                <tr key={a.id}>
                  <td style={{ fontFamily: 'monospace', fontSize: '.75rem' }}>{a.date}</td>
                  <td className="td-main">{a.icon} {a.theme}</td>
                  <td>{a.chooser || '—'}</td>
                  <td><button className="btn btn-danger btn-sm" onClick={() => deleteAnec(a.id)}>✕ Suppr.</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      {pages > 1 && (
        <div className="pagination">
          <button className="page-btn" disabled={page === 0} onClick={() => setPage(p => p - 1)}>← Préc.</button>
          <span style={{ fontSize: '.75rem', color: 'var(--ink3)' }}>{page + 1} / {pages}</span>
          <button className="page-btn" disabled={page >= pages - 1} onClick={() => setPage(p => p + 1)}>Suiv. →</button>
        </div>
      )}
    </div>
  );
}

// ── MODULE: Utilisateurs ──
function ModuleUsers() {
  const PAGE = 20;
  const [items, setItems] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(0);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const load = useCallback(async () => {
    setLoading(true);
    let q = sb.from('profiles').select('id, username, joined, role, streak_record', { count: 'exact' }).order('joined', { ascending: false }).range(page * PAGE, (page + 1) * PAGE - 1);
    if (search) q = q.ilike('username', `%${search}%`);
    const { data, count } = await q;
    setItems(data || []);
    setTotal(count || 0);
    setLoading(false);
  }, [page, search]);
  useEffect(() => { load(); }, [load]);
  async function setRole(id, role) {
    await sb.from('profiles').update({ role }).eq('id', id);
    showToast('✓ Rôle mis à jour');
    load();
  }
  async function resetXp(id, username) {
    if (!window.confirm('Remettre à zéro le XP de ' + (username || 'ce membre') + ' ?\n\nÇa efface ses lectures, quiz et énigmes, et remet son record de streak à 0. Action irréversible.')) return;
    try {
      const r = await Promise.all([
        sb.from('reads').delete().eq('user_id', id),
        sb.from('quiz_history').delete().eq('user_id', id),
        sb.from('enigma_responses').delete().eq('user_id', id),
        sb.from('profiles').update({ streak_record: 0 }).eq('id', id),
      ]);
      const err = r.find(x => x && x.error);
      if (err) { showToast('⚠️ Reset partiel : ' + (err.error.message || 'erreur RLS')); }
      else { showToast('✓ XP remis à zéro'); }
    } catch (e) { showToast('⚠️ Erreur : ' + e.message); }
    load();
  }
  async function deleteUser(id, username) {
    if (!window.confirm('SUPPRIMER ' + (username || 'ce membre') + ' ?\n\nÇa efface son profil + toute son activité (lectures, quiz, énigmes). Action irréversible.\n\n⚠️ Son compte de connexion (auth) doit être supprimé à part dans Supabase.')) return;
    try {
      await Promise.all([
        sb.from('reads').delete().eq('user_id', id),
        sb.from('quiz_history').delete().eq('user_id', id),
        sb.from('enigma_responses').delete().eq('user_id', id),
      ]);
      const { error } = await sb.from('profiles').delete().eq('id', id);
      if (error) { showToast('⚠️ Suppression échouée : ' + (error.message || 'erreur RLS')); }
      else { showToast('✓ Membre supprimé'); }
    } catch (e) { showToast('⚠️ Erreur : ' + e.message); }
    load();
  }
  const pages = Math.ceil(total / PAGE);
  return (
    <div>
      <div style={{ marginBottom: '1.5rem' }}>
        <div style={{ fontSize: '.55rem', fontWeight: 700, letterSpacing: '.2em', color: 'var(--a)', textTransform: 'uppercase', marginBottom: '.3rem' }}>👥 MEMBRES</div>
        <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--ink)' }}>Utilisateurs <span style={{ fontSize: '1rem', color: 'var(--ink3)', fontWeight: 500 }}>({total})</span></div>
      </div>
      <div className="search-bar">
        <input className="search-input" placeholder="Rechercher par pseudo…" value={search} onChange={e => { setSearch(e.target.value); setPage(0); }} />
      </div>
      <div className="card" style={{ padding: 0 }}>
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>Pseudo</th><th>Record streak</th><th>Rôle</th><th>Inscrit</th><th>Actions</th></tr></thead>
            <tbody>
              {loading ? <tr><td colSpan={5} style={{ textAlign: 'center', color: 'var(--ink3)', padding: '2rem' }}>Chargement…</td></tr> :
               items.length === 0 ? <tr><td colSpan={5} style={{ textAlign: 'center', color: 'var(--ink3)', padding: '2rem' }}>Aucun utilisateur</td></tr> :
               items.map(u => {
                return (
                  <tr key={u.id}>
                    <td className="td-main">{u.username || '—'}</td>
                    <td>🔥 {u.streak_record || 0}</td>
                    <td>
                      <select value={u.role || 'user'} onChange={e => setRole(u.id, e.target.value)}
                        style={{ background: 'var(--s2)', border: '1px solid var(--b1)', borderRadius: '.4rem', color: 'var(--ink2)', padding: '.2rem .45rem', fontSize: '.72rem', fontFamily: 'inherit', cursor: 'pointer' }}>
                        <option value="user">User</option>
                        <option value="beta_tester">Beta tester</option>
                        <option value="moderator">Mod</option>
                        <option value="admin">Admin</option>
                      </select>
                    </td>
                    <td style={{ fontSize: '.72rem' }}>{fmt(u.joined)}</td>
                    <td>
                      <div style={{ display: 'flex', gap: '.4rem', flexWrap: 'wrap' }}>
                        <button onClick={() => resetXp(u.id, u.username)}
                          style={{ background: 'rgba(239,68,68,.1)', border: '1px solid rgba(239,68,68,.3)', borderRadius: '.4rem', color: '#f87171', padding: '.25rem .6rem', fontSize: '.7rem', fontFamily: 'inherit', fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap' }}
                          title="Efface lectures, quiz, énigmes et remet le streak à 0">↺ Reset XP</button>
                        <button onClick={() => deleteUser(u.id, u.username)}
                          style={{ background: 'rgba(239,68,68,.16)', border: '1px solid rgba(239,68,68,.45)', borderRadius: '.4rem', color: '#ef4444', padding: '.25rem .55rem', fontSize: '.7rem', fontFamily: 'inherit', fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap' }}

// ── LOGIN ──
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  async function login() {
    setErr(''); setLoading(true);
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('Délai dépassé, vérifie ta connexion et réessaie')), ms))]);
    try {
      const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pass }), 15000);
      if (error) throw error;
      const { data: profile } = await withTimeout(sb.from('profiles').select('role').eq('id', data.user.id).maybeSingle(), 15000);
      if (!profile || (profile.role !== 'admin' && profile.role !== 'moderator')) {
        await sb.auth.signOut();
        throw new Error('Accès refusé : rôle admin requis');
      }
      onLogin(data.user, profile);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div style={{ textAlign: 'center', marginBottom: '1.75rem' }}>
          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--ink)', marginBottom: '.25rem' }}>
            <span style={{ color: 'var(--a)' }}>•</span> La Curiosphère
          </div>
          <div style={{ fontSize: '.65rem', fontWeight: 700, letterSpacing: '.15em', color: 'var(--ink3)', textTransform: 'uppercase' }}>Panneau d'administration</div>
        </div>
        <div className="form-group">
          <label className="form-label">Email admin</label>
          <input className="form-input" type="email" autoCapitalize="none" autoCorrect="off" autoComplete="email" inputMode="email" spellCheck={false} value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && login()} placeholder="admin@curiosphere.fr" />
        </div>
        <div className="form-group">
          <label className="form-label">Mot de passe</label>
          <input className="form-input" type="password" value={pass} onChange={e => setPass(e.target.value)} onKeyDown={e => e.key === 'Enter' && login()} placeholder="••••••••" />
        </div>
        {err && <div style={{ fontSize: '.75rem', color: 'var(--re)', marginBottom: '.75rem', padding: '.5rem .75rem', background: 'rgba(248,113,113,.08)', borderRadius: '.5rem', border: '1px solid rgba(248,113,113,.2)' }}>{err}</div>}
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '.7rem' }} onClick={login} disabled={loading}>
          {loading ? '…' : '→ Accéder au panneau'}
        </button>
      </div>
    </div>
  );
}

    setUser(null); setProfile(null);
  }

  if (!user) return <LoginScreen onLogin={(u, p) => { setUser(u); setProfile(p); }} />;

  const isAdmin = profile?.role === 'admin';
  const isMod = profile?.role === 'moderator';

  const ALL_MODULES = [
    { id: 'dashboard', ico: '📊', lbl: 'Dashboard' },
    ...(isAdmin ? [
      { id: 'users', ico: '👥', lbl: 'Utilisateurs' },
    ] : []),
    { id: 'comments', ico: '💬', lbl: 'Commentaires' },
    ...(isAdmin ? [null] : []),
    ...(isAdmin ? [
      { id: 'hub', ico: '⚙️', lbl: 'Hub' },
      { id: 'content', ico: '📚', lbl: 'Contenu' },
      { id: 'defis', ico: '⚔️', lbl: 'Défis' },
      { id: 'notifs', ico: '🔔', lbl: 'Notifications' },
    ] : []),
  ];
  const MODULE_COMPONENTS = { dashboard: ModuleDashboard, users: ModuleUsers, comments: ModuleComments, hub: ModuleHub, content: ModuleContent, defis: ModuleDefis, notifs: ModuleNotifs };
  const ActiveModule = MODULE_COMPONENTS[mod] || ModuleDashboard;

  return (
    <>
      <header className="admin-header">
        <div className="admin-logo">
          <div className="dot" />
          La Curiosphère <span className="admin-badge">{isMod ? 'Modérateur' : 'Admin'}</span>
        </div>
        <div className="admin-user-chip">
          <span>{profile?.username || user.email}</span>
          <button className="admin-logout" onClick={logout}>Déconnexion</button>
        </div>
      </header>
      <div className="admin-layout">
        <aside className="admin-sidebar">
          <div style={{ padding: '.5rem .35rem', flex: 1 }}>
            {ALL_MODULES.map((m, i) => m === null
              ? <div key={i} className="sidebar-sep" />
              : <div key={m.id} className={`sidebar-item ${mod === m.id ? 'active' : ''}`} onClick={() => setMod(m.id)}>
                  <span className="ico">{m.ico}</span>
                  <span>{m.lbl}</span>
                </div>
            )}
          </div>
          <div style={{ borderTop: '1px solid var(--b1)', padding: '.5rem' }}>
            <div className="sidebar-section">Liens</div>
            <a className="sidebar-link" href="Le Curioscope v3.html" target="_blank">→ Ouvrir le proto</a>
            {isAdmin && <a className="sidebar-link" href="https://zryrfmothjhywkklmniw.supabase.co" target="_blank">→ Supabase</a>}
          </div>
        </aside>
        <main className="admin-main">
          <ActiveModule key={mod} />
        </main>
      </div>
      <div id="toast" className="toast" />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
